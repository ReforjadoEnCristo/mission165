  {"ref": "Romans 15:4", "refEs": "Romanos 15:4", "en": "For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope.", "es": "Porque las cosas que antes fueron escritas, para nuestra enseñanza fueron escritas; para que por la paciencia, y por la consolación de las Escrituras, tengamos esperanza."},
  {"ref": "Psalm 25:4", "refEs": "Salmos 25:4", "en": "Shew me thy ways, O Lord; teach me thy paths.", "es": "Muéstrame, oh Jehová, tus caminos; enséñame tus sendas."},
  {"ref": "James 1:22", "refEs": "Santiago 1:22", "en": "But be ye doers of the word, and not hearers only, deceiving your own selves.", "es": "Mas sed hacedores de la palabra, y no tan solamente oidores, engañándoos á vosotros mismos."},
  {"ref": "Isaiah 41:10", "refEs": "Isaías 41:10", "en": "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.", "es": "No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia."},
  {"ref": "Ecclesiastes 4:9", "refEs": "Eclesiastés 4:9", "en": "Two are better than one; because they have a good reward for their labour.", "es": "Mejores son dos que uno; porque tienen mejor paga de su trabajo."},
  {"ref": "Psalm 91:4", "refEs": "Salmos 91:4", "en": "He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.", "es": "Con sus plumas te cubrirá, y debajo de sus alas estarás seguro: escudo y adarga es su verdad."},
  {"ref": "2 Samuel 22:3", "refEs": "2 Samuel 22:3", "en": "The God of my rock; in him will I trust: he is my shield, and the horn of my salvation, my high tower, and my refuge, my saviour; thou savest me from violence.", "es": "Dios de mi roca, en él confiaré: mi escudo, y el cuerno de mi salud, mi fortaleza, y mi refugio; mi salvador, que me librarás de violencia."},
  {"ref": "Psalm 73:26", "refEs": "Salmos 73:26", "en": "My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.", "es": "Mi carne y mi corazón desfallecen: mas la roca de mi corazón y mi porción es Dios para siempre."},
  {"ref": "Psalm 46:5", "refEs": "Salmos 46:5", "en": "God is in the midst of her; she shall not be moved: God shall help her, and that right early.", "es": "Dios está en medio de ella; no será conmovida: Dios la ayudará al clarear la mañana."},
  {"ref": "Matthew 6:34", "refEs": "Mateo 6:34", "en": "Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.", "es": "Así que, no os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán."},
  {"ref": "Proverbs 6:6", "refEs": "Proverbios 6:6", "en": "Go to the ant, thou sluggard; consider her ways, and be wise:", "es": "Ve á la hormiga, oh perezoso, mira sus caminos, y sé sabio;"},
  {"ref": "Hebrews 4:16", "refEs": "Hebreos 4:16", "en": "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", "es": "Lleguémonos pues confiadamente al trono de la gracia, para alcanzar misericordia, y hallar gracia para el oportuno socorro."},
  {"ref": "1 Thessalonians 5:24", "refEs": "1 Tesalonicenses 5:24", "en": "Faithful is he that calleth you, who also will do it.", "es": "Fiel es el que os ha llamado; el cual también lo hará."},
  {"ref": "Ephesians 6:14", "refEs": "Efesios 6:14", "en": "Stand therefore, having your loins girt about with truth, and having on the breastplate of righteousness;", "es": "Estad pues firmes, ceñidos vuestros lomos de verdad, y vestidos de la cota de justicia,"},
  {"ref": "Psalm 119:11", "refEs": "Salmos 119:11", "en": "Thy word have I hid in mine heart, that I might not sin against thee.", "es": "En mi corazón he guardado tus dichos, para no pecar contra ti."},
  {"ref": "Nehemiah 8:10", "refEs": "Nehemías 8:10", "en": "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.", "es": "Díjoles luego: Id, comed grosuras, y bebed vino dulce, y enviad porciones á los que no tienen prevenido; porque día santo es á nuestro Señor: y no os entristezcáis, porque el gozo de Jehová es vuestra fortaleza."},
  {"ref": "Psalm 25:5", "refEs": "Salmos 25:5", "en": "Lead me in thy truth, and teach me: for thou art the God of my salvation; on thee do I wait all the day.", "es": "Encamíname en tu verdad, y enséñame; porque tú eres el Dios de mi salud: en ti he esperado todo el día."},
  {"ref": "2 Corinthians 7:1", "refEs": "2 Corintios 7:1", "en": "Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.", "es": "ASÍ que, amados, pues tenemos tales promesas, limpiémonos de toda inmundicia de carne y de espíritu, perfeccionando la santificación en temor de Dios."},
  {"ref": "Jeremiah 17:8", "refEs": "Jeremías 17:8", "en": "For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.", "es": "Porque él será como el árbol plantado junto á las aguas, que junto á la corriente echará sus raices, y no verá cuando viniere el calor, sino que su hoja estará verde; y en el año de sequía no se fatigará, ni dejará de hacer fruto."},
  {"ref": "Jeremiah 29:11", "refEs": "Jeremías 29:11", "en": "For I know the thoughts that I think toward you, saith the Lord, thoughts of peace, and not of evil, to give you an expected end.", "es": "Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis."},
  {"ref": "Matthew 26:41", "refEs": "Mateo 26:41", "en": "Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak.", "es": "Velad y orad, para que no entréis en tentación: el espíritu á la verdad está presto, mas la carne enferma."},
  {"ref": "Psalm 143:10", "refEs": "Salmos 143:10", "en": "Teach me to do thy will; for thou art my God: thy spirit is good; lead me into the land of uprightness.", "es": "Enséñame á hacer tu voluntad, porque tú eres mi Dios: tu buen espíritu me guíe á tierra de rectitud."},
  {"ref": "Romans 8:38", "refEs": "Romanos 8:38", "en": "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come,", "es": "Por lo cual estoy cierto que ni la muerte, ni la vida, ni ángeles, ni principados, ni potestades, ni lo presente, ni lo por venir,"},
  {"ref": "2 Samuel 22:33", "refEs": "2 Samuel 22:33", "en": "God is my strength and power: and he maketh my way perfect.", "es": "Dios es el que con virtud me corrobora, y el que despeja mi camino;"},
  {"ref": "Philippians 4:7", "refEs": "Filipenses 4:7", "en": "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.", "es": "Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús."},
  {"ref": "Psalm 119:114", "refEs": "Salmos 119:114", "en": "Thou art my hiding place and my shield: I hope in thy word.", "es": "Mi escondedero y mi escudo eres tú: en tu palabra he esperado."},
  {"ref": "Revelation 2:10", "refEs": "Apocalipsis 2:10", "en": "Fear none of those things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried; and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.", "es": "No tengas ningún temor de las cosas que has de padecer. He aquí, el diablo ha de enviar algunos de vosotros á la cárcel, para que seáis probados, y tendréis tribulación de diez días. Sé fiel hasta la muerte, y yo te daré la corona de la vida."},
  {"ref": "1 Timothy 4:7", "refEs": "1 Timoteo 4:7", "en": "But refuse profane and old wives’ fables, and exercise thyself rather unto godliness.", "es": "Mas las fábulas profanas y de viejas desecha, y ejercítate para la piedad."},
  {"ref": "Habakkuk 3:18", "refEs": "Habacuc 3:18", "en": "Yet I will rejoice in the Lord, I will joy in the God of my salvation.", "es": "Con todo, yo me alegraré en Jehová, y me gozaré en el Dios de mi salud."},
  {"ref": "Psalm 105:4", "refEs": "Salmos 105:4", "en": "Seek the Lord, and his strength: seek his face evermore.", "es": "Buscad á Jehová, y su fortaleza: buscad siempre su rostro."},
  {"ref": "Micah 7:7", "refEs": "Miqueas 7:7", "en": "Therefore I will look unto the Lord; I will wait for the God of my salvation: my God will hear me.", "es": "Yo empero á Jehová esperaré, esperaré al Dios de mi salud: el Dios mío me oirá."},
  {"ref": "Psalm 118:24", "refEs": "Salmos 118:24", "en": "This is the day which the Lord hath made; we will rejoice and be glad in it.", "es": "Este es el día que hizo Jehová: nos gozaremos y alegraremos en él."},
  {"ref": "Psalm 16:11", "refEs": "Salmos 16:11", "en": "Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.", "es": "Me mostrarás la senda de la vida: hartura de alegrías hay con tu rostro; deleites en tu diestra para siempre."},
  {"ref": "Isaiah 30:15", "refEs": "Isaías 30:15", "en": "For thus saith the Lord God, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would not.", "es": "Porque así dijo el Señor Jehová, el Santo de Israel: En descanso y en reposo seréis salvos; en quietud y en confianza será vuestra fortaleza. Y no quisisteis,"},
  {"ref": "2 Corinthians 5:7", "refEs": "2 Corintios 5:7", "en": "(For we walk by faith, not by sight:)", "es": "(Porque por fe andamos, no por vista;)"},
  {"ref": "Joshua 1:7", "refEs": "Josué 1:7", "en": "Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest.", "es": "Solamente te esfuerces, y seas muy valiente, para cuidar de hacer conforme á toda la ley que mi siervo Moisés te mandó: no te apartes de ella ni á diestra ni á siniestra, para que seas prosperado en todas las cosas que emprendieres."},
  {"ref": "Psalm 68:35", "refEs": "Salmos 68:35", "en": "O God, thou art terrible out of thy holy places: the God of Israel is he that giveth strength and power unto his people. Blessed be God.", "es": "Terrible eres, oh Dios, desde tus santuarios: el Dios de Israel, él da fortaleza y vigor á su pueblo. Bendito Dios."},
  {"ref": "Psalm 119:28", "refEs": "Salmos 119:28", "en": "My soul melteth for heaviness: strengthen thou me according unto thy word.", "es": "Deshácese mi alma de ansiedad: corrobórame según tu palabra."},
  {"ref": "Psalm 34:8", "refEs": "Salmos 34:8", "en": "O taste and see that the Lord is good: blessed is the man that trusteth in him.", "es": "Gustad, y ved que es bueno Jehová: dichoso el hombre que confiará en él."},
  {"ref": "Proverbs 23:12", "refEs": "Proverbios 23:12", "en": "Apply thine heart unto instruction, and thine ears to the words of knowledge.", "es": "Aplica tu corazón á la enseñanza, y tus oídos á las palabras de sabiduría."},
  {"ref": "Isaiah 40:29", "refEs": "Isaías 40:29", "en": "He giveth power to the faint; and to them that have no might he increaseth strength.", "es": "El da esfuerzo al cansado, y multiplica las fuerzas al que no tiene ningunas."},
  {"ref": "Psalm 33:20", "refEs": "Salmos 33:20", "en": "Our soul waiteth for the Lord: he is our help and our shield.", "es": "Nuestra alma esperó á Jehová; nuestra ayuda y nuestro escudo es él."},
  {"ref": "Proverbs 16:32", "refEs": "Proverbios 16:32", "en": "He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.", "es": "Mejor es el que tarde se aira que el fuerte; y el que se enseñorea de su espíritu, que el que toma una ciudad."},
  {"ref": "Proverbs 10:9", "refEs": "Proverbios 10:9", "en": "He that walketh uprightly walketh surely: but he that perverteth his ways shall be known.", "es": "El que camina en integridad, anda confiado: mas el que pervierte sus caminos, será quebrantado."},
  {"ref": "2 Corinthians 4:8", "refEs": "2 Corintios 4:8", "en": "We are troubled on every side, yet not distressed; we are perplexed, but not in despair;", "es": "Estando atribulados en todo, mas no angustiados; en apuros, mas no desesperamos;"},
  {"ref": "Hebrews 10:36", "refEs": "Hebreos 10:36", "en": "For ye have need of patience, that, after ye have done the will of God, ye might receive the promise.", "es": "Porque la paciencia os es necesaria; para que, habiendo hecho la voluntad de Dios, obtengáis la promesa."},
  {"ref": "Titus 2:12", "refEs": "Tito 2:12", "en": "Teaching us that, denying ungodliness and worldly lusts, we should live soberly, righteously, and godly, in this present world;", "es": "Enseñándonos que, renunciando á la impiedad y á los deseos mundanos, vivamos en este siglo templada, y justa, y píamente,"},
  {"ref": "Psalm 139:14", "refEs": "Salmos 139:14", "en": "I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.", "es": "Te alabaré; porque formidables, maravillosas son tus obras: estoy maravillado, y mi alma lo conoce mucho."},
  {"ref": "2 Corinthians 4:16", "refEs": "2 Corintios 4:16", "en": "For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day.", "es": "Por tanto, no desmayamos: antes aunque este nuestro hombre exterior se va desgastando, el interior empero se renueva de día en día."},
  {"ref": "Isaiah 35:3", "refEs": "Isaías 35:3", "en": "Strengthen ye the weak hands, and confirm the feeble knees.", "es": "Confortad á las manos cansadas, roborad las vacilantes rodillas."},
  {"ref": "Exodus 14:14", "refEs": "Éxodo 14:14", "en": "The Lord shall fight for you, and ye shall hold your peace.", "es": "Jehová peleará por vosotros, y vosotros estaréis quedos."},
  {"ref": "Proverbs 16:9", "refEs": "Proverbios 16:9", "en": "A man’s heart deviseth his way: but the Lord directeth his steps.", "es": "El corazón del hombre piensa su camino: mas Jehová endereza sus pasos."},
  {"ref": "2 Corinthians 10:5", "refEs": "2 Corintios 10:5", "en": "Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;", "es": "Destruyendo consejos, y toda altura que se levanta contra la ciencia de Dios, y cautivando todo intento á la obediencia de Cristo;"},
  {"ref": "2 Timothy 2:3", "refEs": "2 Timoteo 2:3", "en": "Thou therefore endure hardness, as a good soldier of Jesus Christ.", "es": "Tú pues, sufre trabajos como fiel soldado de Jesucristo."},
  {"ref": "Psalm 1:1", "refEs": "Salmos 1:1", "en": "Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful.", "es": "BIENAVENTURADO el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado;"},
  {"ref": "Deuteronomy 33:27", "refEs": "Deuteronomio 33:27", "en": "The eternal God is thy refuge, and underneath are the everlasting arms: and he shall thrust out the enemy from before thee; and shall say, Destroy them.", "es": "El eterno Dios es tu refugio, y acá abajo los brazos eternos; él echará de delante de ti al enemigo, y dirá: Destruye."},
  {"ref": "Ephesians 5:15", "refEs": "Efesios 5:15", "en": "See then that ye walk circumspectly, not as fools, but as wise,", "es": "Mirad, pues, cómo andéis avisadamente; no como necios, mas como sabios;"},
  {"ref": "Zechariah 4:10", "refEs": "Zacarías 4:10", "en": "For who hath despised the day of small things? for they shall rejoice, and shall see the plummet in the hand of Zerubbabel with those seven; they are the eyes of the Lord, which run to and fro through the whole earth.", "es": "Porque los que menospreciaron el día de las pequeñeces se alegrarán, y verán la plomada en la mano de Zorobabel. Aquellas siete son los ojos de Jehová que recorren por toda la tierra."},
  {"ref": "Ezekiel 36:26", "refEs": "Ezequiel 36:26", "en": "A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.", "es": "Y os daré corazón nuevo, y pondré espíritu nuevo dentro de vosotros; y quitaré de vuestra carne el corazón de piedra, y os daré corazón de carne."},
  {"ref": "Psalm 3:3", "refEs": "Salmos 3:3", "en": "But thou, O Lord, art a shield for me; my glory, and the lifter up of mine head.", "es": "Mas tú, Jehová, eres escudo alrededor de mí: mi gloria, y el que ensalza mi cabeza."},
  {"ref": "1 Samuel 16:7", "refEs": "1 Samuel 16:7", "en": "But the Lord said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the Lord seeth not as man seeth; for man looketh on the outward appearance, but the Lord looketh on the heart.", "es": "Y Jehová respondió á Samuel: No mires á su parecer, ni á lo grande de su estatura, porque yo lo desecho; porque Jehová mira no lo que el hombre mira; pues que el hombre mira lo que está delante de sus ojos, mas Jehová mira el corazón."},
  {"ref": "Proverbs 24:5", "refEs": "Proverbios 24:5", "en": "A wise man is strong; yea, a man of knowledge increaseth strength.", "es": "El hombre sabio es fuerte; y de pujante vigor el hombre docto."},
  {"ref": "1 Chronicles 16:11", "refEs": "1 Crónicas 16:11", "en": "Seek the Lord and his strength, seek his face continually.", "es": "Buscad á Jehová y su fortaleza; buscad su rostro continuamente."},
  {"ref": "Isaiah 40:8", "refEs": "Isaías 40:8", "en": "The grass withereth, the flower fadeth: but the word of our God shall stand for ever.", "es": "Sécase la hierba, cáese la flor: mas la palabra del Dios nuestro permanece para siempre."},
  {"ref": "Psalm 37:24", "refEs": "Salmos 37:24", "en": "Though he fall, he shall not be utterly cast down: for the Lord upholdeth him with his hand.", "es": "Cuando cayere, no quedará postrado; porque Jehová sostiene su mano."},
  {"ref": "Micah 7:8", "refEs": "Miqueas 7:8", "en": "Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the Lord shall be a light unto me.", "es": "Tú, enemiga mía, no te huelgues de mí: porque aunque caí, he de levantarme; aunque more en tinieblas, Jehová será mi luz."},
  {"ref": "Psalm 37:5", "refEs": "Salmos 37:5", "en": "Commit thy way unto the Lord; trust also in him; and he shall bring it to pass.", "es": "Encomienda á Jehová tu camino, y espera en él; y él hará."},
  {"ref": "Romans 13:14", "refEs": "Romanos 13:14", "en": "But put ye on the Lord Jesus Christ, and make not provision for the flesh, to fulfil the lusts thereof.", "es": "Mas vestíos del Señor Jesucristo, y no hagáis caso de la carne en sus deseos."},
  {"ref": "Psalm 56:3", "refEs": "Salmos 56:3", "en": "What time I am afraid, I will trust in thee.", "es": "En el día que temo, yo en ti confío."},
  {"ref": "Galatians 2:20", "refEs": "Gálatas 2:20", "en": "I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.", "es": "Con Cristo estoy juntamente crucificado, y vivo, no ya yo, mas vive Cristo en mí: y lo que ahora vivo en la carne, lo vivo en la fe del Hijo de Dios, el cual me amó, y se entregó á sí mismo por mí."},
  {"ref": "Psalm 59:17", "refEs": "Salmos 59:17", "en": "Unto thee, O my strength, will I sing: for God is my defence, and the God of my mercy.", "es": "Fortaleza mía, á ti cantaré; porque eres Dios de mi amparo, Dios de mi misericordia."},
  {"ref": "Matthew 17:20", "refEs": "Mateo 17:20", "en": "And Jesus said unto them, Because of your unbelief: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you.", "es": "Y Jesús les dijo: Por vuestra incredulidad; porque de cierto os digo, que si tuviereis fe como un grano de mostaza, diréis á este monte: Pásate de aquí allá: y se pasará: y nada os será imposible."},
  {"ref": "2 Samuel 22:40", "refEs": "2 Samuel 22:40", "en": "For thou hast girded me with strength to battle: them that rose up against me hast thou subdued under me.", "es": "Ceñísteme de fortaleza para la batalla, y postraste debajo de mí los que contra mí se levantaron."},
  {"ref": "Psalm 23:1", "refEs": "Salmos 23:1", "en": "The Lord is my shepherd; I shall not want.", "es": "JEHOVÁ es mi pastor; nada me faltará."},
  {"ref": "2 Timothy 4:7", "refEs": "2 Timoteo 4:7", "en": "I have fought a good fight, I have finished my course, I have kept the faith:", "es": "He peleado la buena batalla, he acabado la carrera, he guardado la fe."},
  {"ref": "Psalm 103:2", "refEs": "Salmos 103:2", "en": "Bless the Lord, O my soul, and forget not all his benefits:", "es": "Bendice, alma mía á Jehová, y no olvides ninguno de sus beneficios."},
  {"ref": "Psalm 71:5", "refEs": "Salmos 71:5", "en": "For thou art my hope, O Lord God: thou art my trust from my youth.", "es": "Porque tú, oh Señor Jehová, eres mi esperanza: seguridad mía desde mi juventud."},
  {"ref": "Ezra 10:4", "refEs": "Esdras 10:4", "en": "Arise; for this matter belongeth unto thee: we also will be with thee: be of good courage, and do it.", "es": "Levántate, porque á ti toca el negocio, y nosotros seremos contigo; esfuérzate, y ponlo por obra."},
  {"ref": "Galatians 5:16", "refEs": "Gálatas 5:16", "en": "This I say then, Walk in the Spirit, and ye shall not fulfil the lust of the flesh.", "es": "Digo pues: Andad en el Espíritu, y no satisfagáis la concupiscencia de la carne."},
  {"ref": "Ephesians 3:16", "refEs": "Efesios 3:16", "en": "That he would grant you, according to the riches of his glory, to be strengthened with might by his Spirit in the inner man;", "es": "Que os dé, conforme á las riquezas de su gloria, el ser corroborados con potencia en el hombre interior por su Espíritu."},
  {"ref": "Psalm 84:5", "refEs": "Salmos 84:5", "en": "Blessed is the man whose strength is in thee; in whose heart are the ways of them.", "es": "Bienaventurado el hombre que tiene su fortaleza en ti; en cuyo corazón están tus caminos."},
  {"ref": "2 Corinthians 9:8", "refEs": "2 Corintios 9:8", "en": "And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:", "es": "Y poderoso es Dios para hacer que abunde en vosotros toda gracia; á fin de que, teniendo siempre en todas las cosas todo lo que basta, abundéis para toda buena obra:"},
  {"ref": "John 10:10", "refEs": "Juan 10:10", "en": "The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.", "es": "El ladrón no viene sino para hurtar, y matar, y destruir: yo he venido para que tengan vida, y para que la tengan en abundancia."},
  {"ref": "Proverbs 21:5", "refEs": "Proverbios 21:5", "en": "The thoughts of the diligent tend only to plenteousness; but of every one that is hasty only to want.", "es": "Los pensamientos del solícito ciertamente van á abundancia; mas todo presuroso, indefectiblemente á pobreza."},
  {"ref": "2 Timothy 2:22", "refEs": "2 Timoteo 2:22", "en": "Flee also youthful lusts: but follow righteousness, faith, charity, peace, with them that call on the Lord out of a pure heart.", "es": "Huye también los deseos juveniles; y sigue la justicia, la fe, la caridad, la paz, con los que invocan al Señor de puro corazón."},
  {"ref": "2 Corinthians 4:9", "refEs": "2 Corintios 4:9", "en": "Persecuted, but not forsaken; cast down, but not destroyed;", "es": "Perseguidos, mas no desamparados; abatidos, mas no perecemos;"},
  {"ref": "Psalm 118:14", "refEs": "Salmos 118:14", "en": "The Lord is my strength and song, and is become my salvation.", "es": "Mi fortaleza y mi canción es JAH; y él me ha sido por salud."},
  {"ref": "Proverbs 25:28", "refEs": "Proverbios 25:28", "en": "He that hath no rule over his own spirit is like a city that is broken down, and without walls.", "es": "Como ciudad derribada y sin muro, es el hombre cuyo espíritu no tiene rienda."},
  {"ref": "1 John 4:18", "refEs": "1 Juan 4:18", "en": "There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love.", "es": "En amor no hay temor; mas el perfecto amor echa fuera el temor: porque el temor tiene pena. De donde el que teme, no está perfecto en el amor."},
  {"ref": "2 Samuel 22:35", "refEs": "2 Samuel 22:35", "en": "He teacheth my hands to war; so that a bow of steel is broken by mine arms.", "es": "El que enseña mis manos para la pelea, y da que con mis brazos quiebre el arco de acero."},
  {"ref": "Isaiah 35:4", "refEs": "Isaías 35:4", "en": "Say to them that are of a fearful heart, Be strong, fear not: behold, your God will come with vengeance, even God with a recompence; he will come and save you.", "es": "Decid á los de corazón apocado: Confortaos, no temáis: he aquí que vuestro Dios viene con venganza, con pago; el mismo Dios vendrá, y os salvará."},
  {"ref": "Galatians 5:1", "refEs": "Gálatas 5:1", "en": "Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.", "es": "ESTAD, pues, firmes en la libertad con que Cristo nos hizo libres, y no volváis otra vez á ser presos en el yugo de servidumbre."},
  {"ref": "Psalm 27:13", "refEs": "Salmos 27:13", "en": "I had fainted, unless I had believed to see the goodness of the Lord in the land of the living.", "es": "Hubiera yo desmayado, si no creyese que tengo de ver la bondad de Jehová en la tierra de los vivientes."},
  {"ref": "Isaiah 26:4", "refEs": "Isaías 26:4", "en": "Trust ye in the Lord for ever: for in the Lord Jehovah is everlasting strength:", "es": "Confiad en Jehová perpetuamente: porque en el Señor Jehová está la fortaleza de los siglos."},
  {"ref": "Daniel 10:19", "refEs": "Daniel 10:19", "en": "And said, O man greatly beloved, fear not: peace be unto thee, be strong, yea, be strong. And when he had spoken unto me, I was strengthened, and said, Let my lord speak; for thou hast strengthened me.", "es": "Y díjome: Varón de deseos, no temas: paz á ti; ten buen ánimo, y aliéntate. Y hablando él conmigo cobré yo vigor, y dije: Hable mi señor, porque me has fortalecido."},
  {"ref": "2 Timothy 4:17", "refEs": "2 Timoteo 4:17", "en": "Notwithstanding the Lord stood with me, and strengthened me; that by me the preaching might be fully known, and that all the Gentiles might hear: and I was delivered out of the mouth of the lion.", "es": "Mas el Señor me ayudó, y me esforzó para que por mí fuese cumplida la predicación, y todos los Gentiles oyesen; y fuí librado de la boca del león."},
  {"ref": "James 1:12", "refEs": "Santiago 1:12", "en": "Blessed is the man that endureth temptation: for when he is tried, he shall receive the crown of life, which the Lord hath promised to them that love him.", "es": "Bienaventurado el varón que sufre la tentación; porque cuando fuere probado, recibirá la corona de vida, que Dios ha prometido á los que le aman."},
  {"ref": "Jeremiah 29:13", "refEs": "Jeremías 29:13", "en": "And ye shall seek me, and find me, when ye shall search for me with all your heart.", "es": "Y me buscaréis y hallaréis, porque me buscaréis de todo vuestro corazón."},
  {"ref": "Revelation 21:4", "refEs": "Apocalipsis 21:4", "en": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.", "es": "Y limpiará Dios toda lágrima de los ojos de ellos; y la muerte no será más; y no habrá más llanto, ni clamor, ni dolor: porque las primeras cosas son pasadas."},
  {"ref": "Psalm 103:5", "refEs": "Salmos 103:5", "en": "Who satisfieth thy mouth with good things; so that thy youth is renewed like the eagle’s.", "es": "El que sacia de bien tu boca de modo que te rejuvenezcas como el águila."},
  {"ref": "Colossians 3:23", "refEs": "Colosenses 3:23", "en": "And whatsoever ye do, do it heartily, as to the Lord, and not unto men;", "es": "Y todo lo que hagáis, hacedlo de ánimo, como al Señor, y no á los hombres;"},
  {"ref": "Galatians 5:23", "refEs": "Gálatas 5:23", "en": "Meekness, temperance: against such there is no law.", "es": "Mansedumbre, templanza: contra tales cosas no hay ley."},
  {"ref": "Proverbs 27:17", "refEs": "Proverbios 27:17", "en": "Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", "es": "Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo."},
  {"ref": "Psalm 81:1", "refEs": "Salmos 81:1", "en": "Sing aloud unto God our strength: make a joyful noise unto the God of Jacob.", "es": "CANTAD á Dios, fortaleza nuestra: al Dios de Jacob celebrad con júbilo."},
  {"ref": "Psalm 84:7", "refEs": "Salmos 84:7", "en": "They go from strength to strength, every one of them in Zion appeareth before God.", "es": "Irán de fortaleza en fortaleza, verán á Dios en Sión."},
  {"ref": "Proverbs 13:4", "refEs": "Proverbios 13:4", "en": "The soul of the sluggard desireth, and hath nothing: but the soul of the diligent shall be made fat.", "es": "Desea, y nada alcanza el alma del perezoso: mas el alma de los diligentes será engordada."},
  {"ref": "Hebrews 12:3", "refEs": "Hebreos 12:3", "en": "For consider him that endured such contradiction of sinners against himself, lest ye be wearied and faint in your minds.", "es": "Reducid pues á vuestro pensamiento á aquel que sufrió tal contradicción de pecadores contra sí mismo, porque no os fatiguéis en vuestros ánimos desmayando."},
  {"ref": "Psalm 40:2", "refEs": "Salmos 40:2", "en": "He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, and established my goings.", "es": "E hízome sacar de un lago de miseria, del lodo cenagoso; y puso mis pies sobre peña, y enderezó mis pasos."},
  {"ref": "1 Thessalonians 5:23", "refEs": "1 Tesalonicenses 5:23", "en": "And the very God of peace sanctify you wholly; and I pray God your whole spirit and soul and body be preserved blameless unto the coming of our Lord Jesus Christ.", "es": "Y el Dios de paz os santifique en todo; para que vuestro espíritu y alma y cuerpo sea guardado entero sin reprensión para la venida de nuestro Señor Jesucristo."},
  {"ref": "Proverbs 3:6", "refEs": "Proverbios 3:6", "en": "In all thy ways acknowledge him, and he shall direct thy paths.", "es": "Reconócelo en todos tus caminos, y él enderezará tus veredas."},
  {"ref": "2 Peter 1:6", "refEs": "2 Pedro 1:6", "en": "And to knowledge temperance; and to temperance patience; and to patience godliness;", "es": "Y en la ciencia templanza, y en la templanza paciencia, y en la paciencia temor de Dios;"},
  {"ref": "James 1:4", "refEs": "Santiago 1:4", "en": "But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.", "es": "Mas tenga la paciencia perfecta su obra, para que seáis perfectos y cabales, sin faltar en alguna cosa."},
  {"ref": "Romans 8:31", "refEs": "Romanos 8:31", "en": "What shall we then say to these things? If God be for us, who can be against us?", "es": "¿Pues qué diremos á esto? Si Dios por nosotros, ¿quién contra nosotros?"},
  {"ref": "Romans 5:5", "refEs": "Romanos 5:5", "en": "And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.", "es": "Y la esperanza no avergüenza; porque el amor de Dios está derramado en nuestros corazones por el Espíritu Santo que nos es dado."},
  {"ref": "Psalm 18:39", "refEs": "Salmos 18:39", "en": "For thou hast girded me with strength unto the battle: thou hast subdued under me those that rose up against me.", "es": "Pues me ceñiste de fortaleza para la pelea; has agobiado mis enemigos debajo de mí."},
  {"ref": "Psalm 139:13", "refEs": "Salmos 139:13", "en": "For thou hast possessed my reins: thou hast covered me in my mother’s womb.", "es": "Porque tú poseiste mis riñones; cubrísteme en el vientre de mi madre."},
  {"ref": "2 Timothy 1:7", "refEs": "2 Timoteo 1:7", "en": "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "es": "Porque no nos ha dado Dios el espíritu de temor, sino el de fortaleza, y de amor, y de templanza."},
  {"ref": "Jeremiah 32:17", "refEs": "Jeremías 32:17", "en": "Ah Lord God! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, and there is nothing too hard for thee:", "es": "¡Oh Señor Jehová! he aquí que tú hiciste el cielo y la tierra con tu gran poder, y con tu brazo extendido, ni hay nada que sea difícil para ti:"},
  {"ref": "1 Corinthians 16:13", "refEs": "1 Corintios 16:13", "en": "Watch ye, stand fast in the faith, quit you like men, be strong.", "es": "Velad, estad firmes en la fe; portaos varonilmente, y esforzaos."},
  {"ref": "Psalm 37:34", "refEs": "Salmos 37:34", "en": "Wait on the Lord, and keep his way, and he shall exalt thee to inherit the land: when the wicked are cut off, thou shalt see it.", "es": "Espera en Jehová, y guarda su camino, y él te ensalzará para heredar la tierra: cuando serán talados los pecadores, lo verás."},
  {"ref": "Hebrews 11:1", "refEs": "Hebreos 11:1", "en": "Now faith is the substance of things hoped for, the evidence of things not seen.", "es": "ES pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven."},
  {"ref": "1 Chronicles 29:12", "refEs": "1 Crónicas 29:12", "en": "Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all.", "es": "Las riquezas y la gloria están delante de ti, y tú señoreas á todos: y en tu mano está la potencia y la fortaleza, y en tu mano la grandeza y fuerza de todas las cosas."},
  {"ref": "Habakkuk 3:17", "refEs": "Habacuc 3:17", "en": "Although the fig tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and there shall be no herd in the stalls:", "es": "Aunque la higuera no florecerá, ni en las vides habrá frutos; mentirá la obra de la oliva, y los labrados no darán mantenimiento, y las ovejas serán quitadas de la majada, y no habrá vacas en los corrales;"},
  {"ref": "Colossians 3:17", "refEs": "Colosenses 3:17", "en": "And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.", "es": "Y todo lo que hacéis, sea de palabra, ó de hecho, hacedlo todo en el nombre del Señor Jesús, dando gracias á Dios Padre por él."},
  {"ref": "Psalm 30:5", "refEs": "Salmos 30:5", "en": "For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.", "es": "Porque un momento será su furor; mas en su voluntad está la vida: por la tarde durará el lloro, y á la mañana vendrá la alegría."},
  {"ref": "Zechariah 4:6", "refEs": "Zacarías 4:6", "en": "Then he answered and spake unto me, saying, This is the word of the Lord unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the Lord of hosts.", "es": "Entonces respondió y hablóme, diciendo: Esta es palabra de Jehová á Zorobabel, en que se dice: No con ejército, ni con fuerza, sino con mi espíritu, ha dicho Jehová de los ejércitos."},
  {"ref": "Hebrews 12:13", "refEs": "Hebreos 12:13", "en": "And make straight paths for your feet, lest that which is lame be turned out of the way; but let it rather be healed.", "es": "Y haced derechos pasos á vuestros pies, porque lo que es cojo no salga fuera de camino, antes sea sanado."},
  {"ref": "Nehemiah 4:14", "refEs": "Nehemías 4:14", "en": "And I looked, and rose up, and said unto the nobles, and to the rulers, and to the rest of the people, Be not ye afraid of them: remember the Lord, which is great and terrible, and fight for your brethren, your sons, and your daughters, your wives, and your houses.", "es": "Después miré, y levantéme, y dije á los principales y á los magistrados, y al resto del pueblo: No temáis delante de ellos: acordaos del Señor grande y terrible, y pelead por vuestros hermanos, por vuestros hijos y por vuestras hijas, por vuestras mujeres y por vuestras casas."},
  {"ref": "Psalm 91:1", "refEs": "Salmos 91:1", "en": "He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.", "es": "EL que habita al abrigo del Altísimo, morará bajo la sombra del Omnipotente."},
  {"ref": "2 Chronicles 20:15", "refEs": "2 Crónicas 20:15", "en": "And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the Lord unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle is not yours, but God’s.", "es": "Y dijo: Oid, Judá todo, y vosotros moradores de Jerusalem, y tú, rey Josaphat. Jehová os dice así: No temáis ni os amedrentéis delante de esta tan grande multitud; porque no es vuestra la guerra, sino de Dios."},
  {"ref": "Romans 8:28", "refEs": "Romanos 8:28", "en": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "es": "Y sabemos que á los que á Dios aman, todas las cosas les ayudan á bien, es á saber, á los que conforme al propósito son llamados."},
  {"ref": "Philippians 1:6", "refEs": "Filipenses 1:6", "en": "Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:", "es": "Estando confiado de esto, que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo;"},
  {"ref": "Proverbs 31:17", "refEs": "Proverbios 31:17", "en": "She girdeth her loins with strength, and strengtheneth her arms.", "es": "Ciñó sus lomos de fortaleza, y esforzó sus brazos."},
  {"ref": "Hebrews 12:12", "refEs": "Hebreos 12:12", "en": "Wherefore lift up the hands which hang down, and the feeble knees;", "es": "Por lo cual alzad las manos caídas y las rodillas paralizadas;"},
  {"ref": "Matthew 7:13", "refEs": "Mateo 7:13", "en": "Enter ye in at the strait gate: for wide is the gate, and broad is the way, that leadeth to destruction, and many there be which go in thereat:", "es": "Entrad por la puerta estrecha: porque ancha es la puerta, y espacioso el camino que lleva á perdición, y muchos son los que entran por ella."},
  {"ref": "Psalm 63:1", "refEs": "Salmos 63:1", "en": "O God, thou art my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;", "es": "DIOS, Dios mío eres tú: levantaréme á ti de mañana: mi alma tiene sed de ti, mi carne te desea, en tierra de sequedad y transida sin aguas;"},
  {"ref": "Psalm 121:2", "refEs": "Salmos 121:2", "en": "My help cometh from the Lord, which made heaven and earth.", "es": "Mi socorro viene de Jehová, que hizo los cielos y la tierra."},
  {"ref": "Romans 12:2", "refEs": "Romanos 12:2", "en": "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.", "es": "Y no os conforméis á este siglo; mas reformaos por la renovación de vuestro entendimiento, para que experimentéis cuál sea la buena voluntad de Dios, agradable y perfecta."},
  {"ref": "Job 23:10", "refEs": "Job 23:10", "en": "But he knoweth the way that I take: when he hath tried me, I shall come forth as gold.", "es": "Mas él conoció mi camino: probaráme, y saldré como oro."},
  {"ref": "Matthew 7:14", "refEs": "Mateo 7:14", "en": "Because strait is the gate, and narrow is the way, which leadeth unto life, and few there be that find it.", "es": "Porque estrecha es la puerta, y angosto el camino que lleva á la vida, y pocos son los que la hallan."},
  {"ref": "2 Chronicles 32:8", "refEs": "2 Crónicas 32:8", "en": "With him is an arm of flesh; but with us is the Lord our God to help us, and to fight our battles. And the people rested themselves upon the words of Hezekiah king of Judah.", "es": "Con él es el brazo de carne, mas con nosotros Jehová nuestro Dios para ayudarnos, y pelear nuestras batallas. Y afirmóse el pueblo sobre las palabras de Ezechîas rey de Judá."},
  {"ref": "Deuteronomy 8:18", "refEs": "Deuteronomio 8:18", "en": "But thou shalt remember the Lord thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day.", "es": "Antes acuérdate de Jehová tu Dios: porque él te da el poder para hacer las riquezas, á fin de confirmar su pacto que juró á tus padres, como en este día."}

function dayOfYear(d){ var s0=new Date(d.getFullYear(),0,1); return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-s0)/86400000)+1; }
function verseForDate(d){ return SCRIPTURES[(dayOfYear(d)-1)%SCRIPTURES.length]; }

/* ============================= RECOVERY MODEL =============================
   Rule-based, Fitbod-style: each logged session adds fatigue to the muscles it
   worked (primary 100%, secondary 50%, stabilizer 25%), which decays linearly
   over that muscle's recovery window (36-72h depending on muscle size). */
var RECOVERY_HOURS={
  glute_max:72,quads:72,hamstrings:72,lats:72,chest:72,erectors:72,
  glute_med:48,front_delts:48,rear_delts:48,traps:48,biceps:48,triceps:48,
  calves:48,adductors:48,forearms:36,core:36,tibialis:36,
  side_delts:48,rhomboids:48,rotator_cuff:36,brachialis:48,glute_min:48,vastus_int:72,soleus:48,deep_core:36
};
function muscleFatigue(){
  var now=Date.now();
  var fat={};
  Object.keys(MUSCLE_LABELS).forEach(function(k){ fat[k]=0; });
  state.history.forEach(function(h){
    var t=new Date(h.date+"T12:00:00").getTime();
    var hrs=(now-t)/3600000;
    if (hrs<0||hrs>96) return;
    h.exercises.forEach(function(e){
      var def=EX_BY_NAME[e.name];
      if (!def) return;
      [[def.primary,1],[def.secondary,0.5],[def.stabilizers,0.25]].forEach(function(pair){
        (pair[0]||[]).forEach(function(m){
          var rh=RECOVERY_HOURS[m]||48;
          fat[m]=Math.min(1,fat[m]+pair[1]*Math.max(0,1-hrs/rh));
        });
      });
    });
  });
  return fat;
}

// with the other device's copy (whole-snapshot "last writer wins"). Pairing a
// device, or the other device saving with less data, wiped this phone's
// workout history. It now MERGES: nothing local is ever deleted, workout
// history is unioned by session id, and body metrics are unioned by date.
function mergeHistoryArrays(localArr,incomingArr,preferIncoming){
  var byId={}, order=[];
  (Array.isArray(localArr)?localArr:[]).forEach(function(h){ if (h&&h.id){ byId[h.id]=h; order.push(h.id); } });
  (Array.isArray(incomingArr)?incomingArr:[]).forEach(function(h){
    if (!h||!h.id) return;
    if (!byId[h.id]){ byId[h.id]=h; order.push(h.id); }
    else if (preferIncoming){
      // same session on both: keep whichever has more logged exercises
      var a=byId[h.id], b=h;
      if ((b.exercises||[]).length>=(a.exercises||[]).length) byId[h.id]=b;
    }
  });
  return order.map(function(id){ return byId[id]; });
}
function mergeMetricsArrays(localArr,incomingArr,preferIncoming){
  var byDate={};
  (Array.isArray(localArr)?localArr:[]).forEach(function(m){ if (m&&m.date) byDate[m.date]=m; });
  (Array.isArray(incomingArr)?incomingArr:[]).forEach(function(m){
    if (!m||!m.date) return;
    if (!byDate[m.date]) byDate[m.date]=m;
    else if (preferIncoming) byDate[m.date]=Object.assign({},byDate[m.date],m);
  });
  return Object.keys(byDate).sort().map(function(d){ return byDate[d]; });
}
function takeSafetyCopy(){
  try{ var h=localStorage.getItem(HISTORY_KEY); if (h&&h!=="[]") localStorage.setItem(SAFETY_KEY,h); }catch(e){}
}
// mode "sync": incoming is newer, so it wins on conflicts (but never deletes).
// mode "import": local wins on conflicts; only missing things are added.
function mergeSnapshot(data,mode){
  data=data||{};
  var preferIncoming=(mode==="sync");
  takeSafetyCopy();
  var added={sessions:0,metrics:0,keys:0};
  Object.keys(data).forEach(function(k){
    if (!k||k.indexOf("m165-")!==0) return;
    if (syncSkippedKey(k)||k===SEED_FLAG_KEY||k===LOWER_A_SEED_FLAG) return;
    var inc=data[k]; if (typeof inc!=="string") inc=JSON.stringify(inc);
    var cur=localStorage.getItem(k);
    if (k===PENDING_KEY){
      var lp=normalizePendingPayload(jparse(cur,[]));
      var ip=normalizePendingPayload(jparse(inc,[]));
      var mp=mergePendingLists(lp, ip);
      writePendingRaw(mp);
      applyPendingListToGrids(mp);
      return;
    }
    if (k===PENDING_ACCEPTED_KEY){
      localStorage.setItem(k, JSON.stringify(mergeIdLists(jparse(cur,[]), jparse(inc,[]))));
      return;
    }
    if (k===HISTORY_KEY){
      var la=jparse(cur,[]), ia=jparse(inc,[]);
      var merged=mergeHistoryArrays(la,ia,preferIncoming);
      added.sessions+=Math.max(0,merged.length-(Array.isArray(la)?la.length:0));
      localStorage.setItem(k,JSON.stringify(merged));
    } else if (k===METRICS_KEY){
      var lm=jparse(cur,[]), im=jparse(inc,[]);
      var mm=mergeMetricsArrays(lm,im,preferIncoming);
      added.metrics+=Math.max(0,mm.length-(Array.isArray(lm)?lm.length:0));
      localStorage.setItem(k,JSON.stringify(mm));
    } else if (cur!==null&&v4MergeKey(k)){
      // v4b: food logs, peptide/Dihexa logs, saved meals, prep lists, supplements: union, never overwrite
      localStorage.setItem(k,JSON.stringify(v4MergeValue(k,jparse(cur,null),jparse(inc,null),preferIncoming)));
    } else if (cur===null){
      localStorage.setItem(k,inc); added.keys++;
    } else if (preferIncoming){
      localStorage.setItem(k,inc);
    }
  });
  return added;
}
function v4MergeKey(k){ return /^m165-(food-|pep-\d|dihexa-\d|mealprep-saved$|mealprep-list-|mealplan-supps$)/.test(k); }
function v4MergeValue(k,a,b,preferIncoming){
  if (Array.isArray(a)||Array.isArray(b)){
    a=Array.isArray(a)?a:[]; b=Array.isArray(b)?b:[];
    var sig=function(x){ return x&&typeof x==="object"?(x.name||"")+"|"+(x.p==null?"":x.p)+"|"+(x.c==null?"":x.c)+"|"+(x.time||""):String(x); };
    if (/mealprep-saved|mealplan-supps/.test(k)) sig=function(x){ return x&&x.name?String(x.name).toLowerCase():JSON.stringify(x); };
    // multiset union: keep every local entry, add incoming ones that aren't already there
    var cnt={}; a.forEach(function(x){ var s=sig(x); cnt[s]=(cnt[s]||0)+1; });
    var out=a.slice();
    b.forEach(function(x){ var s=sig(x); if (cnt[s]>0) cnt[s]--; else out.push(x); });
    return out;
  }
  a=(a&&typeof a==="object")?a:{}; b=(b&&typeof b==="object")?b:{};
  return preferIncoming?Object.assign({},a,b):Object.assign({},b,a);
}
function applySnapshot(data){ return mergeSnapshot(data,"sync"); }
function markDirtyAndScheduleSync(){
  if (typeof syncPaired!=="function"||!syncPaired()) return;
  if (syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(pushSnapshot,2200);
}
function syncFetch(url,opts){
  return fetch(url,opts).then(function(r){
    if (r.ok) return r;
    return r.text().then(function(bodyText){
      var err=new Error(bodyText||("HTTP "+r.status));
      err.status=r.status;
      throw err;
    });
  });
}
function syncHeaders(){
  return {"Content-Type":"application/json","X-Access-Key":SYNC_ACCESS_KEY};
}
function pushSnapshot(){
  var id=localStorage.getItem(SYNC_ID_KEY);
  if (!id) return;
  setSyncStatus("syncing");
  var now=Date.now();
  var payload={updatedAt:now,data:buildSnapshot()};
  syncFetch(SYNC_API+"/b/"+id,{method:"PUT",headers:syncHeaders(),body:JSON.stringify(payload)})
    .then(function(){ localStorage.setItem(SYNC_TS_KEY,String(now)); setSyncStatus("idle"); })
    .catch(function(e){ setSyncStatus("error",e.message); });
}
function pullSnapshot(cb){
  var id=localStorage.getItem(SYNC_ID_KEY);
  if (!id){ if (cb) cb(); return; }
  setSyncStatus("syncing");
  syncFetch(SYNC_API+"/b/"+id+"/latest",{headers:{"X-Access-Key":SYNC_ACCESS_KEY}}).then(function(r){ return r.json(); }).then(function(res){
    var remote=res&&res.record;
    var localTs=Number(localStorage.getItem(SYNC_TS_KEY)||0);
    if (remote&&remote.updatedAt&&remote.updatedAt>localTs){
      applySnapshot(remote.data);
      localStorage.setItem(SYNC_TS_KEY,String(remote.updatedAt));
      loadHistory(); loadDay(state.dayIdx); renderApp();
      // v2: if this device had sessions/metrics the other one didn't, send the merged copy back
      var rh=jparse((remote.data||{})[HISTORY_KEY],[]), rm=jparse((remote.data||{})[METRICS_KEY],[]);
      var lh=jparse(localStorage.getItem(HISTORY_KEY),[]), lm=jparse(localStorage.getItem(METRICS_KEY),[]);
      if ((lh.length||0)>(rh.length||0)||(lm.length||0)>(rm.length||0)) markDirtyAndScheduleSync();
    }
    setSyncStatus("idle");
    if (cb) cb();
  }).catch(function(e){
    if (e.status===404){ setSyncStatus("idle"); if (cb) cb(); return; } // nothing pushed yet — not an error
    setSyncStatus("error",e.message); if (cb) cb();
  });
}
function startNewSync(cb){
  setSyncStatus("syncing");
  var now=Date.now();
  var payload={updatedAt:now,data:buildSnapshot()};
  syncFetch(SYNC_API+"/b",{method:"POST",headers:syncHeaders(),body:JSON.stringify(payload)})
    .then(function(r){ return r.json(); })
    .then(function(res){
      var id=res&&res.metadata&&res.metadata.id;
      if (!id) throw new Error("No code returned — try again");
      localStorage.setItem(SYNC_ID_KEY,id);
      localStorage.setItem(SYNC_TS_KEY,String(now));
      setSyncStatus("idle");
      if (cb) cb(null,id);
    })
    .catch(function(e){
      if (e.status===401||e.status===403) e.message="This app's sync key can't create a new sync. Tap \"Enter Code From Other Device\" and use your existing code.";
      setSyncStatus("error",e.message); if (cb) cb(e);
    });
}
function joinSync(id,cb){
  id=String(id||"").trim();
  if (!id){ if (cb) cb(new Error("Enter a code")); return; }
  setSyncStatus("syncing");
  localStorage.setItem(SYNC_ID_KEY,id);
  syncFetch(SYNC_API+"/b/"+id+"/latest",{headers:{"X-Access-Key":SYNC_ACCESS_KEY}}).then(function(r){ return r.json(); }).then(function(res){
    var remote=res&&res.record;
    if (remote&&remote.data){
      applySnapshot(remote.data);
      localStorage.setItem(SYNC_TS_KEY,String(remote.updatedAt||Date.now()));
    }
    loadHistory(); loadDay(state.dayIdx); renderApp();
    setSyncStatus("idle");
    if (cb) cb(null);
  }).catch(function(e){
    if (e.status===404){
      // valid id, just nothing pushed from the other device yet
      loadHistory(); loadDay(state.dayIdx); renderApp();
      setSyncStatus("idle");
      if (cb) cb(null);
      return;
    }
    localStorage.removeItem(SYNC_ID_KEY);
    setSyncStatus("error",e.message||"Code not found, or offline");
    if (cb) cb(e);
  });
}

function localISO(d){
  var y=d.getFullYear(), m=("0"+(d.getMonth()+1)).slice(-2), dd=("0"+d.getDate()).slice(-2);
  return y+"-"+m+"-"+dd;
}
function todayStr(){ return localISO(new Date()); }
function yesterdayStr(){ var d=new Date(); d.setDate(d.getDate()-1); return localISO(d); }
function formatDate(iso){
  var d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
var DAY_OFFSETS=[0,1,2,3]; // Fri, Sat, Sun, Mon
function getAnchorFriday(){
  // Week anchor is FRIDAY (Day 1). Wed/Thu roll forward to the upcoming
  // Friday (week runs Fri-Mon).
  var now=new Date();
  var diff=(now.getDay()-5+7)%7;
  if (diff===5||diff===6){ diff-=7; }
  var a=new Date(now);
  a.setDate(now.getDate()-diff);
  a.setHours(0,0,0,0);
  return a;
}
function dayDate(idx){
  var a=getAnchorFriday();
  var d=new Date(a);
  d.setDate(a.getDate()+DAY_OFFSETS[idx]);
  return d;
}
function formatShortDate(d){
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function weekIndex(){ return Math.floor(getAnchorFriday().getTime()/(7*86400000)); }

function loadDay(idx){
  var day=DAYS[idx];
  state.progress=jparse(store.get(PK(day.id)),{});
  state.weights=jparse(store.get(WK(day.id)),{});
  state.bonus=jparse(store.get(BK(day.id)),{});
  state.topSets=jparse(store.get(TK(day.id)),{});
  // Signature safeguard (v2): if the exercise list changed (new version of the
  // program), MOVE today's in-progress entries to the exercise with the same
  // name instead of wiping them all. Saved history is never touched here.
  var sig=daySignature(day), storedSig=store.get(SGK(day.id));
  if (storedSig!==null&&storedSig!==sig){
    var oldNames=storedSig.split("|"), newIdx={};
    day.exercises.forEach(function(e,i){ newIdx[e.name]=i; });
    function remap(obj){
      var out={};
      Object.keys(obj||{}).forEach(function(oi){
        var nm=oldNames[Number(oi)];
        if (nm!=null&&newIdx[nm]==null) Object.keys(NAME_ALIASES).forEach(function(k){ if (NAME_ALIASES[k].indexOf(nm)>=0&&newIdx[k]!=null) nm=k; });
        if (nm!=null&&newIdx[nm]!=null) out[newIdx[nm]]=obj[oi];
      });
      return out;
    }
    state.progress=remap(state.progress); state.weights=remap(state.weights);
    state.bonus=remap(state.bonus); state.topSets=remap(state.topSets);
    store.set(PK(day.id),JSON.stringify(state.progress)); store.set(WK(day.id),JSON.stringify(state.weights));
    store.set(BK(day.id),JSON.stringify(state.bonus)); store.set(TK(day.id),JSON.stringify(state.topSets));
  }
  if (storedSig!==sig) store.set(SGK(day.id),sig);
}

function saveHistoryEntry(){
  var day=DAYS[state.dayIdx];
  var done=[];
  day.exercises.forEach(function(ex,i){
    var ts=state.topSets[i];
    var sets=confirmedSetsFor(ex.name);
    var hasData = !!state.progress[i] ||
      !!(state.weights[i]&&String(state.weights[i]).trim()) ||
      !!(state.bonus[i]&&String(state.bonus[i]).trim()) ||
      !!(ts&&ts.weight&&ts.reps) ||
      sets.length>0;
    if (!hasData) return;
    var weight=state.weights[i]||"";
    if (!String(weight).trim() && sets.length){
      weight=sets.map(function(s){
        return (isBlankVal(s.weight)?"—":s.weight)+"x"+(isBlankVal(s.reps)?"—":s.reps);
      }).join(", ");
    }
    done.push({
      name:ex.name,
      weight:weight,
      bonus:state.bonus[i]||"",
      topSet:(ts&&ts.weight&&ts.reps)?{weight:Number(ts.weight),reps:Number(ts.reps)}:null,
      sets:sets
    });
  });
  var id=state.logDate+"-"+day.id;
  var existing=null;
  state.history.forEach(function(h){ if (h&&h.id===id) existing=h; });
  if (existing){
    var prevBy={};
    (existing.exercises||[]).forEach(function(e){ prevBy[e.name]=e; });
    done.forEach(function(e){
      var prev=prevBy[e.name];
      if (prev && (!e.sets||!e.sets.length) && prev.sets && prev.sets.length) e.sets=prev.sets;
    });
    var inDone={};
    done.forEach(function(e){ inDone[e.name]=1; });
    (existing.exercises||[]).forEach(function(e){
      if (!inDone[e.name] && e.sets && e.sets.length) done.push(e);
    });
  }
  var durationMin=null;
  if (state.logDate===todayStr()&&done.length>0){
    var st=Number(store.get(SS(id))||0);
    if (!st){ st=Date.now(); store.set(SS(id),String(st)); }
    durationMin=Math.max(1,Math.round((Date.now()-st)/60000));
  } else if (existing && existing.durationMin) durationMin=existing.durationMin;
  state.history=state.history.filter(function(h){return !h || h.id!==id;});
  if (done.length>0){
    state.history.push({
      id:id, date:state.logDate, dayId:day.id, dayTitle:day.title,
      doneCount:done.length, total:day.exercises.length,
      exercises:done, durationMin:durationMin
    });
  }
  var ok=store.set(HISTORY_KEY,JSON.stringify(state.history));
  if (ok){
    refreshPendingAcceptance();
    var left=uncheckedAttentionCount();
    showSaveToast(left?("Saved checked sets. "+left+" still unchecked."):undefined);
  }
}

function lastWeightFor(name){

  for (var i=0;i<sorted.length;i++){
    var m=sorted[i].exercises.find(function(e){return nameMatches(e.name,name)&&e.weight;});

  }

  var sorted=state.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});

/* ===================== REST TIMER ALARM (v4c, Bluetooth-friendly) =====================
   Why the old timer only partly worked on iPhone + Bluetooth earbuds:
   - iOS suspends Web Audio and throttles timers when the screen locks / app backgrounds,
     so a beep scheduled from JS at the end often never plays.
   Fix used here:
   1. Everything audio starts from the Start/preset TAP (a real user gesture).
   2. On that tap we play ONE generated audio track = (rest length of silence) + 3 loud beeps.
      Because it's a normal media element that is already playing, iOS keeps the audio
      session open over Bluetooth while locked and the beeps play on time with no JS needed.
   3. The countdown is computed from a fixed end time (Date.now), never a drifting counter.
   4. Backup: when the clock passes the end time and the track did not play, a separate
      3-beep data-URI <audio> plays, with Web Audio as the last fallback, plus vibrate
      (where the browser supports it) and a screen flash.
   5. Media Session metadata puts "Rest timer" on the lock screen with play/pause. */
var RA_RATE=8000;
function raBeepSamples(){
  var out=[], beeps=3, on=0.28, off=0.14, amp=118;
  for (var b=0;b<beeps;b++){
    var n=Math.round(on*RA_RATE);
    for (var i=0;i<n;i++){
      var t=i/RA_RATE, env=Math.min(1,i/40,(n-i)/40);
      var v=0.75*Math.sin(2*Math.PI*1000*t)+0.25*Math.sin(2*Math.PI*2000*t);
      out.push(128+Math.round(amp*env*v));
    }
    if (b<beeps-1) for (var j=0;j<Math.round(off*RA_RATE);j++) out.push(128);
  }
  return out;
}
var RA_BEEP=raBeepSamples(), RA_BEEP_SEC=RA_BEEP.length/RA_RATE;
function raWavBytes(silenceSec,withBeep){
  var ns=Math.max(0,Math.round(silenceSec*RA_RATE)), nb=withBeep?RA_BEEP.length:0, n=ns+nb;
  var buf=new Uint8Array(44+n), dv=new DataView(buf.buffer);
  function str(o,s){ for (var i=0;i<s.length;i++) buf[o+i]=s.charCodeAt(i); }
  str(0,"RIFF"); dv.setUint32(4,36+n,true); str(8,"WAVE"); str(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,RA_RATE,true); dv.setUint32(28,RA_RATE,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  str(36,"data"); dv.setUint32(40,n,true);
  buf.fill(128,44,44+ns);
  for (var k=0;k<nb;k++) buf[44+ns+k]=RA_BEEP[k];

function drawWeightChart(canvas,entries){
  if (!canvas) return;
  var W=canvas.clientWidth||320, H=190;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  var ctx=canvas.getContext("2d");
  if (!ctx) return;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  ctx.font="11px Inter, sans-serif";
  if (!entries.length){
    ctx.fillStyle="#8b8b95";
    ctx.fillText("Log your weight to see the trend toward 165.",16,H/2);
    return;
  }
  var pad={l:34,r:10,t:12,b:20};
  var ws=entries.map(function(e){ return e.weight; });
  var lo=Math.min(165,Math.min.apply(null,ws))-3;
  var hi=Math.max(165,Math.max.apply(null,ws))+3;
  var t0=new Date(entries[0].date+"T00:00:00").getTime();
  var t1=new Date(entries[entries.length-1].date+"T00:00:00").getTime();
  if (t1===t0) t1=t0+86400000;
  function X(d){ return pad.l+(new Date(d+"T00:00:00").getTime()-t0)/(t1-t0)*(W-pad.l-pad.r); }
  function Y(w){ return pad.t+(hi-w)/(hi-lo)*(H-pad.t-pad.b); }
  // gridlines + labels (skip gray text on 165, and any tick within 14px of it)
  ctx.strokeStyle="#2a2a32"; ctx.fillStyle="#8b8b95";
  var y165=Y(165);
  [lo+3,165,hi-3].forEach(function(w){
    var y=Y(w);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    if (w!==165 && Math.abs(y-y165)>=14) ctx.fillText(String(Math.round(w)),4,y+3);
  });
  // target line + left-side green "165" (same gutter as the other axis labels)
  ctx.strokeStyle="#22c55e"; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(pad.l,y165); ctx.lineTo(W-pad.r,y165); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#22c55e"; ctx.fillText("165",4,y165+3);
  // weight line
  ctx.strokeStyle="#8b5cf6"; ctx.lineWidth=2;
  ctx.beginPath();
  entries.forEach(function(e,i){
    var x=X(e.date), y=Y(e.weight);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.lineWidth=1;
  entries.forEach(function(e){
    ctx.fillStyle="#a855f7";
    ctx.beginPath(); ctx.arc(X(e.date),Y(e.weight),3,0,7); ctx.fill();
  });
  // latest label: dark pill above the last point (below it only if that would clip past the top pad)
  var last=entries[entries.length-1];
  var label=last.weight+" lb";
  var tm=ctx.measureText(label);
  var tw=tm.width;
  var lx=Math.min(X(last.date),W-pad.r-tw);
  var ly=Y(last.weight)-12;
  if (ly<pad.t) ly=Y(last.weight)+16;
  var bp=3, asc=tm.actualBoundingBoxAscent||9, desc=tm.actualBoundingBoxDescent||3;
  ctx.fillStyle="#15151b";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(lx-bp,ly-asc-bp,tw+bp*2,asc+desc+bp*2,4);
  else ctx.rect(lx-bp,ly-asc-bp,tw+bp*2,asc+desc+bp*2);
  ctx.fill();
  ctx.fillStyle="#e9e9ee";
  ctx.fillText(label,lx,ly);
}

function prescription(ex,focus){
  if (ex.big) return {sets:(focus==="full"?3:4),reps:"8-10",rest:"2-3 min",tempo:"3-1-1-0",rir:"1-2 RIR"};
  var small=["delts","rear","biceps","triceps","calves","glute_acc","core","fly"].indexOf(ex.slot)>=0;

function generateWorkout(focus,seed,eq){
  var t=TEMPLATES[focus]||TEMPLATES.full, rnd=seededRand(seed), used={}, picks=[], missing=[];
  t.slots.forEach(function(slot){
    var cands=LIBRARY.filter(function(e){ return e.slot===slot&&!used[e.name]&&exAvailable(e,eq); });
    if (!cands.length){ missing.push(SLOT_INFO[slot].label); return; }
    var ex=cands[Math.floor(rnd()*cands.length)];

function isBlankVal(v){ return v==null || (typeof v==="string" && v.trim()===""); }

function cleanLoggedNumber(v){
  if (v==null) return null;
  if (typeof v==="number") return isFinite(v) ? v : null;

  if (!s) return null;
  if (s==="?" || s==="—" || s==="-" || /^n\/?a$/i.test(s) || /not (given|recorded|logged|said)/i.test(s)) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return Number(s);

function mergeIdLists(a,b){
  var out=[], seen={};
  [a,b].forEach(function(list){
    (Array.isArray(list)?list:[]).forEach(function(id){
      id=String(id||"");
      if (!id || seen[id]) return;
      seen[id]=1; out.push(id);
    });
  });
  return out;
}
function mergeSetRows(localRows, incomingRows){
  var byN={}, order=[], conflicts=[];
  (localRows||[]).forEach(function(r){
    if (!r) return;
    var n=Number(r.n);
    if (!isFinite(n)) return;
    if (!byN[n]) order.push(n);
    byN[n]=Object.assign({}, r);
  });
  (incomingRows||[]).forEach(function(s){
    if (!s) return;
    var n=Number(s.n);
    if (!isFinite(n)) return;
    if (!byN[n]){
      order.push(n);
      byN[n]={n:n, weight:isBlankVal(s.weight)?null:s.weight, reps:isBlankVal(s.reps)?null:s.reps, note:s.note||"", confirmed:false, planned:!!s.planned, source:s.source||"voice"};
      return;
    }
    var row=byN[n];
    ["weight","reps"].forEach(function(f){
      var inc=s[f];
      if (isBlankVal(inc)) return;
      if (isBlankVal(row[f])){
        if (row.confirmed) return;
        row[f]=inc;
        return;
      }
      if (String(row[f])!==String(inc)) conflicts.push({n:n, field:f, kept:row[f], skipped:inc});
    });
    if (s.note && !row.note) row.note=s.note;
    if (s.planned && isBlankVal(row.weight) && isBlankVal(row.reps)) row.planned=true;
  });
  order.sort(function(a,b){ return a-b; });
  return {rows:order.map(function(n){ return byN[n]; }), conflicts:conflicts};
}
function mergeExerciseLists(localEx, incomingEx){
  var byName={}, order=[];
  (localEx||[]).forEach(function(ex){
    if (!ex||!ex.name) return;
    if (!byName[ex.name]) order.push(ex.name);
    byName[ex.name]=Object.assign({}, ex, {sets:(ex.sets||[]).map(function(s){ return Object.assign({}, s); })});
  });
  (incomingEx||[]).forEach(function(ex){
    if (!ex||!ex.name) return;
    if (!byName[ex.name]){
      order.push(ex.name);
      byName[ex.name]=Object.assign({}, ex, {sets:(ex.sets||[]).map(function(s){ return Object.assign({confirmed:false}, s); })});
      return;
    }
    var cur=byName[ex.name];
    var merged=mergeSetRows(cur.sets, ex.sets);
    cur.sets=merged.rows;
    if (ex.note && !cur.note) cur.note=ex.note;
    byName[ex.name]=cur;
  });
  return order.map(function(n){ return byName[n]; });
}
function mergePendingEntry(local, incoming){
  var out=Object.assign({}, local);
  out.exercises=mergeExerciseLists(local.exercises, incoming.exercises);
  if (incoming.note && !out.note) out.note=incoming.note;
  if (!out.dayId && incoming.dayId) out.dayId=incoming.dayId;
  if (!out.dayTitle && incoming.dayTitle) out.dayTitle=incoming.dayTitle;
  return out;
}
function mergePendingLists(local, incoming){
  var byId={}, order=[];
  (Array.isArray(local)?local:[]).forEach(function(e){
    if (!e||!e.id) return;
    byId[e.id]=e; order.push(e.id);
  });
  (Array.isArray(incoming)?incoming:[]).forEach(function(e){
    if (!e||!e.id) return;
    if (!byId[e.id]){ byId[e.id]=e; order.push(e.id); return; }
    byId[e.id]=mergePendingEntry(byId[e.id], e);
  });
  return order.map(function(id){ return byId[id]; });
}

function normalizeExercise(ex){
  if (!ex || typeof ex!=="object") return null;
  var name=canonicalExerciseName(ex.exercise||ex.name||"");

  var sets=[];

  src.forEach(function(s,i){

    var n=Number(s.n||s.set||(i+1));

  });

function normalizeOnePending(raw){
  if (!raw || typeof raw!=="object" || Array.isArray(raw)) return null;
  var date=String(raw.date||"").slice(0,10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  var exercises=[];
  if (Array.isArray(raw.exercises)) raw.exercises.forEach(function(ex){ var n=normalizeExercise(ex); if (n) exercises.push(n); });
  else if (raw.exercise || raw.name){ var one=normalizeExercise(raw); if (one) exercises.push(one); }
  if (!exercises.length) return null;
  var dayId=Number(raw.dayId||raw.day||0);
  if (!isFinite(dayId) || dayId<=0) dayId=null;
  var id=raw.id?String(raw.id):(date+"-d"+(dayId||"x")+"-"+exercises.map(function(e){return e.name;}).join("|"));
  return {
    id:id, date:date, dayId:dayId,
    dayTitle:raw.dayTitle||raw.title||"",
    note:raw.note||raw.sessionNote||"",
    source:raw.source||"voice",
    exercises:exercises

}
function normalizePendingPayload(record){
  if (!record) return [];
  if (typeof record==="string") record=jparse(record, null);
  if (!record) return [];
  if (Array.isArray(record)) return record.map(normalizeOnePending).filter(Boolean);
  if (Array.isArray(record.entries)) return record.entries.map(normalizeOnePending).filter(Boolean);
  if (Array.isArray(record.pending)) return record.pending.map(normalizeOnePending).filter(Boolean);
  if (record.data){
    var d=record.data;
    if (typeof d==="string") d=jparse(d, null);
    if (d && d[PENDING_KEY]!=null){
      var p=d[PENDING_KEY];
      if (typeof p==="string") p=jparse(p, []);
      return normalizePendingPayload(Array.isArray(p)?p:{entries:p});
    }
  }
  if (record.exercise || record.exercises || record.name){
    var one=normalizeOnePending(record);
    return one?[one]:[];
  }
  return [];
}

function applyPendingListToGrids(entries){

    var grid=loadSetGrid(entry.date, dayId);

      var merged=mergeSetRows(Array.isArray(grid[ex.name])?grid[ex.name]:[], incoming);

function wireSetGrid(detail, ex){
  var box=detail.querySelector(".sg-box");
  if (!box) return;
    function paintBlank(input, row){
      var show=isBlankVal(input.value) && rowNeedsFlag(row);
      input.classList.toggle("blank", show);
      var flag=input.parentNode.querySelector(".sg-flag");
      if (show && !flag){
        flag=document.createElement("span");
        flag.className="sg-flag";
        flag.textContent="not recorded";
        input.parentNode.appendChild(flag);
      } else if (!show && flag) flag.remove();
    }
  box.querySelectorAll("tr[data-n]").forEach(function(tr){
    var n=Number(tr.getAttribute("data-n"));
    var w=tr.querySelector(".sg-w"), r=tr.querySelector(".sg-r"), c=tr.querySelector(".sg-c");
    function update(field, input){
      var next=copyRows(ex);
      var row=null;
      next.forEach(function(item){ if (item.n===n) row=item; });
      if (!row) return;
      row[field]=parseTypedLoad(input.value);
      if (row.source!=="voice" && row.source!=="seed") row.source="manual";
      writeRows(ex, next);
      paintBlank(w, row);
      paintBlank(r, row);
    }
    w.addEventListener("input", function(){ update("weight", w); });
    r.addEventListener("input", function(){ update("reps", r); });
    c.addEventListener("change", function(){
      var next=copyRows(ex);
      var row=null;
      next.forEach(function(item){ if (item.n===n) row=item; });
      if (!row) return;
      row.confirmed=!!c.checked;
      writeRows(ex, next);
      tr.classList.toggle("is-ok", row.confirmed);
    });
  });
  var plus=box.querySelector(".sg-plus"), minus=box.querySelector(".sg-minus");
  if (plus) plus.addEventListener("click", function(e){
    e.stopPropagation();
    var next=copyRows(ex), max=0;
    next.forEach(function(row){ if (row.n>max) max=row.n; });
    next.push({n:max+1, weight:null, reps:null, confirmed:false, note:"", source:"manual", planned:false});
    writeRows(ex, next);
    state.open[exerciseIndex(ex)]=true;
    renderApp();
  });
  if (minus) minus.addEventListener("click", function(e){
    e.stopPropagation();
    var next=copyRows(ex);
    if (next.length<=1) return;
    next.pop();
    writeRows(ex, next);
    state.open[exerciseIndex(ex)]=true;
    renderApp();
  });
}
function entryFullyConfirmed(entry){
  var dayId=resolveDayId(entry);
  if (!dayId) return false;
  var grid=loadSetGrid(entry.date, dayId);
  var ok=true;
  (entry.exercises||[]).forEach(function(ex){
    var rows=grid[ex.name];
    if (!Array.isArray(rows)){ ok=false; return; }
    (ex.sets||[]).forEach(function(s){
      var row=null;
      rows.forEach(function(r){ if (r.n===s.n) row=r; });
      if (!row || !row.confirmed) ok=false;
    });
  });
  return ok;
}
function refreshPendingAcceptance(){
  var list=loadPending(), accepted=loadAccepted(), changed=false;
  var keep=[];
  list.forEach(function(entry){
    if (entryFullyConfirmed(entry)){ accepted.push(String(entry.id)); changed=true; }
    else keep.push(entry);
  });
  if (changed){ savePending(keep); saveAccepted(mergeIdLists(accepted, [])); }
}

function positionMapHTML(exerciseName){
  var ids=POS_BY_EX[exerciseName]||[];
  if (!ids.length) return "";
  return ids.map(function(id){
    var map=POS_MAPS[id];
    if (!map) return "";
    var first=map.options[0];
    var h='<div class="pos-map" data-map="'+id+'">';
    h+='<div class="pos-title">'+esc(map.title)+'</div>';
    h+='<div class="pos-cue">'+esc(map.cue)+'</div>';
    if (map.layout==="stack"){
      h+='<div class="pos-stage">'+(POS_STAGE[id][first.id]||"")+'</div>';
      h+='<div class="pos-picks">';
      map.options.forEach(function(o,i){
        h+='<button type="button" class="pos-opt'+(i===0?" on":"")+'" data-id="'+esc(o.id)+'" data-detail="'+esc(o.detail)+'">';
        h+='<div class="pos-h"><span class="pos-num">'+esc(o.n)+'</span><span class="pos-name">'+esc(o.name)+'</span></div>';
        h+='<div class="pos-pri">'+esc(o.primary)+' (primary)</div>';
        if (o.secondary) h+='<div class="pos-sec">'+esc(o.secondary)+' (secondary)</div>';
        h+='</button>';
      });
      h+='</div>';
    } else {
      h+='<div class="pos-grid">';
      map.options.forEach(function(o,i){
        h+='<button type="button" class="pos-opt'+(i===0?" on":"")+'" data-id="'+esc(o.id)+'" data-detail="'+esc(o.detail)+'">';
        h+=(o.svg||"");
        h+='<div class="pos-h"><span class="pos-num">'+esc(o.n)+'</span><span class="pos-name">'+esc(o.name)+'</span></div>';
        h+='<div class="pos-pri">'+esc(o.primary)+'</div>';
        if (o.secondary) h+='<div class="pos-sec">'+esc(o.secondary)+'</div>';
        h+='</button>';
      });
      h+='</div>';
    }
    h+='<div class="pos-detail">'+esc(first.detail)+'</div></div>';
    return h;
  }).join("");
}
function wirePositionMap(root){
  root.querySelectorAll(".pos-map").forEach(function(map){
    var id=map.getAttribute("data-map");
    map.querySelectorAll(".pos-opt").forEach(function(btn){
      btn.addEventListener("click", function(ev){
        ev.stopPropagation();
        map.querySelectorAll(".pos-opt").forEach(function(b){ b.classList.toggle("on", b===btn); });
        var det=map.querySelector(".pos-detail");
        if (det) det.textContent=btn.getAttribute("data-detail")||"";
        var stage=map.querySelector(".pos-stage");
        if (stage && POS_STAGE[id]) stage.innerHTML=POS_STAGE[id][btn.getAttribute("data-id")]||"";
      });
    });
  });
}

function m165SelfCheck(){
  var results=[];
  function assert(name, cond){ results.push({name:name, ok:!!cond}); }
  assert("blank null", cleanLoggedNumber(null)===null);
  assert("blank question", cleanLoggedNumber("?")===null);
  assert("keep 180", cleanLoggedNumber(180)===180);
  assert("do not guess words", cleanLoggedNumber("about 180")===null);
  assert("typed 180 lb", parseTypedLoad("180 lb")===180);
  var entry=buildLowerAEntry();
  assert("five exercises", entry.exercises.length===5);
  assert("one hip thrust", entry.exercises.filter(function(e){return e.name==="Banded Barbell Hip Thrust";}).length===1);
  var ht=entry.exercises[0];
  assert("hip numbers", ht.sets.map(function(s){return s.weight+"x"+s.reps;}).join(",")==="92x10,112x10,122x10,175x10,270x8");
  var sq=entry.exercises[1];
  assert("squat blanks", sq.sets.length===3 && sq.sets.every(function(s){return s.weight===null && s.reps===null && s.planned;}));
  var lp=entry.exercises[2];
  assert("leg press loads", lp.sets[0].weight===193 && lp.sets[1].weight===283 && lp.sets[2].weight===463);
  assert("leg press reps", lp.sets[0].reps===null && lp.sets[1].reps===null && lp.sets[2].reps===10);
  var calf=entry.exercises[3];
  assert("calf 180 not recalculated", calf.sets.every(function(s){return s.weight===180 && s.reps===null;}));
  var cr=entry.exercises[4];
  assert("crunch reps", cr.sets.map(function(s){return s.reps;}).join(",")==="12,15,15" && cr.sets.every(function(s){return s.weight===null;}));
  var merged=mergeSetRows([{n:1, weight:193, reps:null, confirmed:false}], [{n:1, weight:999, reps:10}]);
  assert("keep 193", merged.rows[0].weight===193 && merged.rows[0].reps===10 && merged.conflicts.length===1);
  var signed=mergeSetRows([{n:1, weight:193, reps:null, confirmed:true}], [{n:1, weight:193, reps:10}]);
  assert("signed blank stays", signed.rows[0].reps===null);
  var added=mergeSetRows([{n:1, weight:193, reps:8}], [{n:2, weight:50, reps:5}]);
  assert("does not drop a set", added.rows.length===2 && added.rows[0].weight===193);
  var lists=mergePendingLists([{id:"a", exercises:[{name:"Squat", sets:[{n:1, weight:100, reps:5}]}]}, {id:"b", exercises:[]}], [{id:"a", exercises:[{name:"Squat", sets:[{n:1, weight:100, reps:null}]}]}]);
  assert("pending keeps both", lists.length===2 && lists[0].exercises[0].sets[0].reps===5);
  var payload=normalizePendingPayload({entries:[{date:"2026-11-21", dayId:1, exercises:[{name:"Deep Leg Press", sets:[{n:1, weight:"about 200", reps:null}]}]}]});
  assert("payload blank", payload.length===1 && payload[0].exercises[0].sets[0].weight===null && payload[0].exercises[0].sets[0].reps===null);
  var lower=DAYS[2].exercises;
  var ai=lower.map(function(e){return e.name;}).indexOf("Seated Hip Abduction");
  var si=lower.map(function(e){return e.name;}).indexOf("Side Plank");
  assert("abduction before side plank", ai>=0 && si===ai+1);
  assert("lower B is 2 sets", lower[ai].sets===2 && lower[ai].reps==="15-20");
  var upper=DAYS[1].exercises.filter(function(e){return e.name==="Seated Hip Abduction";});
  var onlyLower=DAYS.filter(function(d){ return d.exercises.some(function(e){ return e.name==="Seated Hip Abduction"; }); });
  assert("saturday removed", upper.length===0 && onlyLower.length===1 && onlyLower[0].id===3);
  assert("coach lifts", ["Face Pull","Banded Barbell Hip Thrust","Deep Leg Press","Smith Romanian Deadlift","Dumbbell Hammer Curl","Cable Curl"].every(function(n){return !!COACH[n];}));
  window.__m165SelfCheck=results;
  window.__m165SelfCheckOk=results.every(function(r){return r.ok;});
  if (!window.__m165SelfCheckOk) console.error("m165 self-check failed", results.filter(function(r){return !r.ok;}));
}
