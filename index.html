<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mission 165</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission 165">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0c">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel2:#1a1a20; --border:#2a2a32;
    --text:#e9e9ee; --muted:#8b8b95; --violet:#8b5cf6; --violetDim:#3d2f6b;
    --amber:#f4b740; --primary:#a855f7; --secondary:#f97316; --stabilizer:#38bdf8;
    --base:#33333c; --green:#22c55e; --rose:#f43f5e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,sans-serif; padding-bottom:40px;
    padding-top:env(safe-area-inset-top);
  }
  ::-webkit-scrollbar{height:4px;width:4px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  .storage-banner{
    background:#7f1d1d;color:#fecaca;padding:12px 16px;font-size:12px;line-height:1.5;
    border-bottom:2px solid #ef4444;position:sticky;top:0;z-index:100;
  }
  .storage-banner button{
    display:block;margin-top:8px;background:#450a0a;color:#fecaca;border:1px solid #ef4444;
    border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;
  }

  .hero{background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:22px 18px 18px;}
  .hero-row{display:flex;align-items:center;gap:14px;}
  .hero-badge{
    width:64px;height:64px;border-radius:12px;border:2px solid var(--violet);flex-shrink:0;
    background:linear-gradient(135deg,#2a1a5e,#0a0a0c);display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .hero-badge{overflow:hidden;}
  .hero-badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-badge .n{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--text);line-height:1;}
  .hero-badge .l{font-size:8px;color:var(--amber);letter-spacing:1.5px;font-weight:700;margin-top:2px;}
  .hero-kicker{font-size:10px;color:var(--amber);letter-spacing:2px;font-weight:700;}
  .hero-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.1;}
  .hero-sub{font-size:12px;color:var(--muted);}
  .hero-sub b{color:var(--amber);font-weight:600;}
  .hero-motto{margin-top:12px;text-align:center;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--amber);letter-spacing:2.5px;text-transform:uppercase;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px 0;}
  .ring-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .ring-wrap{position:relative;width:46px;height:46px;}
  .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .reset-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);font-size:10px;border-radius:8px;padding:6px 10px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}

  .nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding-bottom:6px;box-shadow:0 6px 14px rgba(0,0,0,.45);}
  .view-toggle{display:flex;gap:8px;padding:10px 18px 0;}
  .vt-btn{flex:1;padding:8px 0;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .vt-btn.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .day-tabs{display:flex;gap:8px;padding:10px 18px 0;overflow-x:auto;}
  .day-tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;text-align:center;line-height:1.5;}
  .day-tab.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .day-tab .d{font-size:9.5px;color:var(--muted);font-weight:700;}
  .day-tab.active .d{color:var(--amber);}
  .mini-row{display:flex;align-items:center;gap:8px;padding:8px 18px 0;}
  .mini-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .mini-bar>div{height:100%;background:var(--violet);transition:width .3s;}
  .mini-count{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .mini-timer{font-size:10.5px;color:var(--amber);font-weight:700;white-space:nowrap;}
  .logfor-row{display:flex;align-items:center;gap:6px;padding:6px 18px 0;flex-wrap:wrap;}
  .logfor-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .logfor-btn{font-size:10px;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700;}
  .logfor-btn.today.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .logfor-btn.yest.active{border-color:var(--amber);background:rgba(244,183,64,.13);color:var(--text);}
  .logfor-date{font-size:10px;padding:3px 6px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);color-scheme:dark;}

  .content{padding:16px 18px 0;}

  .scripture{background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--violetDim);border-radius:14px;padding:16px;margin-bottom:16px;}
  .scripture .k{font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;}
  .scripture-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .scripture-grid .es{border-left:1px solid var(--border);padding-left:12px;}
  .scripture .ref{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700;}
  .scripture .txt{font-size:12.5px;color:var(--text);line-height:1.5;font-style:italic;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
  .card.done{border-color:rgba(139,92,246,.4);}
  .card.glute-primary{border-left:4px solid var(--rose);}
  .card.glute-secondary{border-left:4px solid rgba(244,63,94,.67);}
  .card-head{display:flex;align-items:center;padding:14px 14px 14px 10px;gap:10px;}
  .chk{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:15px;font-weight:900;padding:0;}
  .card.done .chk{border-color:var(--violet);background:var(--violet);}
  .chk .m{display:none;}
  .card.done .chk .m{display:block;}
  .card-main{flex:1;min-width:0;cursor:pointer;}
  .card-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--text);letter-spacing:.3px;}
  .card.done .ex-name{color:var(--muted);text-decoration:line-through;}
  .stars{color:var(--amber);letter-spacing:1px;font-size:12px;}
  .glute-tag{border-radius:999px;padding:1px 8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .glute-tag.primary{background:rgba(244,63,94,.13);color:var(--rose);border:1px solid rgba(244,63,94,.4);}
  .glute-tag.secondary{background:rgba(244,63,94,.09);color:rgba(244,63,94,.75);border:1px solid rgba(244,63,94,.3);}
  .card-sub-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .brand{border-radius:6px;padding:1px 7px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
  .pattern{font-size:11.5px;color:var(--muted);}
  .chev{color:var(--violet);background:none;border:none;font-size:20px;cursor:pointer;padding:4px;transition:transform .2s;}
  .card.open .chev{transform:rotate(180deg);}
  .card-detail{display:none;padding:0 14px 16px;border-top:1px solid var(--border);}
  .card.open .card-detail{display:block;}

  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0;}
  .stat{background:var(--panel2);border-radius:8px;padding:8px 4px;text-align:center;}
  .stat .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat .k.w{color:var(--amber);}
  .stat .v{font-size:13px;color:var(--text);font-weight:700;margin-top:2px;}
  .stat input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-weight:700;text-align:center;margin-top:2px;}
  .last-logged{font-size:10.5px;color:var(--amber);margin-bottom:12px;margin-top:-6px;}

  .form-btn{width:100%;margin-bottom:12px;padding:9px 0;border-radius:8px;cursor:pointer;border:1px solid var(--violet);background:rgba(139,92,246,.09);color:var(--text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}

  .timer-box,.prog-box{background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:12px;}
  .timer-top{display:flex;align-items:center;justify-content:space-between;}
  .box-k{font-size:10px;color:var(--violet);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
  .timer-time{font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .timer-time.done{color:var(--green);}
  .timer-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0;}
  .timer-bar>div{height:100%;background:var(--violet);transition:width 1s linear;}
  .timer-bar>div.done{background:var(--green);}
  .timer-box.timer-flash{animation:timerFlash .5s ease-in-out 3;}
  @keyframes timerFlash{0%,100%{background:var(--panel2);}50%{background:rgba(34,197,94,.5);}}
  .timer-btns{display:flex;gap:6px;}
  .t-btn{flex:1;padding:8px 0;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--muted);}
  .t-btn.start{border-color:var(--violet);background:var(--violet);color:#0a0a0c;}
  .t-btn.pause{border-color:var(--amber);background:var(--amber);color:#0a0a0c;}

  .prog-box .k2{font-size:9px;color:var(--muted);margin-bottom:2px;}
  .prog-inputs{display:flex;gap:8px;margin-bottom:8px;margin-top:6px;}
  .prog-inputs>div{flex:1;}
  .prog-inputs input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:var(--text);font-size:13px;font-weight:700;outline:none;}
  .prog-msg{font-size:11px;color:var(--muted);line-height:1.4;}
  .prog-msg.increase{font-size:11.5px;color:var(--green);}

  .maps-row{display:flex;gap:10px;margin-bottom:14px;}
  .map-box{flex:1;background:var(--panel2);border-radius:10px;padding:8px;}
  .map-box .k{font-size:9px;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:2px;}
  .map-box .svgwrap{height:130px;}
  .map-box svg{width:100%;height:100%;}
  .legend{display:flex;flex-direction:column;gap:5px;justify-content:center;min-width:84px;}
  .legend>div{display:flex;align-items:center;gap:5px;}
  .legend .sw{width:9px;height:9px;border-radius:3px;}
  .legend span.t{font-size:9.5px;color:var(--muted);}

  .pills{margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;}
  .pill{border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
  .pill.p{background:rgba(168,85,247,.13);color:var(--primary);border:1px solid rgba(168,85,247,.33);}
  .pill.s{background:rgba(249,115,22,.13);color:var(--secondary);border:1px solid rgba(249,115,22,.33);}

  .section{margin-bottom:10px;}
  .section .k{font-size:10px;color:var(--violet);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:3px;}
  .section .k.warn{color:var(--secondary);}
  .section .t{font-size:12.5px;color:var(--text);line-height:1.5;}
  .section ul{margin:0;padding-left:16px;}
  .section li{font-size:12.5px;color:var(--text);line-height:1.5;}
  .bonus-input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12.5px;outline:none;}

  .save-btn{width:100%;margin:10px 0 14px;padding:12px 0;border-radius:10px;cursor:pointer;border:1px solid var(--violet);background:var(--violet);color:#fff;font-size:13.5px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}
  .save-btn.saved{border-color:var(--green);background:rgba(34,197,94,.13);color:var(--green);}

  .coverage{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:8px;margin-bottom:20px;}
  .coverage summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--violet);text-transform:uppercase;letter-spacing:.5px;}
  .coverage-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;}
  .coverage-grid>div{display:flex;align-items:center;gap:6px;font-size:12px;}
  .footer-note{text-align:center;padding:8px 0 24px;font-size:10px;color:var(--muted);letter-spacing:1px;}

  .sync-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .sync-head{display:flex;align-items:center;gap:8px;}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .sync-dot.on{background:var(--green);}
  .sync-dot.syncing{background:var(--amber);}
  .sync-dot.error{background:var(--rose);}
  .sync-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text);}
  .sync-status{font-size:11.5px;color:var(--muted);margin:4px 0 10px;}
  .sync-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .sync-btn{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:700;border:1px solid var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .sync-btn.ghost{border-color:var(--border);background:transparent;color:var(--muted);}
  .sync-code{font-size:12px;color:var(--text);margin-bottom:10px;letter-spacing:.3px;}
  .sync-code strong{color:var(--amber);font-family:'Oswald',sans-serif;font-size:14px;}
  .sync-help{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:10px;}
  .hist-entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
  .hist-top{display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-size:10px;color:var(--amber);font-weight:700;letter-spacing:.5px;}
  .hist-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;}
  .hist-count{font-size:13px;font-weight:700;color:var(--violet);}
  .hist-count.full{color:var(--green);}
  .hist-pct{font-size:10px;color:var(--muted);text-align:right;}
  .hist-detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .hist-entry.open .hist-detail{display:block;}
  .hist-ex{padding:3px 0;}
  .hist-ex .row{font-size:12px;color:var(--text);display:flex;justify-content:space-between;}
  .hist-ex .w{color:var(--amber);font-weight:700;}
  .hist-ex .b{font-size:10.5px;color:var(--muted);padding-left:16px;}
  .empty-hist{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.6;}
  .backup-btn{width:100%;margin-bottom:14px;padding:12px 0;border-radius:10px;cursor:pointer;border:1px solid var(--amber);background:rgba(244,183,64,.09);color:var(--amber);font-size:12.5px;font-weight:800;letter-spacing:.5px;}
  .backup-btn.copied{border-color:var(--green);color:var(--green);}

  /* ---- Fuel / Regimen ---- */
  .fuel-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .fuel-card .k{font-size:10px;color:var(--violet);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:8px;}
  .fuel-tot{display:flex;align-items:baseline;gap:6px;}
  .fuel-num{font-family:'Oswald',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .fuel-goal{font-size:12px;color:var(--muted);font-weight:600;}
  .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0 12px;}
  .bar>div{height:100%;background:var(--violet);transition:width .3s;}
  .bar>div.ok{background:var(--green);}
  .bar>div.over{background:var(--rose);}
  .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .preset-btn{padding:10px 8px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700;text-align:left;line-height:1.4;}
  .preset-btn .sub{font-size:10px;color:var(--muted);font-weight:600;}
  .custom-row{display:flex;gap:6px;margin-bottom:12px;}
  .custom-row input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;outline:none;min-width:0;}
  .custom-row .nm{flex:2;}
  .custom-row .num{flex:1;}
  .custom-row button{border:1px solid var(--violet);background:var(--violet);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .entry-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .entry-row:last-child{border-bottom:none;}
  .entry-row .meta{color:var(--muted);font-size:11px;}
  .entry-row .del{background:none;border:none;color:var(--rose);font-size:16px;cursor:pointer;padding:2px 8px;}
  .reg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .reg-row:last-child{border-bottom:none;}
  .reg-row.offday{opacity:.4;}
  .reg-name{flex:1;font-size:13px;font-weight:600;}
  .reg-note{font-size:10px;color:var(--muted);}
  .reg-badge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--amber);border:1px solid rgba(244,183,64,.4);border-radius:999px;padding:1px 7px;white-space:nowrap;}

  /* ---- Body metrics ---- */
  .met-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .met-grid label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;}
  .met-grid input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:13px;font-weight:700;outline:none;}
  .met-save{width:100%;padding:11px 0;border-radius:10px;cursor:pointer;border:1px solid var(--violet);background:var(--violet);color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px;}
  .met-save.saved{background:rgba(34,197,94,.13);border-color:var(--green);color:var(--green);}
  #bodyChart{width:100%;height:190px;background:var(--panel2);border-radius:10px;}
  .met-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .met-row:last-child{border-bottom:none;}
  .met-row .d{color:var(--amber);font-weight:700;}
  .met-row .vals{color:var(--muted);}
  .met-row .vals b{color:var(--text);}

  /* ---- Recovery ---- */
  .rec-note{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
  .rec-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
  .rec-row:last-child{border-bottom:none;}
  .rec-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .rec-name{flex:1;font-size:12.5px;font-weight:600;}
  .rec-stat{font-size:11px;color:var(--muted);}
</style>

function equipBrand(str){
  var s = str.toLowerCase();
  if (s.indexOf("body masters")>=0) return {label:"Body Masters", color:C.bodyMasters};
  if (s.indexOf("cybex")>=0) return {label:"Cybex", color:C.cybex};
  if (s.indexOf("precor")>=0) return {label:"Precor", color:C.precor};
  if (s.indexOf("hoist")>=0) return {label:"Hoist", color:C.hoist};
  if (s.indexOf("hammer strength")>=0) return {label:"Hammer Strength", color:C.hammer};
  if (s.indexOf("life fitness")>=0) return {label:"Life Fitness", color:C.lifeFitness};
  if (s.indexOf("keiser")>=0) return {label:"Keiser", color:C.keiser};
  if (s.indexOf("dumbbell")>=0 || s.indexOf("barbell")>=0 || s.indexOf("kettlebell")>=0) return {label:"Free Weights", color:C.freeWeights};

  return {label:"Machine", color:C.hammer};
}
/* ============================= PROGRESSION LOGIC =============================
   NSCA/ACSM-based double progression: top of rep range at the SAME weight for
   2 sessions in a row -> +5-10% compound, +2.5-5% isolation. */
function parseRepRange(repsStr){
  if (!repsStr || /yd|walk|controlled/i.test(repsStr)) return null;
  var nums = (repsStr.match(/\d+/g)||[]).map(Number);
  if (nums.length===0) return null;
  if (nums.length===1) return {min:nums[0],max:nums[0]};
  return {min:nums[0],max:nums[1]};
}
function isCompound(primaryMuscles){
  var keys=["glute_max","glute_med","quads","hamstrings","chest","lats","front_delts"];
  return (primaryMuscles||[]).some(function(m){return keys.indexOf(m)>=0;});
}
function roundWeight(w,compound){
  var step = w>=100?5:(compound?5:2.5);
  return Math.round(w/step)*step;
}
function getProgressionSuggestion(exercise,last2){
  var range=parseRepRange(exercise.reps);
  if (!range) return {status:"not_applicable",reason:"Not a rep-based exercise (carry/core work)."};
  if (!last2||last2.length<2) return {status:"hold",reason:"Need at least 2 logged sessions to evaluate."};
  var a=last2[0],b=last2[1];
  if (a.weight!==b.weight){
    return {status:"hold",reason:"Weight changed between sessions ("+b.weight+" → "+a.weight+") — need 2 sessions at the SAME weight to confirm readiness."};
  }
  if (a.reps<range.max||b.reps<range.max){
    return {status:"hold",reason:"Haven't hit the top of the rep range ("+range.max+") on both of the last 2 sessions yet. Last 2: "+b.reps+", "+a.reps+" reps at "+a.weight+"."};
  }
  var compound=isCompound(exercise.primary);
  var pctLow=compound?0.05:0.025, pctHigh=compound?0.10:0.05;
  var step=a.weight>=100?5:(compound?5:2.5);
  var lo=roundWeight(a.weight*(1+pctLow),compound);
  var hi=roundWeight(a.weight*(1+pctHigh),compound);
  if (lo<=a.weight) lo=a.weight+step;
  if (hi<=a.weight) hi=a.weight+step;
  var suggested = lo===hi?lo:Math.max(lo,hi-step);
  return {status:"increase",
    reason:"Hit "+range.max+"+ reps at "+a.weight+" for 2 sessions in a row — ready to progress.",
    currentWeight:a.weight,suggestedWeight:suggested,
    pctRange:(pctLow*100).toFixed(1)+"–"+(pctHigh*100).toFixed(1)+"%",compound:compound};
}

/* ============================= RECOVERY MODEL =============================
   Rule-based, Fitbod-style: each logged session adds fatigue to the muscles it
   worked (primary 100%, secondary 50%, stabilizer 25%), which decays linearly
   over that muscle's recovery window (36-72h depending on muscle size). */
var RECOVERY_HOURS={
  glute_max:72,quads:72,hamstrings:72,lats:72,chest:72,erectors:72,
  glute_med:48,front_delts:48,rear_delts:48,traps:48,biceps:48,triceps:48,
  calves:48,adductors:48,forearms:36,core:36,tibialis:36
};
function muscleFatigue(){
  var now=Date.now();
  var fat={};
  Object.keys(MUSCLE_LABELS).forEach(function(k){ fat[k]=0; });
  state.history.forEach(function(h){
    var t=new Date(h.date+"T12:00:00").getTime();
    var hrs=(now-t)/3600000;
    if (hrs<0||hrs>96) return;
    h.exercises.forEach(function(e){
      var def=EX_BY_NAME[e.name];
      if (!def) return;
      [[def.primary,1],[def.secondary,0.5],[def.stabilizers,0.25]].forEach(function(pair){
        (pair[0]||[]).forEach(function(m){
          var rh=RECOVERY_HOURS[m]||48;
          fat[m]=Math.min(1,fat[m]+pair[1]*Math.max(0,1-hrs/rh));
        });
      });
    });
  });
  return fat;
}

/* ============================= CLOUD SYNC ============================= */
// No-account, no-server sync between your two devices, using a free
// anonymous key-value bucket (kvdb.io) as the go-between. localStorage on
// THIS device always stays the working copy — sync is best-effort. If
// you're offline or the remote service is unreachable, the app keeps
// working exactly as it always has; it just won't have picked up the
// other device's latest entries until the next successful sync.
// Whichever device saves most recently wins if both devices logged
// something before either one got a chance to sync.
// (Tried jsonblob.com first — it turned out to be unreachable/CORS-broken
// in live testing, so this was switched to kvdb.io, which was verified
// working directly against its real API before shipping.)
var SYNC_ID_KEY="m165-sync-id";
var SYNC_TS_KEY="m165-sync-updatedAt";
var SYNC_EXCLUDE=[SYNC_ID_KEY,SYNC_TS_KEY,"m165-storagetest"];
var SYNC_API="https://kvdb.io";
var SYNC_OWNER_EMAIL="dsenanm72@gmail.com";
var SYNC_STATE_KEY="state";
var syncState={status:"off",lastSync:0,lastError:""}; // off|idle|syncing|error
var syncPushTimer=null;
function syncPaired(){ return !!localStorage.getItem(SYNC_ID_KEY); }
function setSyncStatus(status,err){
  syncState.status=status;
  if (status==="idle") syncState.lastSync=Date.now();
  syncState.lastError=err||"";
  if (state.view==="history") renderApp();
}
function buildSnapshot(){
  var data={};
  for (var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if (!k||k.indexOf("m165-")!==0) continue;
    if (SYNC_EXCLUDE.indexOf(k)>=0) continue;
    data[k]=localStorage.getItem(k);
  }
  return data;
}
function applySnapshot(data){
  for (var i=localStorage.length-1;i>=0;i--){
    var k=localStorage.key(i);
    if (!k||k.indexOf("m165-")!==0) continue;
    if (SYNC_EXCLUDE.indexOf(k)>=0) continue;
    localStorage.removeItem(k);
  }
  Object.keys(data||{}).forEach(function(k){
    if (SYNC_EXCLUDE.indexOf(k)>=0) return;
    localStorage.setItem(k,data[k]);
  });
}
function markDirtyAndScheduleSync(){
  if (typeof syncPaired!=="function"||!syncPaired()) return;
  if (syncPushTimer) clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(pushSnapshot,2200);
}
function syncFetch(url,opts){
  return fetch(url,opts).then(function(r){
    if (r.ok) return r;
    return r.text().then(function(bodyText){
      var err=new Error(bodyText||("HTTP "+r.status));
      err.status=r.status;
      throw err;
    });
  });
}
function pushSnapshot(){
  var id=localStorage.getItem(SYNC_ID_KEY);
  if (!id) return;
  setSyncStatus("syncing");
  var now=Date.now();
  var payload={updatedAt:now,data:buildSnapshot()};
  syncFetch(SYNC_API+"/"+id+"/"+SYNC_STATE_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(){ localStorage.setItem(SYNC_TS_KEY,String(now)); setSyncStatus("idle"); })
    .catch(function(e){ setSyncStatus("error",e.message); });
}
function pullSnapshot(cb){
  var id=localStorage.getItem(SYNC_ID_KEY);
  if (!id){ if (cb) cb(); return; }
  setSyncStatus("syncing");
  syncFetch(SYNC_API+"/"+id+"/"+SYNC_STATE_KEY).then(function(r){ return r.json(); }).then(function(remote){
    var localTs=Number(localStorage.getItem(SYNC_TS_KEY)||0);
    if (remote&&remote.updatedAt&&remote.updatedAt>localTs){
      applySnapshot(remote.data);
      localStorage.setItem(SYNC_TS_KEY,String(remote.updatedAt));
      loadHistory(); loadDay(state.dayIdx); renderApp();
    }
    setSyncStatus("idle");
    if (cb) cb();
  }).catch(function(e){
    if (e.status===404){ setSyncStatus("idle"); if (cb) cb(); return; } // nothing pushed yet — not an error
    setSyncStatus("error",e.message); if (cb) cb();
  });
}
function startNewSync(cb){
  setSyncStatus("syncing");
  var now=Date.now();
  var payload={updatedAt:now,data:buildSnapshot()};
  syncFetch(SYNC_API+"/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"email="+encodeURIComponent(SYNC_OWNER_EMAIL)})
    .then(function(r){ return r.text(); })
    .then(function(bucket){
      bucket=bucket.trim();
      if (!bucket) throw new Error("No code returned — try again");
      localStorage.setItem(SYNC_ID_KEY,bucket);
      return syncFetch(SYNC_API+"/"+bucket+"/"+SYNC_STATE_KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    })
    .then(function(){
      localStorage.setItem(SYNC_TS_KEY,String(now));
      setSyncStatus("idle");
      if (cb) cb(null,localStorage.getItem(SYNC_ID_KEY));
    })
    .catch(function(e){ setSyncStatus("error",e.message); if (cb) cb(e); });
}
function joinSync(id,cb){
  id=String(id||"").trim();
  if (!id){ if (cb) cb(new Error("Enter a code")); return; }
  setSyncStatus("syncing");
  localStorage.setItem(SYNC_ID_KEY,id);
  syncFetch(SYNC_API+"/"+id+"/"+SYNC_STATE_KEY).then(function(r){ return r.json(); }).then(function(remote){
    if (remote&&remote.data){
      applySnapshot(remote.data);
      localStorage.setItem(SYNC_TS_KEY,String(remote.updatedAt||Date.now()));
    }
    loadHistory(); loadDay(state.dayIdx); renderApp();
    setSyncStatus("idle");
    if (cb) cb(null);
  }).catch(function(e){
    if (e.status===404){
      // valid bucket, just nothing pushed from the other device yet
      loadHistory(); loadDay(state.dayIdx); renderApp();
      setSyncStatus("idle");
      if (cb) cb(null);
      return;
    }
    localStorage.removeItem(SYNC_ID_KEY);
    setSyncStatus("error",e.message||"Code not found, or offline");
    if (cb) cb(e);
  });
}

function loadDay(idx){
  var day=DAYS[idx];
  state.progress=jparse(store.get(PK(day.id)),{});
  state.weights=jparse(store.get(WK(day.id)),{});
  state.bonus=jparse(store.get(BK(day.id)),{});
  state.topSets=jparse(store.get(TK(day.id)),{});
  // Signature safeguard: wipe slot data if the exercise list changed
  var sig=daySignature(day), storedSig=store.get(SGK(day.id));
  if (storedSig!==null&&storedSig!==sig){
    state.progress={}; state.weights={}; state.bonus={}; state.topSets={};
    store.set(PK(day.id),"{}"); store.set(WK(day.id),"{}");
    store.set(BK(day.id),"{}"); store.set(TK(day.id),"{}");
  }
  if (storedSig!==sig) store.set(SGK(day.id),sig);
}
function saveDayState(){
  var day=DAYS[state.dayIdx];
  store.set(PK(day.id),JSON.stringify(state.progress));
  store.set(WK(day.id),JSON.stringify(state.weights));
  store.set(BK(day.id),JSON.stringify(state.bonus));
  store.set(TK(day.id),JSON.stringify(state.topSets));
}
function loadHistory(){
  state.history=jparse(store.get(HISTORY_KEY),[]);
  if (!Array.isArray(state.history)) state.history=[];
}
function saveHistoryEntry(){
  var day=DAYS[state.dayIdx];
  var done=[];
  day.exercises.forEach(function(ex,i){
    var ts=state.topSets[i];
    var hasData = !!state.progress[i] ||
      !!(state.weights[i]&&String(state.weights[i]).trim()) ||
      !!(state.bonus[i]&&String(state.bonus[i]).trim()) ||
      !!(ts&&ts.weight&&ts.reps);
    if (!hasData) return;
    done.push({
      name:ex.name,
      weight:state.weights[i]||"",
      bonus:state.bonus[i]||"",
      topSet:(ts&&ts.weight&&ts.reps)?{weight:Number(ts.weight),reps:Number(ts.reps)}:null
    });
  });
  var id=state.logDate+"-"+day.id;
  var durationMin=null;
  if (state.logDate===todayStr()&&done.length>0){
    var st=Number(store.get(SS(id))||0);
    if (!st){ st=Date.now(); store.set(SS(id),String(st)); }
    durationMin=Math.max(1,Math.round((Date.now()-st)/60000));
  }
  state.history=state.history.filter(function(h){return h.id!==id;});
  if (done.length>0){
    state.history.push({
      id:id, date:state.logDate, dayId:day.id, dayTitle:day.title,
      doneCount:done.length, total:day.exercises.length,
      exercises:done, durationMin:durationMin
    });
  }
  store.set(HISTORY_KEY,JSON.stringify(state.history));
}
function lastWeightFor(name){
  var sorted=state.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  for (var i=0;i<sorted.length;i++){
    var m=sorted[i].exercises.find(function(e){return e.name===name&&e.weight;});
    if (m) return {weight:m.weight,date:sorted[i].date};
  }
  return null;
}
function last2TopSetsFor(name){
  var sorted=state.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var found=[];
  for (var i=0;i<sorted.length&&found.length<2;i++){
    var m=sorted[i].exercises.find(function(e){return e.name===name&&e.topSet;});
    if (m) found.push(m.topSet);
  }
  return found;
}

  clearAllIntervals();
  var app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(renderHero());
  app.appendChild(renderNav());
  if (state.view==="workout") app.appendChild(renderWorkout());
  else if (state.view==="fuel") app.appendChild(renderFuelView());
  else if (state.view==="body") app.appendChild(renderBodyView());
  else if (state.view==="recover") app.appendChild(renderRecoverView());
  else app.appendChild(renderHistoryView());
  updateProgressUI();
}
function counts(){
  var day=DAYS[state.dayIdx];
  var done=0;
  for (var i=0;i<day.exercises.length;i++) if (state.progress[i]) done++;
  return {done:done,total:day.exercises.length,pct:day.exercises.length?Math.round(done/day.exercises.length*100):0};
}

  var rp=document.getElementById("ringPct"); if (rp) rp.textContent=c.pct+"%";
  var hc=document.getElementById("heroCount"); if (hc) hc.textContent=c.done+" / "+c.total+" exercises complete";
  var mb=document.getElementById("miniBar"); if (mb) mb.style.width=c.pct+"%";
  var mc=document.getElementById("miniCount"); if (mc) mc.textContent=c.done+"/"+c.total+" done";

function parseRestSeconds(restStr){
  var nums=(String(restStr).match(/\d+/g)||[]).map(Number);
  if (nums.length===0) return 60;
  if (nums.length===1) return nums[0];
  return Math.round((nums[0]+nums[1])/2);
}
/* Shared, persistent AudioContext. iOS Safari only lets an AudioContext run
   if it was unlocked during a real tap — a fresh context created later
   inside a setInterval callback (as the old code did) starts "suspended"
   and Safari drops it silently, which shows up worst when a Bluetooth
   device already holds the audio route. We unlock/resume this one context
   on the Start button tap (a genuine user gesture) and reuse it. */
var sharedAudioCtx=null;
function unlockAudio(){
  try{
    if (!sharedAudioCtx) sharedAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if (sharedAudioCtx.state==="suspended") sharedAudioCtx.resume();
  }catch(e){}
}
function playAlertTone(){
  try{
    unlockAudio();
    if (!sharedAudioCtx) return;
    var ctx=sharedAudioCtx, now=ctx.currentTime;
    [0,0.42,0.84].forEach(function(offset){
      var osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type="sine"; osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,now+offset);
      gain.gain.exponentialRampToValueAtTime(1,now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.34);
    });
  }catch(e){}
}
function attachTimer(box,restLabel){
  var base=parseRestSeconds(restLabel);
  var left=base, running=false, iv=null, endAt=null, alerted=false;
  var timeEl=box.querySelector(".timer-time");
  var barEl=box.querySelector(".timer-bar>div");
  var startBtn=box.querySelector(".start");
  var plusBtn=box.querySelector(".plus");
  var rstBtn=box.querySelector(".rst");
  function paint(){
    var mm=Math.floor(left/60), ss=left%60;
    timeEl.textContent=mm+":"+("0"+ss).slice(-2);
    timeEl.classList.toggle("done",left===0);
    barEl.style.width=(base?left/base*100:0)+"%";
    barEl.classList.toggle("done",left===0);
    startBtn.textContent=running?"Pause":(left===0?"Restart":"Start");
    startBtn.className="t-btn "+(running?"pause":"start");
  }
  function fireAlert(){
    if (alerted) return;
    alerted=true;
    if (navigator.vibrate) navigator.vibrate([250,100,250,100,250]);
    playAlertTone();
    // Visual cue always works regardless of what's happening with audio
    // routing over Bluetooth — this is the fallback that can't be blocked.
    box.classList.add("timer-flash");
    setTimeout(function(){ box.classList.remove("timer-flash"); },1500);
  }
  function onVis(){ if (document.visibilityState==="visible") tick(); }
  function stopIv(){
    if (iv){ clearInterval(iv); iv=null; }
    running=false;
    document.removeEventListener("visibilitychange",onVis);
  }
  // Timestamp-based, not tick-decrement: iOS pauses/throttles setInterval
  // while the app is backgrounded (switching to Bluetooth/Music controls,
  // locking the phone), so a simple left-- per tick drifts or stalls.
  // Recomputing from a fixed end time keeps the countdown accurate and
  // still fires the alert on the tick right after you come back.
  function tick(){
    if (!running||!endAt) return;
    left=Math.max(0,Math.round((endAt-Date.now())/1000));
    if (left<=0){ left=0; stopIv(); fireAlert(); }
    paint();
  }
  startBtn.addEventListener("click",function(e){
    e.stopPropagation();
    unlockAudio();
    if (running){ stopIv(); paint(); return; }
    if (left===0) left=base;
    alerted=false;
    endAt=Date.now()+left*1000;
    running=true;
    iv=trackInterval(setInterval(tick,1000));
    document.addEventListener("visibilitychange",onVis);
    paint();
  });
  plusBtn.addEventListener("click",function(e){
    e.stopPropagation();
    left=Math.max(0,left+15);
    if (running&&endAt) endAt=Date.now()+left*1000;
    paint();
  });
  rstBtn.addEventListener("click",function(e){ e.stopPropagation(); stopIv(); left=base; alerted=false; paint(); });
  paint();
}

function backupText(){
  var lines=["MISSION 165 BACKUP — generated "+todayStr(),""];
  var sorted=state.history.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  if (!sorted.length) lines.push("(no sessions logged yet)");
  sorted.forEach(function(h){
    lines.push("### "+h.date+" — Day "+h.dayId+": "+h.dayTitle+" ("+h.doneCount+"/"+h.total+(h.durationMin?", "+h.durationMin+" min":"")+")");
    h.exercises.forEach(function(e){
      var l="- "+e.name;
      if (e.weight) l+=": "+e.weight;
      if (e.topSet) l+=" | top set "+e.topSet.weight+" x "+e.topSet.reps;
      if (e.bonus) l+=" | bonus: "+e.bonus;
      lines.push(l);
    });
    lines.push("");
  });
  // nutrition + regimen, last 7 days
  lines.push("NUTRITION & REGIMEN (last 7 days)");
  for (var i=0;i<7;i++){
    var d=new Date(); d.setDate(d.getDate()-i);
    var ds=localISO(d);
    var foods=jparse(store.get(FK(ds)),[]);
    var reg=jparse(store.get(RK(ds)),{});
    var tp=0,tc=0;
    foods.forEach(function(f){ tp+=Number(f.p||0); tc+=Number(f.c||0); });
    var regList=Object.keys(reg).filter(function(k){ return reg[k]; });
    if (foods.length||regList.length){
      lines.push("- "+ds+": "+tp+"g protein, "+tc+" cal"+(regList.length?" | regimen: "+regList.join(", "):""));
    }
  }
  lines.push("");
  // body metrics
  var mets=jparse(store.get(METRICS_KEY),[]);
  if (Array.isArray(mets)&&mets.length){
    lines.push("BODY METRICS");
    mets.slice(-10).forEach(function(m){
      var parts=[];
      MET_FIELDS.forEach(function(f){ if (m[f[0]]!=null) parts.push(f[0]+" "+m[f[0]]); });
      lines.push("- "+m.date+": "+parts.join(", "));
    });
    lines.push("");
  }
  return lines.join("\n");
}
function renderSyncCard(){

function drawWeightChart(canvas,entries){
  if (!canvas) return;
  var W=canvas.clientWidth||320, H=190;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  var ctx=canvas.getContext("2d");
  if (!ctx) return;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  ctx.font="10px Inter, sans-serif";
  if (!entries.length){
    ctx.fillStyle="#8b8b95";
    ctx.fillText("Log your weight to see the trend toward 165.",16,H/2);
    return;
  }
  var pad={l:34,r:10,t:12,b:20};
  var ws=entries.map(function(e){ return e.weight; });
  var lo=Math.min(165,Math.min.apply(null,ws))-3;
  var hi=Math.max(165,Math.max.apply(null,ws))+3;
  var t0=new Date(entries[0].date+"T00:00:00").getTime();
  var t1=new Date(entries[entries.length-1].date+"T00:00:00").getTime();
  if (t1===t0) t1=t0+86400000;
  function X(d){ return pad.l+(new Date(d+"T00:00:00").getTime()-t0)/(t1-t0)*(W-pad.l-pad.r); }
  function Y(w){ return pad.t+(hi-w)/(hi-lo)*(H-pad.t-pad.b); }
  // gridlines + labels
  ctx.strokeStyle="#2a2a32"; ctx.fillStyle="#8b8b95";
  [lo+3,165,hi-3].forEach(function(w){
    var y=Y(w);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillText(String(Math.round(w)),4,y+3);
  });
  // target line
  ctx.strokeStyle="#22c55e"; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(pad.l,Y(165)); ctx.lineTo(W-pad.r,Y(165)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#22c55e"; ctx.fillText("165",W-pad.r-22,Y(165)-4);
  // weight line
  ctx.strokeStyle="#8b5cf6"; ctx.lineWidth=2;
  ctx.beginPath();
  entries.forEach(function(e,i){
    var x=X(e.date), y=Y(e.weight);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.lineWidth=1;
  entries.forEach(function(e){
    ctx.fillStyle="#a855f7";
    ctx.beginPath(); ctx.arc(X(e.date),Y(e.weight),3,0,7); ctx.fill();
  });
  // latest label
  var last=entries[entries.length-1];
  ctx.fillStyle="#e9e9ee";
  ctx.fillText(last.weight+" lb",Math.min(X(last.date)+6,W-40),Y(last.weight)-6);
}
