var GUIDE={"peps": [{"id": "tesa", "name": "Tesamorelin", "glance": ["Tesamorelin", "44-AA GHRH analog", "FDA-approved (Egrifta) for HIV lipodystrophy, not general weight loss", "Night × 5 (not Tue, Thu)", "Clinic: fasted 2+ hours before, 30 min after"], "items": [{"label": "What it is", "value": "A lab-made copy of the body’s growth-hormone-releasing hormone (GHRH), with a small chemical cap on the front end so it lasts a little longer in the blood. Sold as the FDA-approved drug Egrifta (including Egrifta WR and Egrifta SV)."}, {"label": "Purpose", "value": "The approved use is to reduce excess abdominal fat in adults with HIV-associated lipodystrophy. It is not approved as a general weight-loss drug. Your clinic is using it on its own plan; that use is directed by them, not by the approved label."}, {"label": "Makeup", "value": "44 amino acids, the same chain as human GHRH, plus a trans-3-hexenoyl group attached to the first amino acid (tyrosine), and an amide at the last amino acid (leucine). Sequence of the 44-amino-acid chain: YADAIFTNSYRKVLGQLSARKLLQDIMSRQQGESNQERGARARL-NH2."}, {"label": "How it works", "value": "It docks on GHRH receptors in the pituitary and triggers pulses of your own growth hormone. Growth hormone then helps break down fat and supports tissue repair, in part by raising IGF-1. Because it uses your own pulses rather than injected growth hormone, the effect still depends on a working pituitary."}, {"label": "Regulatory status", "value": "FDA-approved (2010) as tesamorelin for injection, brand Egrifta, only for the HIV lipodystrophy use above. It is classified as a biologic, so compounding pharmacies generally may not make a copy of it. The official label does not set a time of day or a fasting rule."}, {"label": "Timing on your schedule", "value": "Your clinic lists it at night on Friday, Saturday, Sunday, Monday, and Wednesday — not Tuesday or Thursday. Clinic notes: last food at least 2 hours before, and nothing for 30 minutes after. You already stop eating at 8–9 PM, and you go to bed around 2 AM after patrol. The approved product is labeled once daily; the main Egrifta studies used morning injections (about 6 AM to noon). Nighttime use is a clinic practice, often chosen to line up with a fasted state and with the body’s sleep-related growth-hormone pulse."}, {"label": "Common side effects", "value": "The label’s most common reactions are joint pain, redness or itch at the injection site, pain in an arm or leg, swelling in the hands or feet, and muscle pain. It can also raise blood sugar and IGF-1, and can cause fluid retention or carpal-tunnel symptoms. It is contraindicated if the pituitary-hypothalamic axis is disrupted, if there is active cancer, if you are allergic to tesamorelin or its ingredients, or in pregnancy. The label asks for IGF-1 and glucose monitoring. Rotate abdominal injection sites; do not inject into scars, bruises, or the navel."}], "ask": "Ask your clinic whether “at night” means after you get home around bedtime (~2 AM), when you are off patrol and already fasted, rather than the app’s 10 PM reminder while you are still on shift. Also ask whether the two nights off (Tuesday and Thursday) are intentional, because the approved product is once daily."}, {"id": "glow", "name": "GLOW + KPV", "glance": ["GLOW + KPV", "Usual clinic blend: BPC-157, TB-500, GHK-Cu, plus KPV; confirm contents", "Research only; not FDA-approved. Former compounding Category 2 concerns still posted", "Every morning", "4 weeks on, 2–4 weeks off; KPV continues"], "items": [{"label": "What it is", "value": "Your clinic lists GLOW + KPV as one syringe, every morning. GLOW is a common clinic name for a blend of three research peptides: BPC-157, TB-500, and GHK-Cu. Adding KPV matches the four-part blend some clinics call KLOW. Confirm the exact ingredients with your clinic; the notes below assume that usual four-part mix."}, {"label": "Purpose", "value": "Clinics use this kind of blend for tissue repair, skin and connective-tissue support, and calming inflammation. Those uses come from animal and lab research, not from large, well-controlled human trials, and none of these peptides is FDA-approved as a drug for those purposes."}, {"label": "Makeup", "value": "BPC-157 is a 15-amino-acid fragment of a gastric protein, sequence GEPPPGKPADDAGLV (Gly-Glu-Pro-Pro-Pro-Gly-Lys-Pro-Ala-Asp-Asp-Ala-Gly-Leu-Val). TB-500 is the name usually given to a 7-amino-acid piece of thymosin β4, sequence Ac-LKKTETQ (the actin-binding fragment); full thymosin β4 is 43 amino acids. GHK-Cu is the tripeptide Gly-His-Lys bound to copper. KPV is the tripeptide Lys-Pro-Val, the last three amino acids of alpha-MSH."}, {"label": "How it works", "value": "In preclinical work, BPC-157 has been studied for gut lining and tendon or ligament healing. TB-500 / thymosin β4 is involved in cell movement and actin binding, which is part of wound repair. GHK-Cu is a naturally occurring copper-binding peptide studied for skin remodeling. KPV is an anti-inflammatory fragment of alpha-MSH that acts on melanocortin pathways in lab and animal studies. Human evidence for injectable use is still thin."}, {"label": "Regulatory status", "value": "None of these is an FDA-approved drug for injection. FDA previously placed BPC-157, injectable GHK-Cu, TB-500 (the LKKTETQ fragment), and KPV in compounding Category 2, citing immunogenicity, peptide impurities, and little or no human safety data — and, for KPV and TB-500, no identified human exposure data at all. Those nominations were later withdrawn; FDA’s safety-risk page, current as of April 22, 2026, still lists the same concerns on the withdrawn table. Withdrawal is not an approval to compound and is not a finding that the peptides are safe. Non-injectable GHK-Cu was put back under Category 1 evaluation in May 2026; that does not cover the injectable form in a blend."}, {"label": "Timing on your schedule", "value": "Every morning, including patrol days. Clinic notes: GLOW runs 4 weeks on, then 2–4 weeks off; KPV continues alone during the off weeks. The cycle on your app starts November 1, 2026, so by mid-November you were in the first on-stretch. Morning doses can move with your actual wake-up after a 2 AM bedtime."}, {"label": "Common side effects", "value": "There is no approved label, so there is no official side-effect list. Reported issues are mostly local (redness, itch, or irritation at the injection site). FDA’s concern is the unknown: immune reactions to peptide impurities or aggregates, and the lack of solid human safety data. Confirm the exact contents, and any signs that should make you hold a dose, with your clinic."}], "ask": "Ask your clinic to confirm what is in the GLOW syringe and when the first off-stretch starts, so KPV-only weeks are planned and not guessed."}, {"id": "motsc", "name": "MOTS-c", "glance": ["MOTS-c", "16-AA mitochondrial peptide", "Not FDA-approved; no solid human exposure data", "Fri, Mon, Wed mornings", "Fri note: before gym or work"], "items": [{"label": "What it is", "value": "A 16-amino-acid peptide that the body can make from a short reading frame in mitochondrial 12S rRNA. The name stands for mitochondrial open reading frame of the 12S rRNA type-c."}, {"label": "Purpose", "value": "In animal and cell studies it improves insulin sensitivity, helps muscle use glucose, and acts a bit like an exercise signal. It is being researched for metabolism and physical decline with age. It is not approved to treat obesity, diabetes, or anything else in people."}, {"label": "Makeup", "value": "16 amino acids. Published human sequence: MRWQEMGYIFYPRKLR (Met-Arg-Trp-Gln-Glu-Met-Gly-Tyr-Ile-Phe-Tyr-Pro-Arg-Lys-Leu-Arg)."}, {"label": "How it works", "value": "Its best-described path is in skeletal muscle: it interferes with the folate cycle and de novo purine making, which raises a natural AMPK activator (AICAR) and turns on AMPK. AMPK helps the muscle take up glucose and burn fat. A 2021 Nature Communications paper also described MOTS-c as an exercise-induced mitochondrial signal that supports muscle homeostasis in aging animals."}, {"label": "Regulatory status", "value": "Not FDA-approved. FDA previously listed it in compounding Category 2: no human exposure data, plus concern about immunogenicity and peptide impurities. That nomination was later withdrawn (FDA page current as of April 22, 2026); withdrawal is not approval. In a July 23–24, 2026 Pharmacy Compounding Advisory Committee briefing, FDA staff proposed not adding MOTS-c (free base or acetate) to the 503A bulks list, citing poor characterization and the lack of human safety and effectiveness data. An advisory-committee discussion is not a final FDA decision, and MOTS-c is still not an approved drug."}, {"label": "Timing on your schedule", "value": "Friday morning (clinic note: before gym or work), Monday morning, and Wednesday morning. Friday and Monday are lift-and-patrol days, with the gym around noon; Wednesday is an off day. Because some of the research is about muscle metabolism and exercise, it is fair to ask whether the third day should stay on Wednesday or sit closer to training. Do not change the day on your own."}, {"label": "Common side effects", "value": "There is no approved label and, as FDA has said, no identified human exposure data, so side effects in people are not well described. Unknown immune reactions and product quality are the main regulatory concerns. Report anything unusual to your clinic."}], "ask": "Ask whether Friday’s “before gym or work” timing should also apply on Monday, and whether Wednesday (an off day) is the right third morning."}, {"id": "semax", "name": "Semax/Selank", "glance": ["Semax/Selank", "Two 7-AA Russian neuropeptides, listed as one item", "Not FDA-approved in the U.S.", "Before shift Fri–Mon; Tue on waking; none Thu", "Confirm route (often nasal in published use)"], "items": [{"label": "What it is", "value": "Your clinic lists Semax and Selank together as one item. They are two related seven-amino-acid peptides developed in Russia. Semax is an analog of a piece of ACTH; Selank is an analog of tuftsin, a short immune peptide. In Russia they are registered drugs (often as nose drops); they are not FDA-approved in the United States."}, {"label": "Purpose", "value": "Semax has been used in Russia as a nootropic and in stroke recovery research. Selank has been used there for anxiety and tension. Human studies are mostly small Russian trials, often without the kind of blinding and placebo control expected in a modern FDA review. There is little evidence they improve cognition in healthy people."}, {"label": "Makeup", "value": "Semax is Met-Glu-His-Phe-Pro-Gly-Pro (MEHFPGP), seven amino acids: the ACTH(4–7) core plus a Pro-Gly-Pro tail that helps it last longer. Selank is Thr-Lys-Pro-Arg-Pro-Gly-Pro (TKPRPGP), seven amino acids: tuftsin (Thr-Lys-Pro-Arg) plus the same Pro-Gly-Pro tail."}, {"label": "How it works", "value": "Semax, in animal work, can raise BDNF (a brain growth factor) in the hippocampus and cortex and does not act like a steroid hormone the way full ACTH does. Selank, in animal work, appears to ease anxiety by modulating the GABA system (the same calming system benzodiazepines use, though not at the same binding site) and by affecting enkephalin breakdown. Those mechanisms are not as firmly established in people."}, {"label": "Regulatory status", "value": "Not FDA-approved. FDA previously listed Semax (heptapeptide) and Selank acetate (TP-7) in compounding Category 2 over immunogenicity, aggregation, peptide impurities, and limited or missing human safety information. Those nominations were later withdrawn; the same concerns remain on FDA’s withdrawn list (page current as of April 22, 2026). Withdrawal is not approval to compound."}, {"label": "Timing on your schedule", "value": "Before shift, around 2 PM, on Friday, Saturday, Sunday, and Monday — which lines up with a 3 PM start. On Tuesday (an off day) it moves to waking. Thursday has none. Published clinical use is usually in the nose; your clinic sheet does not state the route, so confirm the form with them. Afternoon timing on work days is a reasonable fit if the aim is alertness and calm on patrol; morning on a day off is a different pattern."}, {"label": "Common side effects", "value": "Human safety data are limited. Intranasal use may irritate the nose. Because FDA flagged immunogenicity and impurities, unusual allergic or systemic symptoms should be reported to your clinic. Do not mix this with a new anxiety or stimulant medicine without asking them."}], "ask": "Ask whether Thursday should have a dose, and whether off-day timing should stay at waking or match the afternoon work-day slot. Also confirm whether this is a nasal or injectable form."}, {"id": "tirz", "name": "Tirzepatide", "glance": ["Tirzepatide", "39-AA dual GIP/GLP-1 agonist", "FDA-approved (Mounjaro, Zepbound); routine compounding after the shortage ended is restricted", "Mon night, Thu night", "Approved label is once weekly, any time, with or without food"], "items": [{"label": "What it is", "value": "A long-acting lab-made peptide that turns on two gut-hormone receptors at once: GIP and GLP-1. The FDA-approved brands are Mounjaro (type 2 diabetes) and Zepbound (chronic weight management)."}, {"label": "Purpose", "value": "On the approved labels it improves blood sugar in type 2 diabetes and helps with long-term weight management in people who meet the labeled criteria. It slows stomach emptying, reduces appetite, and improves insulin signaling."}, {"label": "Makeup", "value": "A 39-amino-acid peptide with two aminoisobutyric acid (Aib) substitutions and a C20 fatty-diacid chain attached, which lets it bind albumin and last about a week. The official labels describe that structure; the exact residue-by-residue chain is in the chemistry reviews for the approved products."}, {"label": "How it works", "value": "By activating both GIP and GLP-1 receptors it increases insulin when glucose is high, lowers glucagon, slows how fast food leaves the stomach, and reduces appetite. That is why nausea and a smaller appetite are common when it is started or increased."}, {"label": "Regulatory status", "value": "FDA-approved. After FDA declared the tirzepatide injection shortage resolved in late 2024, routine compounding of an essentially identical product was no longer under shortage discretion (enforcement discretion ended in early 2025 for 503A and 503B compounders). Your clinic should be using a lawful prescribed product; that is worth confirming with them, not changing on your own."}, {"label": "Timing on your schedule", "value": "Monday night and Thursday night. The approved labels are once weekly, any time of day, with or without food, on the same day each week. Your sheet lists two nights. Your clinic app already notes that tirzepatide (along with testosterone and NAD+) was carried over from a previous stack and should be confirmed. Monday night also falls at the end of a patrol shift."}, {"label": "Common side effects", "value": "Nausea, diarrhea, vomiting, constipation, stomach pain, and lower appetite are common. There is a boxed warning about thyroid C-cell tumors in rodents; it is contraindicated if you or a family member has had medullary thyroid cancer, or if you have MEN2. Other label warnings include pancreatitis, gallbladder problems, kidney issues from dehydration, delayed stomach emptying (which can affect other oral medicines), and, in people with diabetes, possible worsening of diabetic retinopathy. Tell your clinic about severe abdominal pain, persistent vomiting, or a neck mass."}], "ask": "Ask your clinic to confirm the twice-weekly nights against the approved once-weekly labeling, and whether the Monday shot should wait until you are home from patrol. This is a confirmation question, not a suggestion to change the amount."}, {"id": "testcyp", "name": "Testosterone Cyp", "glance": ["Testosterone Cyp", "Steroid ester, not a peptide", "FDA-approved IM for male hypogonadism", "Sat and Wed mornings, IM", "Confirm with clinic (carried over)"], "items": [{"label": "What it is", "value": "Not a peptide. It is testosterone attached to a cypionate ester, which slows release after an intramuscular shot. FDA-approved examples include Depo-Testosterone and other testosterone cypionate injections."}, {"label": "Purpose", "value": "The approved use is testosterone replacement in men with confirmed hypogonadism (the testes or the pituitary-hypothalamic signal is not making enough). It is not approved as an anti-aging or performance drug. Your clinic directs this part of the plan."}, {"label": "Makeup", "value": "The hormone testosterone (a steroid, not an amino-acid chain) linked to cyclopentylpropionate (the cypionate ester) so it dissolves in oil and releases over several days after an intramuscular injection."}, {"label": "How it works", "value": "After the ester is cleaved, testosterone binds androgen receptors in muscle, bone, skin, and other tissues, supporting male sexual function, red-cell production, muscle, and bone. Exogenous testosterone also suppresses the body’s own signal to the testes, which can reduce fertility while you are on it."}, {"label": "Regulatory status", "value": "FDA-approved as an intramuscular injection for male hypogonadism. It is a controlled substance. The official label describes deep intramuscular injection (typically the gluteal muscle) on a less frequent interval than twice a week; splitting the week (your Wednesday and Saturday mornings) is a common clinic practice to keep levels steadier, but it is still your clinic’s plan."}, {"label": "Timing on your schedule", "value": "Wednesday morning (an off day) and Saturday morning (a patrol day, with the gym later around noon). Morning intramuscular shots before the day starts usually fit both days; Saturday is the one that has to sit comfortably with training and a 3 PM shift."}, {"label": "Common side effects", "value": "Injection-site pain, acne or oily skin, swelling, a rise in red-cell count (hematocrit), higher blood pressure, worsening sleep apnea, breast tenderness, lower sperm production, and mood or libido changes. The label also warns about blood clots and prostate monitoring. Clinics typically watch hematocrit, PSA, blood pressure, and blood lipids. Your clinic app already says to confirm this item with them because it was carried over from a previous stack."}], "ask": "Confirm with your clinic that Wednesday and Saturday mornings still fit, and that Saturday’s intramuscular shot sits comfortably with a noon gym session and a 3 PM shift."}, {"id": "gluta", "name": "Glutathione", "glance": ["Glutathione", "3-AA antioxidant peptide", "Not approved as a wellness injection; 503A Category 1 (under evaluation)", "Sat, Tue, Thu nights", "Sat night is a patrol night"], "items": [{"label": "What it is", "value": "The body’s main small antioxidant peptide, used by clinics as a compounded injection. It is not an FDA-approved injectable drug for wellness or detox."}, {"label": "Purpose", "value": "In the body it helps recycle oxidative stress and support liver detoxification pathways. Clinics offer injections for energy, recovery, or “detox.” Those wellness uses are not FDA-approved indications."}, {"label": "Makeup", "value": "A tripeptide: gamma-glutamyl-cysteinyl-glycine (γ-Glu-Cys-Gly). The unusual gamma bond between glutamate and cysteine is what makes it glutathione rather than an ordinary three-amino-acid chain."}, {"label": "How it works", "value": "The cysteine thiol is the working part: it can neutralize reactive oxygen species and is rebuilt by glutathione reductase. Oral glutathione is poorly absorbed, which is why some clinics use an injection. That does not, by itself, prove a health benefit in someone who is not deficient."}, {"label": "Regulatory status", "value": "Not FDA-approved as a sterile injection for these uses. Glutathione is on FDA’s 503A Category 1 list (under evaluation for compounding, not an approval). FDA has separately warned compounders not to use dietary-supplement-grade glutathione in sterile injectables, because of endotoxin and other contaminants, and has reported fevers, chills, shock-like symptoms, and hospitalizations. There have also been recalls of compounded glutathione for high endotoxin. Product quality matters here."}, {"label": "Timing on your schedule", "value": "Saturday night (a patrol night, paired with tesamorelin), Tuesday night (an off night, no tesamorelin), and Thursday night (an off night, paired with tirzepatide). Saturday’s shot has the same on-duty problem as other night doses."}, {"label": "Common side effects", "value": "When the product is clean, injections are often well tolerated; some people notice brief flushing or irritation at the site. Contaminated or high-endotoxin lots have caused fever, chills, and more serious reactions — seek care and tell your clinic if that happens. Inhaled glutathione has been linked to breathing trouble in people with asthma; that is a different route than a shot."}], "ask": "Ask your clinic about the order of Saturday night’s two shots (tesamorelin and glutathione), and whether Saturday’s glutathione should wait until you are home from patrol."}, {"id": "nad", "name": "NAD+", "items": [{"label": "What it is", "value": "Not a peptide. NAD+ is nicotinamide adenine dinucleotide, a coenzyme every cell uses in energy metabolism. Clinics offer it as a compounded injection or infusion. It is not an FDA-approved shot for aging or energy."}, {"label": "Purpose", "value": "NAD+ is required for mitochondrial energy production and for enzymes such as sirtuins. Levels tend to fall with age in research settings. Wellness clinics market injections for energy, recovery, and “longevity.” Those uses are not approved indications."}, {"label": "Makeup", "value": "A dinucleotide: nicotinamide (a form of vitamin B3) joined to adenine through two phosphate groups. It is a small molecule, not an amino-acid chain."}, {"label": "How it works", "value": "It shuttles electrons in metabolism (NAD+ / NADH) and is a substrate for DNA-repair and sirtuin enzymes. Giving it as a shot raises blood NAD+ metabolites; how much that changes how you feel, and for how long, is still being studied."}, {"label": "Regulatory status", "value": "Not FDA-approved as an injectable drug for these uses. NAD and NADH are on FDA’s 503A Category 1 list (under evaluation for compounding, not an approval). FDA has also reminded compounders to use ingredients suitable for sterile compounding; contaminated lots of related infusions have caused chills, shaking, vomiting, and fatigue. Your clinic app already says to confirm this item because it was carried over from a previous stack."}, {"label": "Timing on your schedule", "value": "Sunday, Tuesday, and Thursday mornings only. Clinic notes: mornings only, pushed slowly over 30–60 seconds. Sunday morning comes after a Friday–Sunday stretch of 3 PM–1 AM shifts and a ~2 AM bedtime, so “morning” may be later than 9 AM. The slow push is about comfort: pushing too fast is what tends to cause flushing, cramping, or chest tightness."}, {"label": "Common side effects", "value": "There is no approved label. People often report flushing, nausea, abdominal cramping, a feeling of chest pressure, or a faster heart rate when a push or infusion is too quick; symptoms often ease when the push is slowed or stopped. Fever or shaking can be a red flag for a contaminated product — contact your clinic or urgent care."}], "ask": "Ask what counts as “morning” after a night shift, and keep the slow-push rule even if you wake later than 9 AM.", "glance": ["NAD+", "Energy coenzyme, not a peptide", "Not approved as a wellness injection; 503A Category 1 (under evaluation)", "Sun, Tue, Thu mornings", "Mornings only, slow push, 30–60 sec"]}, {"id": "dihexa", "name": "Dihexa", "items": [{"label": "What it is", "value": "A small, lab-made molecule derived from angiotensin IV, developed at Washington State University (also called PNB-0408). Your app logs it separately from the 30-shot weekly grid, because amount and timing still come from you or your clinic."}, {"label": "Purpose", "value": "In animal studies it was investigated for synapse growth and memory. It is sometimes marketed for focus or cognition. There are no adequate human trials, and it is not approved for any use."}, {"label": "Makeup", "value": "Not a long peptide. Chemically it is N-hexanoyl-Tyr-Ile-(6-aminohexanoic) amide: a two-amino-acid core (tyrosine-isoleucine) with a hexanoyl cap on the front and a 6-aminohexanoic amide on the back. That design was meant to make an angiotensin-IV analog more stable and able to enter the brain."}, {"label": "How it works", "value": "Published work (including a 2014 Journal of Pharmacology and Experimental Therapeutics paper) reports that it binds hepatocyte growth factor (HGF) and boosts HGF/c-Met signaling, which in animals was linked to new synapses and better performance on memory tasks. c-Met is also a pathway that can be active in some cancers, which is one reason the lack of human safety data matters."}, {"label": "Regulatory status", "value": "Not FDA-approved. FDA listed dihexa acetate in compounding Category 2 because it had not identified any human exposure data by any route, and therefore could not say whether it would cause harm in people. That nomination was later withdrawn; the same “no human exposure data” language remains on FDA’s withdrawn list (page current as of April 22, 2026). Withdrawal is not approval to compound."}, {"label": "Timing on your schedule", "value": "Not on the stick schedule. An older tracker in the app described it as a once-daily capsule, but your current peptides tab leaves amount and timing blank for you or the clinic to set. Until that is written down, it should not be guessed from this page."}, {"label": "Common side effects", "value": "There is no human side-effect list, because FDA has not identified human exposure data. The theoretical concern worth asking your clinic about is long-term c-Met activation. Do not start, stop, or time this from research papers alone."}], "ask": "Ask your clinic to put Dihexa’s form, days, and time of day in writing so it can sit on the same week grid as the rest. This page will not invent that timing.", "glance": ["Dihexa", "Stabilized angiotensin-IV analog", "Not FDA-approved; FDA cited no human exposure data", "Not on the 30-shot grid", "Amount and timing still come from your clinic"]}], "ask": ["Night vs bedtime on patrol days: the sheet says “at night,” and the app’s default reminder is 10 PM, when you are still on duty until 1 AM. Ask whether tesamorelin (and Saturday glutathione, Monday tirzepatide) should wait until you are home, around your 2 AM bedtime. The official tesamorelin label does not require a time of day; your clinic’s fasting rule is already met by then.", "Tesamorelin is on five nights (Fri, Sat, Sun, Mon, Wed), not Tuesday or Thursday. The approved product is labeled once daily, and the main studies used morning injections. Ask whether the two nights off are intentional, and whether night — rather than morning — is still the right window given a 2 AM bedtime.", "Tirzepatide is listed Monday night and Thursday night. The approved labels are once weekly, any time of day, with or without food. Your clinic sheet already says to confirm tirzepatide, testosterone, and NAD+ because those were carried over from a previous stack. Ask them to confirm the twice-weekly nights, and whether Monday’s shot should be after you get home.", "Semax/Selank fits well at ~2 PM before a 3 PM shift, but Tuesday it moves to waking and Thursday has none. MOTS-c is Friday (before gym or work), Monday morning, and Wednesday morning — an off day. NAD+ is Sunday, Tuesday, and Thursday mornings only; Sunday follows night shifts. Ask whether those off-day and post-shift slots are still the ones they want, and what counts as morning after a late bedtime."], "src": [{"t": "Egrifta WR (tesamorelin) prescribing information", "s": "FDA / Theratechnologies", "d": "2025", "h": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/022505s020lbl.pdf"}, {"t": "DailyMed: Egrifta WR (tesamorelin)", "s": "NIH DailyMed", "d": "", "h": "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=839334d3-8c1d-4c26-9036-2ab524a6ea75"}, {"t": "Metabolic effects of a growth hormone–releasing factor in patients with HIV", "s": "New England Journal of Medicine", "d": "2007", "h": "https://www.nejm.org/doi/full/10.1056/NEJMoa072375"}, {"t": "Zepbound (tirzepatide) prescribing information", "s": "Eli Lilly / FDA", "d": "", "h": "https://pi.lilly.com/us/zepbound-uspi.pdf"}, {"t": "FDA clarifies policies for compounders as national GLP-1 supply begins to stabilize", "s": "FDA", "d": "2024–2025", "h": "https://www.fda.gov/drugs/drug-alerts-and-statements/fda-clarifies-policies-compounders-national-glp-1-supply-begins-stabilize"}, {"t": "Depo-Testosterone (testosterone cypionate) prescribing information", "s": "FDA / Pfizer", "d": "2025", "h": "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/085635s028lbl.pdf"}, {"t": "Certain bulk drug substances for use in compounding that may present significant safety risks", "s": "FDA", "d": "Current as of Apr 22, 2026", "h": "https://www.fda.gov/drugs/human-drug-compounding/certain-bulk-drug-substances-use-compounding-may-present-significant-safety-risks"}, {"t": "Bulk drug substances nominated for compounding under section 503A", "s": "FDA", "d": "", "h": "https://www.fda.gov/media/94155/download"}, {"t": "FDA briefing document: MOTS-c for the 503A bulks list", "s": "FDA Pharmacy Compounding Advisory Committee", "d": "July 23–24, 2026", "h": "https://www.fda.gov/media/193347/download"}, {"t": "FDA reminds compounders not to use dietary-supplement-grade glutathione for injectables", "s": "FDA", "d": "", "h": "https://www.fda.gov/drugs/human-drug-compounding/fda-reminds-compounders-not-use-dietary-supplement-grade-glutathione-injectables"}, {"t": "The mitochondrial-derived peptide MOTS-c promotes metabolic homeostasis", "s": "Cell Metabolism (PMC)", "d": "2015", "h": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4350682/"}, {"t": "MOTS-c is an exercise-induced mitochondrial-encoded regulator of age-dependent physical decline", "s": "Nature Communications (PMC)", "d": "2021", "h": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7817689/"}, {"t": "Procognitive and synaptogenic effects of angiotensin IV–derived peptides depend on HGF/c-Met", "s": "Journal of Pharmacology and Experimental Therapeutics (PMC)", "d": "2014", "h": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4201273/"}, {"t": "A new gastric juice peptide, BPC", "s": "PubMed", "d": "1993", "h": "https://pubmed.ncbi.nlm.nih.gov/8298609/"}, {"t": "Semax: Cognitive Vitality for Researchers", "s": "Alzheimer’s Drug Discovery Foundation", "d": "", "h": "https://www.alzdiscovery.org/uploads/cognitive_vitality_media/Semax-Cognitive-Vitality-For-Researchers.pdf"}]};
var GUIDE_DISCLAIMER="Educational reference only, not medical advice. No doses are listed. Confirm anything about your own use with your clinic or prescriber.";
function renderGuideView(){

function mapSavedDays(){ var o=jparse(store.get(MAP_DAYS_KEY),{}); return (o&&typeof o==="object")?o:{}; }
function mapDays(p){
  var saved=mapSavedDays()[p.id];
  if (Array.isArray(saved)) return saved.map(Number);
  return (p.days||[]).slice();
}
function mapSlot(p, day){ return p.slotFor?p.slotFor(day):(p.slot||"day"); }
function mapLastLog(p){
  var best=null;
  if (p.logKind==="dihexa"){
    for (var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if (!k||k.indexOf("m165-dihexa-")!==0) continue;
      var ds=k.slice(12);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) continue;
      var rec=jparse(localStorage.getItem(k),{});
      if (!rec||!rec.taken) continue;
      if (!best||ds>best.date) best={date:ds,time:rec.taken};
    }
    return best;
  }
  var tail="-"+p.logId;
  for (var j=0;j<localStorage.length;j++){
    var key=localStorage.key(j);
    if (!key||!/^m165-pep-\d{4}-\d{2}-\d{2}$/.test(key)) continue;
    var day=key.slice(9);
    var log=jparse(localStorage.getItem(key),{});
    if (!log||typeof log!=="object") continue;
    Object.keys(log).forEach(function(slotKey){
      if (slotKey.slice(-tail.length)!==tail) return;
      if (!log[slotKey]) return;
      if (!best||day>best.date) best={date:day,time:String(log[slotKey])};
    });
  }
  return best;
}
function mapWhen(dateStr){
  if (!dateStr) return "Not logged yet";
  if (dateStr===todayStr()) return "Today";
  if (dateStr===yesterdayStr()) return "Yesterday";
  var names=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return names[new Date(dateStr+"T00:00:00").getDay()]||"Earlier";
}
function mapNextLabel(p){
  var days=mapDays(p);
  if (!days.length) return "No clinic day set";
  var last=mapLastLog(p);
  for (var i=0;i<8;i++){
    var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+i);
    if (days.indexOf(d.getDay())<0) continue;
    if (i===0 && last && last.date===todayStr()) continue;
    var when=i===0?"Today":(i===1?"Tomorrow":["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]);
    return when+" · "+MAP_SLOT_LABEL[mapSlot(p, d.getDay())];
  }
  return "No clinic day set";
}
function mapStatus(p){
  var last=mapLastLog(p);
  var days=mapDays(p);
  var due=days.indexOf(new Date().getDay())>=0;
  var logged=!!(last&&last.date===todayStr());
  return {last:last, logged:logged, due:due, hot:due&&!logged?"due":(logged?"logged":"idle"), next:mapNextLabel(p)};
}

function moveFigureHTML(name){
  var kind=MOVE_OF[name];
  if (!kind) return "";
  return '<div class="move-fig"><div class="move-top"><div class="box-k">Rep loop · '+esc(MOVE_TITLE[kind]||kind)+'</div><button type="button" class="move-toggle" aria-pressed="false">Pause</button></div>'+

}
function wireMoveFigure(detail){
  var box=detail.querySelector(".move-fig");
  if (!box) return;
  var btn=box.querySelector(".move-toggle");
  btn.addEventListener("click",function(e){
    e.stopPropagation();
    var paused=box.classList.toggle("is-paused");
    btn.textContent=paused?"Play":"Pause";
    btn.setAttribute("aria-pressed", paused?"true":"false");
  });
}
function m165MoveCheck(){
  var missing=[];
  DAYS.forEach(function(d){ d.exercises.forEach(function(e){ if (!MOVE_OF[e.name]) missing.push(e.name); }); });
  var calf=rotationCue("Leg Press Calf Raise",1)==="Toes straight" && rotationCue("Leg Press Calf Raise",2)==="Toes out" && rotationCue("Leg Press Calf Raise",3)==="Toes in";
  var bi=rotationCue("Cable Curl",1).indexOf("Close")===0 && rotationCue("Cable Curl",3).indexOf("Neutral")===0;
  var tri=rotationCue("Rope Triceps Pushdown",1).indexOf("Overhead")===0 && rotationCue("Rope Triceps Pushdown",2).indexOf("Flared")===0;
  var demo=moveFigureHTML("Smith Romanian Deadlift");
  var chest=POS_MAPS.chest && POS_MAPS.chest.options.length===3 && POS_MAPS.glutes && POS_MAPS.back && POS_MAPS.core && POS_MAPS.quads && POS_MAPS.hams;
  window.__m165MoveOk=!missing.length && calf && bi && tri && demo.indexOf("move-toggle")>=0 && demo.indexOf("Pause")>=0 && !!chest;
  window.__m165MoveMissing=missing;
  if (!window.__m165MoveOk) console.error("move check failed", missing, calf, chest);
}
function m165MapCheck(){
  var names={}, bad=[], digits=[];
  MAP_PEPS.forEach(function(p){
    names[p.name]=1;
    var blob=[p.name,p.does,p.where,p.train,p.evidenceLabel].join(" ");
    if (/\d/.test(blob)) digits.push(p.id);
    if (!p.organs||!p.organs.length||!p.logId) bad.push(p.id);
  });
  var need=["Tesamorelin","GLOW+KPV","MOTS-c","Semax/Selank","Tirzepatide","Testosterone Cyp","Glutathione","NAD+","Dihexa"];
  var missing=need.filter(function(n){ return !names[n]; });
  window.__m165MapOk=MAP_PEPS.length===9 && !missing.length && !digits.length && !bad.length;
  window.__m165MapBad={missing:missing,digits:digits,bad:bad};
  if (!window.__m165MapOk) console.error("peptide map check failed", window.__m165MapBad);
}
m165MapCheck();
