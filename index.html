<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mission 165</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission 165">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0c">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0a0a0c; --panel:#131317; --panel2:#1a1a20; --border:#2a2a32;
    --text:#e9e9ee; --muted:#8b8b95; --violet:#8b5cf6; --violetDim:#3d2f6b;
    --amber:#f4b740; --primary:#a855f7; --secondary:#f97316; --stabilizer:#38bdf8;
    --base:#33333c; --green:#22c55e; --rose:#f43f5e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,sans-serif; padding-bottom:40px;
    padding-top:env(safe-area-inset-top);
  }
  ::-webkit-scrollbar{height:4px;width:4px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  .storage-banner{
    background:#7f1d1d;color:#fecaca;padding:12px 16px;font-size:12px;line-height:1.5;
    border-bottom:2px solid #ef4444;position:sticky;top:0;z-index:100;
  }
  .storage-banner button{
    display:block;margin-top:8px;background:#450a0a;color:#fecaca;border:1px solid #ef4444;
    border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;
  }

  /* v2: data safety UI */
  .export-banner{background:#3b2a06;color:#fde68a;padding:10px 16px;font-size:12px;line-height:1.45;border-bottom:2px solid var(--amber);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .export-banner b{color:#fff;}
  .export-banner button{background:rgba(244,183,64,.15);color:#fde68a;border:1px solid var(--amber);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}
  .export-banner button.ghost{background:transparent;border-color:#6b5a2a;color:#d6c38a;}
  .save-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:#052e16;color:#bbf7d0;border:1px solid var(--green);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;z-index:200;transition:opacity .2s,transform .2s;white-space:nowrap;}
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .data-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .data-card .k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .data-card .line{font-size:12px;color:var(--text);margin:3px 0;}
  .data-card .muted{color:var(--muted);font-size:11px;}
  .data-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .data-btn{padding:10px 4px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:800;border:1px solid var(--green);background:rgba(34,197,94,.1);color:#bbf7d0;}
  .data-btn.imp{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .ms-card{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:14px;padding:14px;margin-bottom:14px;}
  .ms-card .k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
  .ms-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:12px;}
  .ms-row:first-of-type{border-top:none;}
  .ms-row .d{flex:0 0 78px;color:var(--muted);font-weight:700;}
  .ms-row .t{flex:1;color:var(--text);line-height:1.4;}
  .ms-row .t b{color:#fff;}
  .ms-goal{color:var(--green)!important;}
  .deload-banner{margin:0 0 14px;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.45;}
  .deload-banner.on{background:rgba(56,189,248,.1);border:1px solid var(--stabilizer);color:#bae6fd;}
  .deload-banner.off{background:var(--panel);border:1px solid var(--border);color:var(--muted);}
  .deload-banner b{color:#fff;}
  .deload-banner button{margin-left:6px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:10.5px;cursor:pointer;}

  /* v3: builder */
  .b-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .b-card>.k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
  .b-card summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--text);}
  .eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px;}
  .eq-item{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--text);line-height:1.3;}
  .eq-item input{margin-top:1px;accent-color:#8b5cf6;width:16px;height:16px;flex:0 0 16px;}
  .focus-row{display:flex;gap:6px;margin:6px 0 10px;}
  .focus-btn{flex:1;padding:9px 2px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer;}
  .focus-btn.active{border-color:var(--violet);background:rgba(139,92,246,.15);color:var(--text);}
  .gen-btns{display:flex;gap:8px;}
  .gen-btn{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--green);background:rgba(34,197,94,.1);color:#bbf7d0;font-weight:800;font-size:12.5px;cursor:pointer;}
  .gen-btn.alt{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .pick{border-top:1px solid var(--border);padding:11px 0;}
  .pick:first-of-type{border-top:none;}
  .pick .nm{font-size:13.5px;font-weight:800;color:#fff;}
  .pick .eq{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .pick .rx{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;}
  .pick .rx span{font-size:10.5px;font-weight:700;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--text);}
  .pick .why{font-size:11.5px;color:#c9c9d2;line-height:1.45;}
  .pick .why b{color:var(--amber);font-weight:700;}
  .pick .prog{font-size:11px;color:#bbf7d0;margin-top:4px;}
  .pick .log{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px;}
  .pick .log input{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 8px;font-size:12px;width:100%;}
  .vol-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:4px 0;}
  .vol-row .n{flex:0 0 88px;color:var(--text);font-weight:700;}
  .vol-row .bar{flex:1;height:7px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden;}
  .vol-row .bar i{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.25);}
  .vol-row .bar b{position:absolute;top:0;bottom:0;left:0;background:var(--violet);border-radius:4px;}
  .vol-row .v{flex:0 0 92px;text-align:right;color:var(--muted);font-size:10.5px;}
  .vol-row .v.ok{color:var(--green);} .vol-row .v.lo{color:var(--amber);} .vol-row .v.hi{color:var(--rose);}
  .rules li{font-size:11.5px;color:#d4d4dc;line-height:1.45;margin-bottom:3px;}
  .warn-note{font-size:11.5px;color:var(--amber);margin-top:6px;}

  .glass-tip{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(244,183,64,.08);border:1px solid rgba(244,183,64,.45);}
  .glass-tip .k{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
  .glass-tip .t{font-size:12.5px;color:var(--text);line-height:1.5;}

  .hero{background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 100%);border-bottom:1px solid var(--border);padding:22px 18px 18px;}
  .hero-row{display:flex;align-items:center;gap:14px;}
  .hero-badge{
    width:64px;height:64px;border-radius:12px;border:2px solid var(--violet);flex-shrink:0;
    background:linear-gradient(135deg,#2a1a5e,#0a0a0c);display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .hero-badge{overflow:hidden;}
  .hero-badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-badge .n{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--text);line-height:1;}
  .hero-badge .l{font-size:8px;color:var(--amber);letter-spacing:1.5px;font-weight:700;margin-top:2px;}
  .hero-kicker{font-size:10px;color:var(--amber);letter-spacing:2px;font-weight:700;}
  .hero-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.1;}
  .hero-sub{font-size:12px;color:var(--muted);}
  .hero-sub b{color:var(--amber);font-weight:600;}
  .hero-motto{margin-top:12px;text-align:center;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;color:var(--amber);letter-spacing:2.5px;text-transform:uppercase;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px 0;}
  .ring-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .ring-wrap{position:relative;width:46px;height:46px;}
  .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .reset-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);font-size:10px;border-radius:8px;padding:6px 10px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}

  .nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding-bottom:6px;box-shadow:0 6px 14px rgba(0,0,0,.45);}
  .view-toggle{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 14px 0;}
  /* v4: exercise media, meal prep, peptides */
  .ex-media{margin:0 0 12px;}
  .ex-media img{width:100%;display:block;border-radius:10px;border:1px solid var(--border);background:#111;}
  .ex-media .cap{font-size:10px;color:var(--muted);text-align:center;margin:5px 0 10px;letter-spacing:.5px;}
  .ex-media .cap b{color:#f87171;} .ex-media .cap i{color:#fb923c;font-style:normal;font-weight:700;}
  .vid-links{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px;}
  .vid-links a{display:block;padding:9px 10px;border-radius:9px;border:1px solid rgba(244,63,94,.5);background:rgba(244,63,94,.08);color:var(--text);font-size:12px;font-weight:600;text-decoration:none;}
  .mp-set{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
  .mp-set label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;}
  .mp-set input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:13px;font-weight:700;outline:none;}
  .mp-recipe{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel2);}
  .mp-recipe summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;}
  .mp-recipe summary .m{display:block;font-size:10.5px;color:var(--amber);font-weight:700;margin-top:2px;}
  .mp-recipe ul{margin:8px 0 6px 16px;padding:0;font-size:12px;line-height:1.5;color:var(--text);}
  .mp-recipe .n{font-size:11px;color:var(--muted);line-height:1.45;}
  .mp-recipe button{margin-top:8px;border:1px solid var(--violet);background:rgba(139,92,246,.15);color:var(--text);border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .chk-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer;}
  .chk-row:last-child{border-bottom:none;}
  .chk-row .bx{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;}
  .chk-row.on .bx{background:var(--violet);border-color:var(--violet);}
  .chk-row.on .tx{color:var(--muted);text-decoration:line-through;}
  .chk-row .tx small{display:block;color:var(--muted);font-size:10.5px;text-decoration:none;}
  .chk-row .tm{margin-left:auto;font-size:10px;color:var(--green);font-weight:700;white-space:nowrap;}
  .pep-slot{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--stabilizer);margin:10px 0 2px;}
  .pep-note{font-size:11.5px;line-height:1.5;color:var(--text);padding:6px 0;border-bottom:1px solid var(--border);}
  .pep-note:last-child{border-bottom:none;}
  .pep-foot{font-size:11px;color:var(--amber);border:1px solid rgba(244,183,64,.45);background:rgba(244,183,64,.08);border-radius:10px;padding:10px;margin-bottom:14px;line-height:1.45;}
  .pep-week{width:100%;border-collapse:collapse;font-size:11px;}
  .pep-week td,.pep-week th{border-bottom:1px solid var(--border);padding:6px 4px;vertical-align:top;text-align:left;}
  .pep-week th{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .pep-week tr.today td{background:rgba(139,92,246,.12);}
  .pep-week .d{font-weight:800;color:var(--amber);white-space:nowrap;}
  .pep-week .ok{color:var(--green);font-weight:800;}
  .rem-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;}
  .rem-row input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px;color:var(--text);color-scheme:dark;}
  .v4-btn{border:1px solid var(--violet);background:var(--violet);color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;}
  .v4-btn.ghost{background:transparent;color:var(--text);}

  .vt-btn{flex:1;padding:8px 0;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1px;min-width:0;}
  .vt-btn.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .day-tabs{display:flex;gap:8px;padding:10px 18px 0;overflow-x:auto;}
  .day-tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;text-align:center;line-height:1.5;}
  .day-tab.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .day-tab .d{font-size:9.5px;color:var(--muted);font-weight:700;}
  .day-tab.active .d{color:var(--amber);}
  .mini-row{display:flex;align-items:center;gap:8px;padding:8px 18px 0;}
  .mini-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .mini-bar>div{height:100%;background:var(--violet);transition:width .3s;}
  .mini-count{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .mini-timer{font-size:10.5px;color:var(--amber);font-weight:700;white-space:nowrap;}
  .logfor-row{display:flex;align-items:center;gap:6px;padding:6px 18px 0;flex-wrap:wrap;}
  .logfor-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .logfor-btn{font-size:10px;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700;}
  .logfor-btn.today.active{border-color:var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .logfor-btn.yest.active{border-color:var(--amber);background:rgba(244,183,64,.13);color:var(--text);}
  .logfor-date{font-size:10px;padding:3px 6px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);color-scheme:dark;}

  .content{padding:16px 18px 0;}

  .scripture{background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--violetDim);border-radius:14px;padding:16px;margin-bottom:16px;}
  .scripture .k{font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;}
  .scripture-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .scripture-grid .es{border-left:1px solid var(--border);padding-left:12px;}
  .scripture .ref{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700;}
  .scripture .txt{font-size:12.5px;color:var(--text);line-height:1.5;font-style:italic;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
  .card.done{border-color:rgba(139,92,246,.4);}
  .card.glute-primary{border-left:4px solid var(--rose);}
  .card.glute-secondary{border-left:4px solid rgba(244,63,94,.67);}
  .card-head{display:flex;align-items:center;padding:14px 14px 14px 10px;gap:10px;}
  .chk{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:15px;font-weight:900;padding:0;}
  .card.done .chk{border-color:var(--violet);background:var(--violet);}
  .chk .m{display:none;}
  .card.done .chk .m{display:block;}
  .card-main{flex:1;min-width:0;cursor:pointer;}
  .card-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ex-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--text);letter-spacing:.3px;}
  .card.done .ex-name{color:var(--muted);text-decoration:line-through;}
  .stars{color:var(--amber);letter-spacing:1px;font-size:12px;}
  .glute-tag{border-radius:999px;padding:1px 8px;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .glute-tag.primary{background:rgba(244,63,94,.13);color:var(--rose);border:1px solid rgba(244,63,94,.4);}
  .glute-tag.secondary{background:rgba(244,63,94,.09);color:rgba(244,63,94,.75);border:1px solid rgba(244,63,94,.3);}
  .card-sub-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
  .brand{border-radius:6px;padding:1px 7px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
  .pattern{font-size:11.5px;color:var(--muted);}
  .chev{color:var(--violet);background:none;border:none;font-size:20px;cursor:pointer;padding:4px;transition:transform .2s;}
  .card.open .chev{transform:rotate(180deg);}
  .card-detail{display:none;padding:0 14px 16px;border-top:1px solid var(--border);}
  .card.open .card-detail{display:block;}

  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0;}
  .stat{background:var(--panel2);border-radius:8px;padding:8px 4px;text-align:center;}
  .stat .k{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat .k.w{color:var(--amber);}
  .stat .v{font-size:13px;color:var(--text);font-weight:700;margin-top:2px;}
  .stat input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-weight:700;text-align:center;margin-top:2px;}
  .last-logged{font-size:10.5px;color:var(--amber);margin-bottom:12px;margin-top:-6px;}

  .form-btn{width:100%;margin-bottom:12px;padding:9px 0;border-radius:8px;cursor:pointer;border:1px solid var(--violet);background:rgba(139,92,246,.09);color:var(--text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}

  .timer-box,.prog-box{background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:12px;}
  .timer-top{display:flex;align-items:center;justify-content:space-between;}
  .box-k{font-size:10px;color:var(--violet);text-transform:uppercase;font-weight:700;letter-spacing:.5px;}
  .timer-time{font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
  .timer-time.done{color:var(--green);}

  .maps-row{display:flex;gap:10px;margin-bottom:14px;}

  .save-btn{width:100%;margin:10px 0 14px;padding:12px 0;border-radius:10px;cursor:pointer;border:1px solid var(--violet);background:var(--violet);color:#fff;font-size:13.5px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}

  .coverage{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:8px;margin-bottom:20px;}

  .sync-head{display:flex;align-items:center;gap:8px;}

  .sync-dot.on{background:var(--green);}
  .sync-dot.syncing{background:var(--amber);}
  .sync-dot.error{background:var(--rose);}
  .sync-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text);}
  .sync-status{font-size:11.5px;color:var(--muted);margin:4px 0 10px;}
  .sync-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .sync-btn{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:700;border:1px solid var(--violet);background:rgba(139,92,246,.13);color:var(--text);}
  .sync-btn.ghost{border-color:var(--border);background:transparent;color:var(--muted);}
  .sync-code{font-size:12px;color:var(--text);margin-bottom:10px;letter-spacing:.3px;}

  .sync-help{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:10px;}
  .hist-entry{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
  .hist-top{display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-size:10px;color:var(--amber);font-weight:700;letter-spacing:.5px;}
  .hist-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;}
  .hist-count{font-size:13px;font-weight:700;color:var(--violet);}

  .hist-pct{font-size:10px;color:var(--muted);text-align:right;}
  .hist-detail{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}

  .hist-ex{padding:3px 0;}

  .hist-ex .b{font-size:10.5px;color:var(--muted);padding-left:16px;}
  .empty-hist{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.6;}
  .backup-btn{width:100%;margin-bottom:14px;padding:12px 0;border-radius:10px;cursor:pointer;border:1px solid var(--amber);background:rgba(244,183,64,.09);color:var(--amber);font-size:12.5px;font-weight:800;letter-spacing:.5px;}
  .backup-btn.copied{border-color:var(--green);color:var(--green);}

  /* ---- Fuel / Regimen ---- */
  .fuel-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .fuel-card .k{font-size:10px;color:var(--violet);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:8px;}

  .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0 12px;}
  .bar>div{height:100%;background:var(--violet);transition:width .3s;}
  .bar>div.ok{background:var(--green);}
  .bar>div.over{background:var(--rose);}
  .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .preset-btn{padding:10px 8px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700;text-align:left;line-height:1.4;}

  .custom-row{display:flex;gap:6px;margin-bottom:12px;}

  /* ---- Body metrics ---- */

  .met-save.saved{background:rgba(34,197,94,.13);border-color:var(--green);color:var(--green);}

  /* ---- Recovery ---- */
  .rec-note{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:12px;}

  /* v4d: bottom tab bar, Today, Guide, Anatomy, Settings, About */

  .today-greet{font-size:18px;font-weight:800;}
  .today-sub{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .t-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
  .t-row{display:flex;justify-content:space-between;align-items:center;}
  .t-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .t-v{font-size:15px;} .t-v b{font-size:20px;}
  .t-bar{height:8px;background:var(--border);border-radius:5px;overflow:hidden;margin:8px 0;} .t-bar>div{height:100%;background:var(--green);}

  .t-add{display:flex;gap:6px;margin-top:6px;} .t-add input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);font-size:14px;}
  .t-addbtn,.t-more{border:1px solid var(--violet);background:var(--violet);color:#0a0a0c;border-radius:10px;padding:0 14px;font-weight:800;min-height:40px;cursor:pointer;}
  .t-more{background:transparent;color:var(--violet);}
  .t-next{font-size:14px;margin-top:6px;line-height:1.4;} .t-dim{color:var(--muted);font-size:12px;}
  .guide .g-top{display:flex;gap:8px;margin:8px 0;} .g-search{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px;color:var(--text);font-size:15px;}
  .g-pep{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;}

  .g-pep summary::-webkit-details-marker{display:none}
  .g-name{font-weight:800;font-size:15px;} .g-what{font-size:12px;color:var(--muted);}
  .g-body{padding:0 14px 14px;} .g-item{margin-top:9px;} .g-l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);} .g-v{font-size:13px;line-height:1.45;}
  .g-status{font-size:12.5px;background:var(--panel2);border-radius:8px;padding:8px;margin-top:2px;}
  .g-ask{font-size:12.5px;margin-top:10px;border-left:3px solid var(--amber);padding-left:8px;line-height:1.4;}
  .g-map{margin-top:10px;width:100%;} .g-src a{color:var(--violet);word-break:break-word;}
  .anat-tg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
  .anat-fig{display:flex;justify-content:center;background:radial-gradient(circle at 50% 40%,#1b1b25,#0d0d12);border:1px solid var(--border);border-radius:16px;padding:8px;}
  .anat-svg{width:100%;max-width:300px;height:auto;} .anat-svg .mg,.anat-svg .pa{cursor:pointer;}
  .anat-info{margin-top:10px;} .a-sub{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:8px 0 4px;}
  .a-ex{font-size:13px;padding:5px 0;border-top:1px solid var(--border);} .a-role{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin-right:4px;}
  .a-role.primary{background:rgba(239,68,68,.2);color:#fca5a5;} .a-role.secondary{background:rgba(245,158,11,.2);color:#fcd34d;}
  .a-area{padding:8px 0;border-top:1px solid var(--border);font-size:13px;}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:13px;}
  .set-row input{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);width:110px;font-size:14px;color-scheme:dark;}
  .set-row span input{width:64px;}
  .set-days{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;} .set-days label{display:flex;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:12px;}
  .about-hero{display:flex;gap:12px;align-items:center;margin:10px 0;} .about-hero img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--violet);} .about-t{font-size:17px;font-weight:800;}
  .save-toast{bottom:calc(84px + env(safe-area-inset-bottom))!important;}

  .move-svg .glow{fill:#22c55e;opacity:.35;}

  .move-hinge .torso{transform-origin:150px 118px;animation:hingeBend 2.8s ease-in-out infinite;}

  .move-press .arms{transform-origin:140px 70px;animation:pressOut 2.8s ease-in-out infinite;}
  .move-press .glow{animation:muscleGlow 2.8s ease-in-out infinite;}

  @keyframes muscleGlow{0%,100%{opacity:.28;}50%{opacity:1;}}
  @keyframes nudgeUp{0%,100%{transform:translate(0,6px);}50%{transform:translate(0,-10px);}}
  @keyframes nudgeDown{0%,100%{transform:translate(0,-6px);}50%{transform:translate(0,10px);}}
  @keyframes nudgeLeft{0%,100%{transform:translate(8px,0);}50%{transform:translate(-10px,0);}}
  @keyframes nudgeRight{0%,100%{transform:translate(-8px,0);}50%{transform:translate(12px,0);}}
  @keyframes hingeBend{0%,100%{transform:rotate(0deg);}50%{transform:rotate(48deg);}}
  @keyframes squatDrop{0%,100%{transform:translate(0,0);}50%{transform:translate(0,22px);}}
  @keyframes sledPress{0%,100%{transform:translate(0,0);}50%{transform:translate(28px,0);}}

  @keyframes kneeOutL{0%,100%{transform:rotate(-14deg);}50%{transform:rotate(32deg);}}
  @keyframes kneeOutR{0%,100%{transform:rotate(14deg);}50%{transform:rotate(-32deg);}}
  @keyframes pullDown{0%,100%{transform:translate(0,-22px);}50%{transform:translate(0,28px);}}
  @keyframes rowBack{0%,100%{transform:translate(16px,0);}50%{transform:translate(-12px,0);}}
  @keyframes pressOut{0%,100%{transform:rotate(55deg);}50%{transform:rotate(0deg);}}
  @keyframes flyInL{0%,100%{transform:rotate(18deg);}50%{transform:rotate(-48deg);}}
  @keyframes flyInR{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(48deg);}}
  @keyframes rearPull{0%,100%{transform:translate(14px,8px);}50%{transform:translate(-8px,-6px);}}
  @keyframes armRaise{0%,100%{transform:rotate(70deg);}50%{transform:rotate(0deg);}}
  @keyframes curlUp{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-100deg);}}
  @keyframes pushDown{0%,100%{transform:rotate(-70deg);}50%{transform:rotate(0deg);}}
  @keyframes overheadExt{0%,100%{transform:rotate(80deg);}50%{transform:rotate(0deg);}}
  @keyframes plankLift{0%,100%{transform:translate(0,8px);}50%{transform:translate(0,-4px);}}
  @keyframes crunchCurl{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-30deg);}}
  @keyframes thrustUp{0%,100%{transform:translate(0,16px);}50%{transform:translate(0,-8px);}}
  @keyframes kneeExt{0%,100%{transform:rotate(50deg);}50%{transform:rotate(0deg);}}
  @keyframes hamCurl{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-55deg);}}

function equipBrand(str){
  var s = str.toLowerCase();
  if (s.indexOf("body masters")>=0) return {label:"Body Masters", color:C.bodyMasters};
  if (s.indexOf("cybex")>=0) return {label:"Cybex", color:C.cybex};
  if (s.indexOf("precor")>=0) return {label:"Precor", color:C.precor};
  if (s.indexOf("hoist")>=0) return {label:"Hoist", color:C.hoist};
  if (s.indexOf("hammer strength")>=0) return {label:"Hammer Strength", color:C.hammer};
  if (s.indexOf("life fitness")>=0) return {label:"Life Fitness", color:C.lifeFitness};
  if (s.indexOf("keiser")>=0) return {label:"Keiser", color:C.keiser};
  if (s.indexOf("dumbbell")>=0 || s.indexOf("barbell")>=0 || s.indexOf("kettlebell")>=0) return {label:"Free Weights", color:C.freeWeights};
  if (s.indexOf("cable")>=0) return {label:"Cable", color:C.cable};
  return {label:"Machine", color:C.hammer};
}
/* ============================= PROGRESSION LOGIC =============================
   NSCA/ACSM-based double progression: top of rep range at the SAME weight for
   2 sessions in a row -> +5-10% compound, +2.5-5% isolation. */
function parseRepRange(repsStr){
  if (!repsStr || /yd|walk|controlled/i.test(repsStr)) return null;
  var nums = (repsStr.match(/\d+/g)||[]).map(Number);
  if (nums.length===0) return null;
  if (nums.length===1) return {min:nums[0],max:nums[0]};
  return {min:nums[0],max:nums[1]};
}
function isCompound(primaryMuscles){
  var keys=["glute_max","glute_med","quads","hamstrings","chest","lats","front_delts"];
  return (primaryMuscles||[]).some(function(m){return keys.indexOf(m)>=0;});
}
function roundWeight(w,compound){
  var step = w>=100?5:(compound?5:2.5);
  return Math.round(w/step)*step;
}
function getProgressionSuggestion(exercise,last2){
  var range=parseRepRange(exercise.reps);
  if (!range) return {status:"not_applicable",reason:"Not a rep-based exercise (carry/core work)."};
  if (!last2||last2.length<2) return {status:"hold",reason:"Need at least 2 logged sessions to evaluate."};
  var a=last2[0],b=last2[1];
  if (a.weight!==b.weight){
    return {status:"hold",reason:"Weight changed between sessions ("+b.weight+" → "+a.weight+") — need 2 sessions at the SAME weight to confirm readiness."};
  }
  if (a.reps<range.max||b.reps<range.max){
    return {status:"hold",reason:"Haven't hit the top of the rep range ("+range.max+") on both of the last 2 sessions yet. Last 2: "+b.reps+", "+a.reps+" reps at "+a.weight+"."};
  }
  var compound=isCompound(exercise.primary);
  var pctLow=compound?0.05:0.025, pctHigh=compound?0.10:0.05;
  var step=a.weight>=100?5:(compound?5:2.5);
  var lo=roundWeight(a.weight*(1+pctLow),compound);
  var hi=roundWeight(a.weight*(1+pctHigh),compound);
  if (lo<=a.weight) lo=a.weight+step;
  if (hi<=a.weight) hi=a.weight+step;
  var suggested = lo===hi?lo:Math.max(lo,hi-step);
  return {status:"increase",
    reason:"Hit "+range.max+"+ reps at "+a.weight+" for 2 sessions in a row — ready to progress.",
    currentWeight:a.weight,suggestedWeight:suggested,
    pctRange:(pctLow*100).toFixed(1)+"–"+(pctHigh*100).toFixed(1)+"%",compound:compound};
}

}

  {"ref": "2 Corinthians 4:17", "refEs": "2 Corintios 4:17", "en": "For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory;", "es": "Porque lo que al presente es momentáneo y leve de nuestra tribulación, nos obra un sobremanera alto y eterno peso de gloria;"},
  {"ref": "Hebrews 10:23", "refEs": "Hebreos 10:23", "en": "Let us hold fast the profession of our faith without wavering; (for he is faithful that promised;)", "es": "Mantengamos firme la profesión de nuestra fe sin fluctuar; que fiel es el que prometió:"},
  {"ref": "Isaiah 40:31", "refEs": "Isaías 40:31", "en": "But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", "es": "Mas los que esperan á Jehová tendrán nuevas fuerzas; levantarán las alas como águilas; correrán, y no se cansarán; caminarán, y no se fatigarán."},
  {"ref": "Psalm 37:23", "refEs": "Salmos 37:23", "en": "The steps of a good man are ordered by the Lord: and he delighteth in his way.", "es": "Por Jehová son ordenados los pasos del hombre, y aprueba su camino."},
  {"ref": "Psalm 9:10", "refEs": "Salmos 9:10", "en": "And they that know thy name will put their trust in thee: for thou, Lord, hast not forsaken them that seek thee.", "es": "Y en ti confiarán los que conocen tu nombre; por cuanto tú, oh Jehová, no desamparaste á los que te buscaron."},
  {"ref": "Proverbs 24:16", "refEs": "Proverbios 24:16", "en": "For a just man falleth seven times, and riseth up again: but the wicked shall fall into mischief.", "es": "Porque siete veces cae el justo, y se torna á levantar; mas los impíos caerán en el mal."},
  {"ref": "Romans 12:21", "refEs": "Romanos 12:21", "en": "Be not overcome of evil, but overcome evil with good.", "es": "No seas vencido de lo malo; mas vence con el bien el mal."},
  {"ref": "Psalm 94:19", "refEs": "Salmos 94:19", "en": "In the multitude of my thoughts within me thy comforts delight my soul.", "es": "En la multitud de mis pensamientos dentro de mí, tus consolaciones alegraban mi alma."},
  {"ref": "Isaiah 30:21", "refEs": "Isaías 30:21", "en": "And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.", "es": "Entonces tus oídos oirán á tus espaldas palabra que diga: Este es el camino, andad por él; y no echéis á la mano derecha, ni tampoco torzáis á la mano izquierda."},
  {"ref": "Psalm 27:14", "refEs": "Salmos 27:14", "en": "Wait on the Lord: be of good courage, and he shall strengthen thine heart: wait, I say, on the Lord.", "es": "Aguarda á Jehová; esfuérzate, y aliéntese tu corazón: sí, espera á Jehová."},
  {"ref": "Ephesians 4:23", "refEs": "Efesios 4:23", "en": "And be renewed in the spirit of your mind;", "es": "Y á renovaros en el espíritu de vuestra mente,"},
  {"ref": "Psalm 107:9", "refEs": "Salmos 107:9", "en": "For he satisfieth the longing soul, and filleth the hungry soul with goodness.", "es": "Porque sació al alma menesterosa, y llenó de bien al alma hambrienta."},
  {"ref": "2 Corinthians 12:10", "refEs": "2 Corintios 12:10", "en": "Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for Christ’s sake: for when I am weak, then am I strong.", "es": "Por lo cual me gozo en las flaquezas, en afrentas, en necesidades, en persecuciones, en angustias por Cristo; porque cuando soy flaco, entonces soy poderoso."},
  {"ref": "Psalm 147:3", "refEs": "Salmos 147:3", "en": "He healeth the broken in heart, and bindeth up their wounds.", "es": "El sana á los quebrantados de corazón, y liga sus heridas."},
  {"ref": "2 Thessalonians 3:3", "refEs": "2 Tesalonicenses 3:3", "en": "But the Lord is faithful, who shall stablish you, and keep you from evil.", "es": "Mas fiel es el Señor, que os confirmará y guardará del mal."},
  {"ref": "Isaiah 43:19", "refEs": "Isaías 43:19", "en": "Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.", "es": "He aquí que yo hago cosa nueva: presto saldrá á luz: ¿no la sabréis? Otra vez pondré camino en el desierto, y ríos en la soledad."},
  {"ref": "Psalm 18:32", "refEs": "Salmos 18:32", "en": "It is God that girdeth me with strength, and maketh my way perfect.", "es": "Dios es el que me ciñe de fuerza, é hizo perfecto mi camino;"},
  {"ref": "Isaiah 40:28", "refEs": "Isaías 40:28", "en": "Hast thou not known? hast thou not heard, that the everlasting God, the Lord, the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding.", "es": "¿No has sabido, no has oído que el Dios del siglo es Jehová, el cual crió los términos de la tierra? No se trabaja, ni se fatiga con cansancio, y su entendimiento no hay quien lo alcance."},
  {"ref": "1 Timothy 6:11", "refEs": "1 Timoteo 6:11", "en": "But thou, O man of God, flee these things; and follow after righteousness, godliness, faith, love, patience, meekness.", "es": "Mas tú, oh hombre de Dios, huye de estas cosas, y sigue la justicia, la piedad, la fe, la caridad, la paciencia, la mansedumbre."},
  {"ref": "Isaiah 32:17", "refEs": "Isaías 32:17", "en": "And the work of righteousness shall be peace; and the effect of righteousness quietness and assurance for ever.", "es": "Y el efecto de la justicia será paz; y la labor de justicia, reposo y seguridad para siempre."},
  {"ref": "Psalm 127:1", "refEs": "Salmos 127:1", "en": "Except the Lord build the house, they labour in vain that build it: except the Lord keep the city, the watchman waketh but in vain.", "es": "SI Jehová no edificare la casa, en vano trabajan los que la edifican: si Jehová no guardare la ciudad, en vano vela la guarda."},
  {"ref": "1 Corinthians 9:25", "refEs": "1 Corintios 9:25", "en": "And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.", "es": "Y todo aquel que lucha, de todo se abstiene: y ellos, á la verdad, para recibir una corona corruptible; mas nosotros, incorruptible."},
  {"ref": "Proverbs 11:25", "refEs": "Proverbios 11:25", "en": "The liberal soul shall be made fat: and he that watereth shall be watered also himself.", "es": "El alma liberal será engordada: y el que saciare, él también será saciado."},
  {"ref": "1 Chronicles 28:20", "refEs": "1 Crónicas 28:20", "en": "And David said to Solomon his son, Be strong and of good courage, and do it: fear not, nor be dismayed: for the Lord God, even my God, will be with thee; he will not fail thee, nor forsake thee, until thou hast finished all the work for the service of the house of the Lord.", "es": "Dijo más David á Salomón su hijo: Anímate y esfuérzate, y ponlo por obra; no temas, ni desmayes, porque el Dios Jehová, mi Dios, será contigo: él no te dejará, ni te desamparará, hasta que acabes toda la obra para el servicio de la casa de Jehová."},
  {"ref": "1 Corinthians 6:19", "refEs": "1 Corintios 6:19", "en": "What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?", "es": "¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual tenéis de Dios, y que no sois vuestros?"},
  {"ref": "Psalm 147:10", "refEs": "Salmos 147:10", "en": "He delighteth not in the strength of the horse: he taketh not pleasure in the legs of a man.", "es": "No toma contentamiento en la fortaleza del caballo, ni se complace en las piernas del hombre."},
  {"ref": "Romans 15:13", "refEs": "Romanos 15:13", "en": "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "es": "Y el Dios de esperanza os llene de todo gozo y paz creyendo, para que abundéis en esperanza por la virtud del Espíritu Santo."},
  {"ref": "Psalm 28:7", "refEs": "Salmos 28:7", "en": "The Lord is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.", "es": "Jehová es mi fortaleza y mi escudo: en él esperó mi corazón, y fuí ayudado; por lo que se gozó mi corazón, y con mi canción le alabaré."},
  {"ref": "Psalm 37:4", "refEs": "Salmos 37:4", "en": "Delight thyself also in the Lord; and he shall give thee the desires of thine heart.", "es": "Pon asimismo tu delicia en Jehová, y él te dará las peticiones de tu corazón."},
  {"ref": "Proverbs 4:26", "refEs": "Proverbios 4:26", "en": "Ponder the path of thy feet, and let all thy ways be established.", "es": "Examina la senda de tus pies, y todos tus caminos sean ordenados."},
  {"ref": "Psalm 121:7", "refEs": "Salmos 121:7", "en": "The Lord shall preserve thee from all evil: he shall preserve thy soul.", "es": "Jehová te guardará de todo mal: él guardará tu alma."},
  {"ref": "Philippians 3:12", "refEs": "Filipenses 3:12", "en": "Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Christ Jesus.", "es": "No que ya haya alcanzado, ni que ya sea perfecto; sino que prosigo, por ver si alcanzo aquello para lo cual fuí también alcanzado de Cristo Jesús."},
  {"ref": "Zechariah 10:12", "refEs": "Zacarías 10:12", "en": "And I will strengthen them in the Lord; and they shall walk up and down in his name, saith the Lord.", "es": "Y yo los fortificaré en Jehová, y caminarán en su nombre, dice Jehová."},
  {"ref": "Isaiah 26:3", "refEs": "Isaías 26:3", "en": "Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.", "es": "Tú le guardarás en completa paz, cuyo pensamiento en ti persevera; porque en ti se ha confiado."},
  {"ref": "Mark 12:30", "refEs": "Marcos 12:30", "en": "And thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength: this is the first commandment.", "es": "Amarás pues al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente, y de todas tus fuerzas; este es el principal mandamiento."},
  {"ref": "Proverbs 24:10", "refEs": "Proverbios 24:10", "en": "If thou faint in the day of adversity, thy strength is small.", "es": "Si fueres flojo en el día de trabajo, tu fuerza será reducida."},
  {"ref": "Proverbs 10:4", "refEs": "Proverbios 10:4", "en": "He becometh poor that dealeth with a slack hand: but the hand of the diligent maketh rich.", "es": "La mano negligente hace pobre: mas la mano de los diligentes enriquece."},
  {"ref": "Proverbs 29:25", "refEs": "Proverbios 29:25", "en": "The fear of man bringeth a snare: but whoso putteth his trust in the Lord shall be safe.", "es": "El temor del hombre pondrá lazo: mas el que confía en Jehová será levantado."},
  {"ref": "Nahum 1:7", "refEs": "Nahúm 1:7", "en": "The Lord is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", "es": "Bueno es Jehová para fortaleza en el día de la angustia; y conoce á los que en él confían."},
  {"ref": "Philippians 4:13", "refEs": "Filipenses 4:13", "en": "I can do all things through Christ which strengtheneth me.", "es": "Todo lo puedo en Cristo que me fortalece."},
  {"ref": "Jeremiah 17:7", "refEs": "Jeremías 17:7", "en": "Blessed is the man that trusteth in the Lord, and whose hope the Lord is.", "es": "Bendito el varón que se fía en Jehová, y cuya confianza es Jehová."},
  {"ref": "Psalm 119:105", "refEs": "Salmos 119:105", "en": "Thy word is a lamp unto my feet, and a light unto my path.", "es": "NUN. Lámpara es á mis pies tu palabra, y lumbrera á mi camino."},
  {"ref": "Romans 5:4", "refEs": "Romanos 5:4", "en": "And patience, experience; and experience, hope:", "es": "Y la paciencia, prueba; y la prueba, esperanza;"},
  {"ref": "Psalm 34:18", "refEs": "Salmos 34:18", "en": "The Lord is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.", "es": "Cercano está Jehová á los quebrantados de corazón; y salvará á los contritos de espíritu."},
  {"ref": "Isaiah 54:17", "refEs": "Isaías 54:17", "en": "No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the Lord, and their righteousness is of me, saith the Lord.", "es": "Toda herramienta que fuere fabricada contra ti, no prosperará; y tú condenarás toda lengua que se levantare contra ti en juicio. Esta es la heredad de los siervos de Jehová, y su justicia de por mí, dijo Jehová."},
  {"ref": "Psalm 23:4", "refEs": "Salmos 23:4", "en": "Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.", "es": "Aunque ande en valle de sombra de muerte, no temeré mal alguno; porque tú estarás conmigo: tu vara y tu cayado me infundirán aliento."},
  {"ref": "Psalm 46:10", "refEs": "Salmos 46:10", "en": "Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.", "es": "Estad quietos, y conoced que yo soy Dios: ensalzado he de ser entre las gentes, ensalzado seré en la tierra."},
  {"ref": "Job 17:9", "refEs": "Job 17:9", "en": "The righteous also shall hold on his way, and he that hath clean hands shall be stronger and stronger.", "es": "No obstante, proseguirá el justo su camino, y el limpio de manos aumentará la fuerza."},
  {"ref": "Philippians 3:13", "refEs": "Filipenses 3:13", "en": "Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before,", "es": "Hermanos, yo mismo no hago cuenta de haberlo ya alcanzado; pero una cosa hago: olvidando ciertamente lo que queda atrás, y extendiéndome á lo que está delante,"},
  {"ref": "Matthew 7:24", "refEs": "Mateo 7:24", "en": "Therefore whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock:", "es": "Cualquiera, pues, que me oye estas palabras, y las hace, le compararé á un hombre prudente, que edificó su casa sobre la peña;"},
  {"ref": "John 14:1", "refEs": "Juan 14:1", "en": "Let not your heart be troubled: ye believe in God, believe also in me.", "es": "NO se turbe vuestro corazón: creéis en Dios, creed también en mí."},
  {"ref": "Hebrews 12:1", "refEs": "Hebreos 12:1", "en": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,", "es": "POR tanto nosotros también, teniendo en derredor nuestro una tan grande nube de testigos, dejando todo el peso del pecado que nos rodea, corramos con paciencia la carrera que nos es propuesta,"},
  {"ref": "Proverbs 16:3", "refEs": "Proverbios 16:3", "en": "Commit thy works unto the Lord, and thy thoughts shall be established.", "es": "Encomienda á Jehová tus obras, y tus pensamientos serán afirmados."},
  {"ref": "Isaiah 64:8", "refEs": "Isaías 64:8", "en": "But now, O Lord, thou art our father; we are the clay, and thou our potter; and we all are the work of thy hand.", "es": "Ahora pues, Jehová, tú eres nuestro padre; nosotros lodo, y tú el que nos formaste; así que obra de tus manos, todos nosotros."},
  {"ref": "Joshua 1:9", "refEs": "Josué 1:9", "en": "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee whithersoever thou goest.", "es": "Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que fueres."},
  {"ref": "Philippians 2:13", "refEs": "Filipenses 2:13", "en": "For it is God which worketh in you both to will and to do of his good pleasure.", "es": "Porque Dios es el que en vosotros obra así el querer como el hacer, por su buena voluntad."},
  {"ref": "Psalm 18:1", "refEs": "Salmos 18:1", "en": "I will love thee, O Lord, my strength.", "es": "AMARTE he, oh Jehová, fortaleza mía."},
  {"ref": "Psalm 62:7", "refEs": "Salmos 62:7", "en": "In God is my salvation and my glory: the rock of my strength, and my refuge, is in God.", "es": "En Dios está mi salvación y mi gloria: en Dios está la roca de mi fortaleza, y mi refugio."},
  {"ref": "Galatians 6:7", "refEs": "Gálatas 6:7", "en": "Be not deceived; God is not mocked: for whatsoever a man soweth, that shall he also reap.", "es": "No os engañéis: Dios no puede ser burlado: que todo lo que el hombre sembrare, eso también segará."},
  {"ref": "Psalm 59:16", "refEs": "Salmos 59:16", "en": "But I will sing of thy power; yea, I will sing aloud of thy mercy in the morning: for thou hast been my defence and refuge in the day of my trouble.", "es": "Yo empero cantaré tu fortaleza, y loaré de mañana tu misericordia: porque has sido mi amparo y refugio en el día de mi angustia."},
  {"ref": "1 Timothy 4:8", "refEs": "1 Timoteo 4:8", "en": "For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.", "es": "Porque el ejercicio corporal para poco es provechoso; mas la piedad para todo aprovecha, pues tiene promesa de esta vida presente, y de la venidera."},
  {"ref": "Psalm 119:9", "refEs": "Salmos 119:9", "en": "Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word.", "es": "BETH ¿Con qué limpiará el joven su camino? Con guardar tu palabra."},
  {"ref": "1 John 5:4", "refEs": "1 Juan 5:4", "en": "For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith.", "es": "Porque todo aquello que es nacido de Dios vence al mundo: y esta es la victoria que vence al mundo, nuestra fe."},
  {"ref": "1 Corinthians 9:27", "refEs": "1 Corintios 9:27", "en": "But I keep under my body, and bring it into subjection: lest that by any means, when I have preached to others, I myself should be a castaway.", "es": "Antes hiero mi cuerpo, y lo pongo en servidumbre; no sea que, habiendo predicado á otros, yo mismo venga á ser reprobado."},
  {"ref": "Haggai 2:4", "refEs": "Hageo 2:4", "en": "Yet now be strong, O Zerubbabel, saith the Lord; and be strong, O Joshua, son of Josedech, the high priest; and be strong, all ye people of the land, saith the Lord, and work: for I am with you, saith the Lord of hosts:", "es": "Pues ahora, Zorobabel, esfuérzate, dice Jehová; esfuérzate también Josué, hijo de Josadac, gran sacerdote; y cobra ánimo, pueblo todo de la tierra, dice Jehová, y obrad: porque yo soy con vosotros, dice Jehová de los ejércitos."},
  {"ref": "1 Kings 2:3", "refEs": "1 Reyes 2:3", "en": "And keep the charge of the Lord thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself:", "es": "Guarda la ordenanza de Jehová tu Dios, andando en sus caminos, y observando sus estatutos y mandamientos, y sus derechos y sus testimonios, de la manera que está escrito en la ley de Moisés, para que seas dichoso en todo lo que hicieres, y en todo aquello á que te tornares;"},
  {"ref": "Psalm 19:14", "refEs": "Salmos 19:14", "en": "Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O Lord, my strength, and my redeemer.", "es": "Sean gratos los dichos de mi boca y la meditación de mi corazón delante de ti, oh Jehová, roca mía, y redentor mío."},
  {"ref": "1 Corinthians 6:20", "refEs": "1 Corintios 6:20", "en": "For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.", "es": "Porque comprados sois por precio: glorificad pues á Dios en vuestro cuerpo y en vuestro espíritu, los cuales son de Dios."},
  {"ref": "Ephesians 6:13", "refEs": "Efesios 6:13", "en": "Wherefore take unto you the whole armour of God, that ye may be able to withstand in the evil day, and having done all, to stand.", "es": "Por tanto, tomad toda la armadura de Dios, para que podáis resistir en el día malo, y estar firmes, habiendo acabado todo."},
  {"ref": "Psalm 86:11", "refEs": "Salmos 86:11", "en": "Teach me thy way, O Lord; I will walk in thy truth: unite my heart to fear thy name.", "es": "Enséñame, oh Jehová, tu camino; caminaré yo en tu verdad: consolida mi corazón para que tema tu nombre."},
  {"ref": "Luke 1:37", "refEs": "Lucas 1:37", "en": "For with God nothing shall be impossible.", "es": "Porque ninguna cosa es imposible para Dios."},
  {"ref": "Philippians 1:20", "refEs": "Filipenses 1:20", "en": "According to my earnest expectation and my hope, that in nothing I shall be ashamed, but that with all boldness, as always, so now also Christ shall be magnified in my body, whether it be by life, or by death.", "es": "Conforme á mi mira y esperanza, que en nada seré confundido; antes bien con toda confianza, como siempre, ahora también será engrandecido Cristo en mi cuerpo, ó por vida, ó por muerte."},
  {"ref": "Ephesians 6:11", "refEs": "Efesios 6:11", "en": "Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.", "es": "Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo."},
  {"ref": "Deuteronomy 31:8", "refEs": "Deuteronomio 31:8", "en": "And the Lord, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.", "es": "Y Jehová es el que va delante de ti; él será contigo, no te dejará, ni te desamparará; no temas, ni te intimides."},
  {"ref": "Psalm 61:2", "refEs": "Salmos 61:2", "en": "From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.", "es": "Desde el cabo de la tierra clamaré á ti, cuando mi corazón desmayare: á la peña más alta que yo me conduzcas."},
  {"ref": "Proverbs 20:29", "refEs": "Proverbios 20:29", "en": "The glory of young men is their strength: and the beauty of old men is the gray head.", "es": "La gloria de los jóvenes es su fortaleza, y la hermosura de los viejos la vejez."},
  {"ref": "Judges 6:12", "refEs": "Jueces 6:12", "en": "And the angel of the Lord appeared unto him, and said unto him, The Lord is with thee, thou mighty man of valour.", "es": "Y el ángel de Jehová se le apareció, y díjole: Jehová es contigo, varón esforzado."},
  {"ref": "Romans 13:12", "refEs": "Romanos 13:12", "en": "The night is far spent, the day is at hand: let us therefore cast off the works of darkness, and let us put on the armour of light.", "es": "La noche ha pasado, y ha llegado el día: echemos, pues, las obras de las tinieblas, y vistámonos las armas de luz."},
  {"ref": "Romans 8:37", "refEs": "Romanos 8:37", "en": "Nay, in all these things we are more than conquerors through him that loved us.", "es": "Antes, en todas estas cosas hacemos más que vencer por medio de aquel que nos amó."},
  {"ref": "Matthew 5:16", "refEs": "Mateo 5:16", "en": "Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.", "es": "Así alumbre vuestra luz delante de los hombres, para que vean vuestras obras buenas, y glorifiquen á vuestro Padre que está en los cielos."},
  {"ref": "2 Corinthians 5:17", "refEs": "2 Corintios 5:17", "en": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", "es": "De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas."},
  {"ref": "Mark 9:23", "refEs": "Marcos 9:23", "en": "Jesus said unto him, If thou canst believe, all things are possible to him that believeth.", "es": "Y Jesús le dijo: Si puedes creer, al que cree todo es posible."},
  {"ref": "Lamentations 3:25", "refEs": "Lamentaciones 3:25", "en": "The Lord is good unto them that wait for him, to the soul that seeketh him.", "es": "Bueno es Jehová á los que en él esperan, al alma que le buscare."},
  {"ref": "Psalm 18:29", "refEs": "Salmos 18:29", "en": "For by thee I have run through a troop; and by my God have I leaped over a wall.", "es": "Porque contigo desharé ejércitos; y con mi Dios asaltaré muros."},
  {"ref": "2 Timothy 2:1", "refEs": "2 Timoteo 2:1", "en": "Thou therefore, my son, be strong in the grace that is in Christ Jesus.", "es": "PUES tú, hijo mío, esfuérzate en la gracia que es en Cristo Jesús."},
  {"ref": "Lamentations 3:23", "refEs": "Lamentaciones 3:23", "en": "They are new every morning: great is thy faithfulness.", "es": "Nuevas son cada mañana; grande es tu fidelidad."},
  {"ref": "Hebrews 12:11", "refEs": "Hebreos 12:11", "en": "Now no chastening for the present seemeth to be joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby.", "es": "Es verdad que ningún castigo al presente parece ser causa de gozo, sino de tristeza; mas después da fruto apacible de justicia á los que en él son ejercitados."},
  {"ref": "Psalm 139:23", "refEs": "Salmos 139:23", "en": "Search me, O God, and know my heart: try me, and know my thoughts:", "es": "Examíname, oh Dios, y conoce mi corazón: pruébame y reconoce mis pensamientos:"},
  {"ref": "Exodus 15:2", "refEs": "Éxodo 15:2", "en": "The Lord is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father’s God, and I will exalt him.", "es": "Jehová es mi fortaleza, y mi canción, y hame sido por salud: éste es mi Dios, y á éste engrandeceré; Dios de mi padre, y á éste ensalzaré."},
  {"ref": "Philippians 3:21", "refEs": "Filipenses 3:21", "en": "Who shall change our vile body, that it may be fashioned like unto his glorious body, according to the working whereby he is able even to subdue all things unto himself.", "es": "El cual transformará el cuerpo de nuestra bajeza, para ser semejante al cuerpo de su gloria, por la operación con la cual puede también sujetar á sí todas las cosas."},
  {"ref": "Psalm 46:1", "refEs": "Salmos 46:1", "en": "God is our refuge and strength, a very present help in trouble.", "es": "DIOS es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones."},
  {"ref": "Romans 5:3", "refEs": "Romanos 5:3", "en": "And not only so, but we glory in tribulations also: knowing that tribulation worketh patience;", "es": "Y no sólo esto, mas aun nos gloriamos en las tribulaciones, sabiendo que la tribulación produce paciencia;"},
  {"ref": "Psalm 139:24", "refEs": "Salmos 139:24", "en": "And see if there be any wicked way in me, and lead me in the way everlasting.", "es": "Y ve si hay en mí camino de perversidad, y guíame en el camino eterno."},
  {"ref": "Lamentations 3:26", "refEs": "Lamentaciones 3:26", "en": "It is good that a man should both hope and quietly wait for the salvation of the Lord.", "es": "Bueno es esperar callando en la salud de Jehová."},
  {"ref": "Ephesians 3:20", "refEs": "Efesios 3:20", "en": "Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,", "es": "Y á Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos ó entendemos, por la potencia que obra en nosotros,"},
  {"ref": "Psalm 62:2", "refEs": "Salmos 62:2", "en": "He only is my rock and my salvation; he is my defence; I shall not be greatly moved.", "es": "El solamente es mi fuerte, y mi salud; es mi refugio, no resbalaré mucho."},
  {"ref": "1 Timothy 6:6", "refEs": "1 Timoteo 6:6", "en": "But godliness with contentment is great gain.", "es": "Empero grande granjería es la piedad con contentamiento."},
  {"ref": "Acts 1:8", "refEs": "Hechos 1:8", "en": "But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judea, and in Samaria, and unto the uttermost part of the earth.", "es": "Mas recibiréis la virtud del Espíritu Santo que vendrá sobre vosotros; y me sereís testigos en Jerusalem, y en toda Judea, y Samaria, y hasta lo último de la tierra."},
  {"ref": "Ecclesiastes 4:12", "refEs": "Eclesiastés 4:12", "en": "And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.", "es": "Y si alguno prevaleciere contra el uno, dos estarán contra él; y cordón de tres dobleces no presto se rompe."},
  {"ref": "1 Corinthians 15:57", "refEs": "1 Corintios 15:57", "en": "But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", "es": "Mas á Dios gracias, que nos da la victoria por el Señor nuestro Jesucristo."},
  {"ref": "Matthew 19:26", "refEs": "Mateo 19:26", "en": "But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible.", "es": "Y mirándolos Jesús, les dijo: Para con los hombres imposible es esto; mas para con Dios todo es posible."},
  {"ref": "Proverbs 4:23", "refEs": "Proverbios 4:23", "en": "Keep thy heart with all diligence; for out of it are the issues of life.", "es": "Sobre toda cosa guardada guarda tu corazón; porque de él mana la vida."},
  {"ref": "James 4:7", "refEs": "Santiago 4:7", "en": "Submit yourselves therefore to God. Resist the devil, and he will flee from you.", "es": "Someteos pues á Dios; resistid al diablo, y de vosotros huirá."},
  {"ref": "1 Peter 1:13", "refEs": "1 Pedro 1:13", "en": "Wherefore gird up the loins of your mind, be sober, and hope to the end for the grace that is to be brought unto you at the revelation of Jesus Christ;", "es": "Por lo cual, teniendo los lomos de vuestro entendimiento ceñidos, con templanza, esperad perfectamente en la gracia que os es presentada cuando Jesucristo os es manifestado:"},
  {"ref": "Habakkuk 3:19", "refEs": "Habacuc 3:19", "en": "The Lord God is my strength, and he will make my feet like hinds’ feet, and he will make me to walk upon mine high places. To the chief singer on my stringed instruments.", "es": "Jehová el Señor es mi fortaleza, el cual pondrá mis pies como de ciervas, y me hará andar sobre mis alturas. Al jefe de los cantores sobre mis instrumentos de cuerdas."},
  {"ref": "Romans 8:18", "refEs": "Romanos 8:18", "en": "For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.", "es": "Porque tengo por cierto que lo que en este tiempo se padece, no es de comparar con la gloria venidera que en nosotros ha de ser manifestada."},
  {"ref": "Colossians 1:11", "refEs": "Colosenses 1:11", "en": "Strengthened with all might, according to his glorious power, unto all patience and longsuffering with joyfulness;", "es": "Corroborados de toda fortaleza, conforme á la potencia de su gloria, para toda tolerancia y largura de ánimo con gozo;"},
  {"ref": "Psalm 112:7", "refEs": "Salmos 112:7", "en": "He shall not be afraid of evil tidings: his heart is fixed, trusting in the Lord.", "es": "De mala fama no tendrá temor: su corazón está apercibido, confiado en Jehová."},
  {"ref": "Numbers 6:26", "refEs": "Números 6:26", "en": "The Lord lift up his countenance upon thee, and give thee peace.", "es": "Jehová alce á ti su rostro, y ponga en ti paz."},
  {"ref": "Psalm 27:1", "refEs": "Salmos 27:1", "en": "The Lord is my light and my salvation; whom shall I fear? the Lord is the strength of my life; of whom shall I be afraid?", "es": "JEHOVÁ es mi luz y mi salvación: ¿de quién temeré? Jehová es la fortaleza de mi vida: ¿de quién he de atemorizarme?"},
  {"ref": "Psalm 138:8", "refEs": "Salmos 138:8", "en": "The Lord will perfect that which concerneth me: thy mercy, O Lord, endureth for ever: forsake not the works of thine own hands.", "es": "Jehová cumplirá por mí: tu misericordia, oh Jehová, es para siempre; no dejarás la obra de tus manos."},
  {"ref": "Psalm 29:11", "refEs": "Salmos 29:11", "en": "The Lord will give strength unto his people; the Lord will bless his people with peace.", "es": "Jehová dará fortaleza á su pueblo: Jehová bendecirá á su pueblo en paz."},
  {"ref": "Psalm 18:2", "refEs": "Salmos 18:2", "en": "The Lord is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.", "es": "Jehová, roca mía y castillo mío, y mi libertador; Dios mío, fuerte mío, en él confiaré; escudo mío, y el cuerno de mi salud, mi refugio."},
  {"ref": "Psalm 91:11", "refEs": "Salmos 91:11", "en": "For he shall give his angels charge over thee, to keep thee in all thy ways.", "es": "Pues que á sus ángeles mandará acerca de ti, que te guarden en todos tus caminos."},
  {"ref": "Psalm 42:11", "refEs": "Salmos 42:11", "en": "Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.", "es": "¿Por qué te abates, oh alma mía, y por qué te conturbas en mí? Espera á Dios; porque aun le tengo de alabar; es él salvamento delante de mí, y el Dios mío."},
  {"ref": "1 Corinthians 9:26", "refEs": "1 Corintios 9:26", "en": "I therefore so run, not as uncertainly; so fight I, not as one that beateth the air:", "es": "Así que, yo de esta manera corro, no como á cosa incierta; de esta manera peleo, no como quien hiere el aire:"},
  {"ref": "Psalm 90:12", "refEs": "Salmos 90:12", "en": "So teach us to number our days, that we may apply our hearts unto wisdom.", "es": "Enséñanos de tal modo á contar nuestros días, que traigamos al corazón sabiduría."},
  {"ref": "Psalm 84:11", "refEs": "Salmos 84:11", "en": "For the Lord God is a sun and shield: the Lord will give grace and glory: no good thing will he withhold from them that walk uprightly.", "es": "Porque sol y escudo es Jehová Dios: gracia y gloria dará Jehová: no quitará el bien á los que en integridad andan."},
  {"ref": "1 Corinthians 9:24", "refEs": "1 Corintios 9:24", "en": "Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain.", "es": "¿No sabéis que los que corren en el estadio, todos á la verdad corren, mas uno lleva el premio? Corred de tal manera que lo obtengáis."},
  {"ref": "Matthew 22:37", "refEs": "Mateo 22:37", "en": "Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.", "es": "Y Jesús le dijo: Amarás al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente."},
  {"ref": "Isaiah 55:9", "refEs": "Isaías 55:9", "en": "For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.", "es": "Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos."},
  {"ref": "Isaiah 41:13", "refEs": "Isaías 41:13", "en": "For I the Lord thy God will hold thy right hand, saying unto thee, Fear not; I will help thee.", "es": "Porque yo Jehová soy tu Dios, que te ase de tu mano derecha, y te dice: No temas, yo te ayudé."},
  {"ref": "1 Kings 2:2", "refEs": "1 Reyes 2:2", "en": "I go the way of all the earth: be thou strong therefore, and shew thyself a man;", "es": "Yo voy el camino de toda la tierra: esfuérzate, y sé varón."},
  {"ref": "2 Chronicles 16:9", "refEs": "2 Crónicas 16:9", "en": "For the eyes of the Lord run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him. Herein thou hast done foolishly: therefore from henceforth thou shalt have wars.", "es": "Porque los ojos de Jehová contemplan toda la tierra, para corroborar á los que tienen corazón perfecto para con él. Locamente has hecho en esto; porque de aquí adelante habrá guerra contra ti."},
  {"ref": "Hebrews 11:6", "refEs": "Hebreos 11:6", "en": "But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.", "es": "Empero sin fe es imposible agradar á Dios; porque es menester que el que á Dios se allega, crea que le hay, y que es galardonador de los que le buscan."},
  {"ref": "2 Corinthians 12:9", "refEs": "2 Corintios 12:9", "en": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "es": "Y me ha dicho: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona. Por tanto, de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo."},
  {"ref": "James 1:3", "refEs": "Santiago 1:3", "en": "Knowing this, that the trying of your faith worketh patience.", "es": "Sabiendo que la prueba de vuestra fe obra paciencia."},
  {"ref": "Psalm 18:34", "refEs": "Salmos 18:34", "en": "He teacheth my hands to war, so that a bow of steel is broken by mine arms.", "es": "Quien enseña mis manos para la batalla, y será quebrado con mis brazos el arco de acero."},
  {"ref": "2 Timothy 2:15", "refEs": "2 Timoteo 2:15", "en": "Study to shew thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth.", "es": "Procura con diligencia presentarte á Dios aprobado, como obrero que no tiene de qué avergonzarse, que traza bien la palabra de verdad."},
  {"ref": "Romans 12:12", "refEs": "Romanos 12:12", "en": "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "es": "Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración;"},
  {"ref": "Romans 12:1", "refEs": "Romanos 12:1", "en": "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.", "es": "ASÍ que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable á Dios, que es vuestro racional culto."},
  {"ref": "Proverbs 18:10", "refEs": "Proverbios 18:10", "en": "The name of the Lord is a strong tower: the righteous runneth into it, and is safe.", "es": "Torre fuerte es el nombre de Jehová: á él correrá el justo, y será levantado."},
  {"ref": "Matthew 11:28", "refEs": "Mateo 11:28", "en": "Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "es": "Venid á mí todos los que estáis trabajados y cargados, que yo os haré descansar."},
  {"ref": "Ephesians 6:10", "refEs": "Efesios 6:10", "en": "Finally, my brethren, be strong in the Lord, and in the power of his might.", "es": "Por lo demás, hermanos míos, confortaos en el Señor, y en la potencia de su fortaleza."},
  {"ref": "John 16:33", "refEs": "Juan 16:33", "en": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", "es": "Estas cosas os he hablado, para que en mí tengáis paz. En el mundo tendréis aflicción: mas confiad, yo he vencido al mundo."},
  {"ref": "2 Timothy 4:8", "refEs": "2 Timoteo 4:8", "en": "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day: and not to me only, but unto all them also that love his appearing.", "es": "Por lo demás, me está guardada la corona de justicia, la cual me dará el Señor, juez justo, en aquel día; y no sólo á mí, sino también á todos los que aman su venida."},
  {"ref": "1 Samuel 30:6", "refEs": "1 Samuel 30:6", "en": "And David was greatly distressed; for the people spake of stoning him, because the soul of all the people was grieved, every man for his sons and for his daughters: but David encouraged himself in the Lord his God.", "es": "Y David fué muy angustiado, porque el pueblo hablaba de apedrearlo; porque todo el pueblo estaba con ánimo amargo, cada uno por sus hijos y por sus hijas: mas David se esforzó en Jehová su Dios."},
  {"ref": "Psalm 4:8", "refEs": "Salmos 4:8", "en": "I will both lay me down in peace, and sleep: for thou, Lord, only makest me dwell in safety.", "es": "En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me harás estar confiado."},
  {"ref": "1 Thessalonians 5:16", "refEs": "1 Tesalonicenses 5:16", "en": "Rejoice evermore.", "es": "Estad siempre gozosos."},
  {"ref": "Psalm 90:17", "refEs": "Salmos 90:17", "en": "And let the beauty of the Lord our God be upon us: and establish thou the work of our hands upon us; yea, the work of our hands establish thou it.", "es": "Y sea la luz de Jehová nuestro Dios sobre nosotros: y ordena en nosotros la obra de nuestras manos, la obra de nuestras manos confirma."},
  {"ref": "1 Timothy 6:12", "refEs": "1 Timoteo 6:12", "en": "Fight the good fight of faith, lay hold on eternal life, whereunto thou art also called, and hast professed a good profession before many witnesses.", "es": "Pelea la buena batalla de la fe, echa mano de la vida eterna, á la cual asimismo eres llamado, habiendo hecho buena profesión delante de muchos testigos."},
  {"ref": "Psalm 147:11", "refEs": "Salmos 147:11", "en": "The Lord taketh pleasure in them that fear him, in those that hope in his mercy.", "es": "Complácese Jehová en los que le temen, y en los que esperan en su misericordia."},
  {"ref": "John 14:27", "refEs": "Juan 14:27", "en": "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.", "es": "La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo."},
  {"ref": "Hebrews 6:19", "refEs": "Hebreos 6:19", "en": "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;", "es": "La cual tenemos como segura y firme ancla del alma, y que entra hasta dentro del velo;"},
  {"ref": "Isaiah 33:2", "refEs": "Isaías 33:2", "en": "O Lord, be gracious unto us; we have waited for thee: be thou their arm every morning, our salvation also in the time of trouble.", "es": "Oh Jehová, ten misericordia de nosotros, á ti hemos esperado: tú, brazo de ellos en la mañana, sé también nuestra salud en tiempo de la tribulación."},
  {"ref": "Philippians 4:19", "refEs": "Filipenses 4:19", "en": "But my God shall supply all your need according to his riches in glory by Christ Jesus.", "es": "Mi Dios, pues, suplirá todo lo que os falta conforme á sus riquezas en gloria en Cristo Jesús."},
  {"ref": "Psalm 9:9", "refEs": "Salmos 9:9", "en": "The Lord also will be a refuge for the oppressed, a refuge in times of trouble.", "es": "Y será Jehová refugio al pobre, refugio para el tiempo de angustia."},
  {"ref": "Matthew 6:33", "refEs": "Mateo 6:33", "en": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "es": "Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas."},
  {"ref": "1 Peter 5:10", "refEs": "1 Pedro 5:10", "en": "But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.", "es": "Mas el Dios de toda gracia, que nos ha llamado á su gloria eterna por Jesucristo, después que hubiereis un poco de tiempo padecido, él mismo os perfeccione, confirme, corrobore y establezca."},
  {"ref": "2 Thessalonians 3:13", "refEs": "2 Tesalonicenses 3:13", "en": "But ye, brethren, be not weary in well doing.", "es": "Y vosotros, hermanos, no os canséis de hacer bien."},
  {"ref": "Psalm 20:7", "refEs": "Salmos 20:7", "en": "Some trust in chariots, and some in horses: but we will remember the name of the Lord our God.", "es": "Estos confían en carros, y aquéllos en caballos: mas nosotros del nombre de Jehová nuestro Dios tendremos memoria."},
  {"ref": "Psalm 37:7", "refEs": "Salmos 37:7", "en": "Rest in the Lord, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.", "es": "Calla á Jehová, y espera en él: no te alteres con motivo del que prospera en su camino, por el hombre que hace maldades."},
  {"ref": "Galatians 5:22", "refEs": "Gálatas 5:22", "en": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,", "es": "Mas el fruto del Espíritu es: caridad, gozo, paz, tolerancia, benignidad, bondad, fe,"},
  {"ref": "Zephaniah 3:17", "refEs": "Sofonías 3:17", "en": "The Lord thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "es": "Jehová en medio de ti, poderoso, él salvará; gozaráse sobre ti con alegría, callará de amor, se regocijará sobre ti con cantar."},
  {"ref": "Isaiah 58:11", "refEs": "Isaías 58:11", "en": "And the Lord shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.", "es": "Y Jehová te pastoreará siempre, y en las sequías hartará tu alma, y engordará tus huesos; y serás como huerta de riego, y como manadero de aguas, cuyas aguas nunca faltan."},
  {"ref": "2 Timothy 2:5", "refEs": "2 Timoteo 2:5", "en": "And if a man also strive for masteries, yet is he not crowned, except he strive lawfully.", "es": "Y aun también el que lidia, no es coronado si no lidiare legítimamente."},
  {"ref": "1 Corinthians 15:58", "refEs": "1 Corintios 15:58", "en": "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", "es": "Así que, hermanos míos amados, estad firmes y constantes, creciendo en la obra del Señor siempre, sabiendo que vuestro trabajo en el Señor no es vano."},
  {"ref": "Proverbs 12:24", "refEs": "Proverbios 12:24", "en": "The hand of the diligent shall bear rule: but the slothful shall be under tribute.", "es": "La mano de los diligentes se enseñoreará: mas la negligencia será tributaria."},
  {"ref": "2 Chronicles 32:7", "refEs": "2 Crónicas 32:7", "en": "Be strong and courageous, be not afraid nor dismayed for the king of Assyria, nor for all the multitude that is with him: for there be more with us than with him:", "es": "Esforzaos y confortaos; no temáis, ni hayáis miedo del rey de Asiria, ni de toda su multitud que con él viene; porque más son con nosotros que con él."},
